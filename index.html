/* ------------------------------------------------------------ first run */
/* ------------------------------------------------- voice enumeration
   getVoices() is empty until the engine has loaded them, so it has to be
   re-read on voiceschanged as well as at startup. */
/* neural voice picker — names come from what's installed on the server */
const nvSel = $('neuralvoice');
/* Only one engine is ever in use, so only show that engine's controls.
   The 180-entry browser list next to the neural picker was pure noise. */
function syncEngine(){
  const neural = S.ttsengine === 'local' && (!Play.probed || Play.available);
  const nv = document.getElementById('neuralvoice');
  const bv = document.getElementById('browservoice');
  if (nv) nv.style.display = neural ? 'block' : 'none';
  if (bv) bv.style.display = neural ? 'none'  : 'block';
}

function paintVoiceList(){
  /* Written and relayed together: this note lives in the panel only, so
     writing it here alone told nobody anything. */
  const note = document.getElementById('voicenote');
  const say = t=>{ if (note) note.textContent = t; relay('voicenote', t); };
  if (!nvSel) return;
  if (!Play.available){
    nvSel.innerHTML = '<option>none installed</option>';
    nvSel.disabled = true;
    say('No neural voices on the server — using the browser voice.');
    syncEngine();                       // must still fall back to the browser list
    return;
  }
  nvSel.disabled = false;
  nvSel.innerHTML = '';
  Play.voices.forEach(v=>{
    const o = document.createElement('option');
    o.value = v;
    o.textContent = v.replace(/^en_/,'').replace(/-/g,' ');
    nvSel.appendChild(o);
  });
  if (S.ttsvoice) nvSel.value = S.ttsvoice;
  say(Play.voices.length +
      ' neural voices · rendered on the server, and the geometry follows the real waveform.');
  syncEngine();
}
if (nvSel){
  nvSel.addEventListener('change', ()=>{ S.ttsvoice = nvSel.value; Speech.stop(); });
  FIELDS.push(()=>{ if (Play.available && S.ttsvoice) nvSel.value = S.ttsvoice; });
}
syncEngine();          // correct from the first paint
Play.probe();

const voiceSel = $('voicesel');
function loadVoices(){
  if (!Speech.supported) return;
  const v = window.speechSynthesis.getVoices();
  if (!v.length) return;
  Speech.voices = v;
  const prev = Speech.voice && Speech.voice.name;
  if (!voiceSel) return;
  voiceSel.innerHTML = '';
  v.forEach((vo,i)=>{
    const o = document.createElement('option');
    o.value = i; o.textContent = vo.name + ' · ' + vo.lang + (vo.localService ? '' : ' · net');
    voiceSel.appendChild(o);
  });
  let pick = v.findIndex(x => x.name === prev);
  if (pick < 0) pick = v.findIndex(x => x.default);
  if (pick < 0) pick = v.findIndex(x => /^en/i.test(x.lang));
  if (pick < 0) pick = 0;
  voiceSel.value = pick;
  Speech.voice = v[pick];
  note(v.length + ' voices. Local voices fire word events; some network voices do not.');
}
/* BEEP — a plain Web Audio tone. This deliberately does not touch
   speechSynthesis, so it splits the problem cleanly in two:
     beep audible, speech silent  -> the speech engine / chosen voice
     neither audible              -> the PAGE has no audio at all: muted tab,
                                     site sound blocked, wrong output device,
                                     or an embedded webview rather than a
                                     real browser                          */
let audioCtx = null;
CMD.beep = ()=>{
  try{
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC){ note('no Web Audio in this browser at all'); return; }
    audioCtx = audioCtx || new AC();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const t = audioCtx.currentTime;
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = 'sine'; o.frequency.value = 440;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.30, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.45);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(t); o.stop(t + 0.5);
    note('BEEP sent · AudioContext=' + audioCtx.state +
         ' · heard it? then audio works and the problem is the speech engine.' +
         ' Silent? then the PAGE has no audio — muted tab, site sound blocked,' +
         ' wrong output device, or not a real browser window.');
  } catch(e){ note('beep failed: ' + e.message); }
};

/* Speaks synchronously inside the click — no timer, so user activation is
   definitely still live. If this is silent but the page is otherwise fine,
   the problem is the voice or the output device, not the gesture gate. */
CMD.testvoice = ()=>{
  if (S.ttsengine === 'local' && Play.available){
    Speech.stop();
    respond('Neural voice check. This is ' + (S.ttsvoice||'the default voice') +
            ', rendered on your own server.');
    return;
  }
  if (!Speech.supported){ note('no speechSynthesis in this browser'); return; }
  Speech.stop();
  const u = new SpeechSynthesisUtterance('Resonance interface online.');
  if (Speech.voice) u.voice = Speech.voice;
  u.rate = S.vrate; u.pitch = S.vpitch; u.volume = 1;
  u.onstart = ()=> note('STARTED — audio is playing now. Hear nothing? Check output device/volume.');
  u.onend   = ()=> note('finished cleanly.');
  u.onerror = e => note('FAILED: ' + ((e && e.error) || 'unknown'));
  note('queued…');
  window.speechSynthesis.speak(u);
  setTimeout(()=>{
    if (!window.speechSynthesis.speaking && !window.speechSynthesis.pending)
      note('never started — the engine dropped it. Try a different voice (prefer a local one).');
  }, 1200);
};

CMD.diagnose = ()=>{
  const ss = window.speechSynthesis;
  const v = Speech.voice;
  note([
    'supported=' + Speech.supported,
    'voices=' + Speech.voices.length,
    'voice=' + (v ? v.name + (v.localService ? ' (local)' : ' (NETWORK)') : 'none'),
    'speaking=' + (ss ? ss.speaking : '-') + ' pending=' + (ss ? ss.pending : '-') +
      ' paused=' + (ss ? ss.paused : '-'),
    'unlocked=' + ttsUnlocked,
    'source=' + S.src + (S.src !== 'tts' ? '  <-- TTS chip is OFF' : ''),
    'origin=' + location.protocol,
    'audioCtx=' + (audioCtx ? audioCtx.state : 'not-created'),
    'ua=' + navigator.userAgent.slice(0,90)
  ].join(' · '));
};

/* ---- TALK: the user-facing conversational control. Turns on the mic
   (so the geometry reacts to your voice) AND transcription (so it
   answers). The rig keeps a mic-only toggle for visual work.        ---- */
/* Write both halves of a control. The word is hidden on a narrow viewport,
   so it cannot be the only place the state is expressed — aria-label carries
   it for anyone not reading the screen, and the icon plus the button's own
   classes have to carry it for everyone else. */
function setBtn(btn, ico, lbl){
  if (!btn) return;
  const i = btn.querySelector('.ico'), l = btn.querySelector('.lbl');
  if (i) i.textContent = ico;
  if (l) l.textContent = lbl;
  btn.setAttribute('aria-label', lbl);
}

const talkBtn = document.getElementById('talkbtn');
function syncTalk(){
  const live = Mic.active || Listen.on;
  const gated = live && Wake.armed();
  const asleep = gated && !Wake.awake;
  const [ico, lbl] =
      Listen.busy      ? ['🎤', '…']
    : PTT.held         ? ['🔴', 'REC']
    : live && S.ptt    ? ['🎤', 'HOLD SPACE']
    : gated && Wake.awake ? ['🎤', 'AWAKE']
    : asleep           ? ['🎤', 'ASLEEP']
    : live             ? ['🎤', 'LISTENING']
    :                    ['🎤', 'TALK'];
  setBtn(talkBtn, ico, lbl);
  talkBtn.classList.toggle('on', live);
  talkBtn.classList.toggle('rec', PTT.held);
  /* Asleep and awake are the same microphone glyph, so with the word hidden
     the button would look identical in the one state where the difference
     decides whether it can hear you at all. The class dims it instead. */
  talkBtn.classList.toggle('asleep', asleep);
}

/* ---- push to talk ----
   Space is the key, so it must not fire while the composer has focus (you
   need spaces when typing) and it must not scroll the page. Key repeat
   fires keydown continuously, hence the held guard. */
const PTT = {
  held:false, downAt:0,

  down(){
    if (this.held) return;
    if (!Listen.on){ micNote('press TALK first to arm the microphone', true); return; }
    this.held = true; this.downAt = now;
    Mic.open = true;
    Speech.stop();                    // barge in over it mid-sentence
    Listen.beginPTT();
    micNote('recording — release SPACE to send');
    syncTalk();
  },

  up(){
    if (!this.held) return;
    this.held = false;
    Mic.open = false;
    Listen.endPTT(now - this.downAt);
    syncTalk();
  }
};

/* ================================================== WAKE WORD
   In AUTO mode the mic hears everything in the room, so without a gate the
   it answers every passing remark. The wake word is that gate.

   Once triggered it stays awake for a window, refreshed by each utterance,
   so a back-and-forth flows without repeating the word. Let the
   conversation lapse into a natural pause and it goes back to sleep, and
   the word is needed again.

   The window is deliberately on the WALL clock, not the animation clock:
   `now` freezes when the tab is hidden, which would leave it awake
   indefinitely. It is also refreshed when it finishes speaking —
   time spent listening to the answer is not the user going quiet.        */
const wallNow = () => performance.now()/1000;

const Wake = {
  awake:false, until:0,

  /* The route this conversation is bound to — set by the word that woke it,
     and held until the conversation ends rather than re-decided per
     sentence. Empty means nothing has been addressed, and questions fall to
     the default route. */
  route:'',

  /* The endpoint's own id for this conversation, where it keeps one — Home
     Assistant returns one and accepts it back, and it is how a reply of
     "which room?" is still about the lights when the answer comes. Opaque
     here: this display neither reads it nor invents one, it hands back
     whatever it was given. Its lifetime is exactly the route binding's —
     held while awake, dropped on sleep and on switching endpoints, for the
     same reason the conversation itself is. */
  convo:'',
  /* Set by the gate on the turn that woke it, read once by the request that
     follows, and cleared there — a typed question after a spoken one must not
     inherit the spoken one's trail. */
  trail: null,

  norm(s){
    return (s||'').toLowerCase().replace(/[^a-z0-9\s]/g,' ').replace(/\s+/g,' ').trim();
  },

  /* A small model mishears short words constantly — a one-syllable wake
     word comes back with the wrong vowel, a trailing full stop, or a stray
     plural. Exact matching makes waking a coin flip, so accept any token
     within a small edit distance. */
  _lev(a,b){
    if (a === b) return 0;
    const m = a.length, n = b.length;
    if (!m || !n) return m || n;
    let prev = Array.from({length:n+1}, (_,j)=>j), cur = new Array(n+1);
    for (let i=1;i<=m;i++){
      cur[0] = i;
      for (let j=1;j<=n;j++){
        cur[j] = Math.min(prev[j]+1, cur[j-1]+1, prev[j-1] + (a[i-1]===b[j-1]?0:1));
      }
      [prev, cur] = [cur, prev];
    }
    return prev[n];
  },

  /* Consonant skeleton — vowels are what a small model gets wrong, so two
     spellings of the same spoken word collapse together: berth -> brth,
     birth -> brth. */
  _skel(x){ return x.replace(/[^a-z]/g,'').replace(/(?!^)[aeiouy]/g,''); },

  /* Every accepted form: the configured word plus anything LEARN captured.
     A general ASR will never reliably spell one short word the way a given
     person says it — so rather than fight the speller, accept whatever it
     actually produces for you. */
  _list(word, aliases){
    const list = [this.norm(word)];
    (aliases||'').split(/[\n,]/).forEach(a=>{
      const t = this.norm(a);
      if (t && list.indexOf(t) < 0) list.push(t);
    });
    return list.filter(Boolean);
  },
  sleepCandidates(){ return this._list(S.sleepword, S.sleepaliases); },
  /* The same, for the word that WAKES it — which is a setting now rather than
     a property of a route, so it is asked for the same way. */
  wakeCandidates(){ return this._list(S.wakeword, S.wakealiases); },

  /* Ending a conversation on purpose beats waiting out a timer — say the
     sleep word and it stops listening immediately, so you can talk
     to someone else without it answering. */
  heardSleep(text){
    const toks = this.norm(text).split(' ').filter(Boolean);
    if (!toks.length) return false;
    for (const w of this.sleepCandidates()) if (this._tryWord(toks, w)) return true;
    return false;
  },

  sleepNow(sayBye){
    /* The farewell is spoken below, and it expands {name} — so the route has
       to still be bound while it is said, or the display signs off in
       somebody else's name. Cleared after. */
    this.awake = false;
    this.until = 0;
    /* The conversation is over, so what it was holding goes with it. On a
       screen anyone can walk up to, carrying context into the next person's
       session is a leak they cannot see — the model would simply reference
       it. A device that is allowed to remember will opt out of this once
       device kinds exist; until then the safe behaviour is the only one. */
    forgetConversation();
    this.convo = '';              // theirs goes the same way ours does
    syncTalk(); syncWake();
    if (sayBye) farewell();
    else micNote(Routes.spoken() ? 'asleep — say ' + Routes.spoken() + ' to start again'
                                 : 'asleep — ' + Routes.mute(), !Routes.spoken());
    this.route = '';
  },

  /* Token-based, so a stray plural "s" cannot be left behind in the
     command.

     `strict` belongs to the route, and it is the difference between an
     assistant and a light switch. The near-miss rules below are right when
     the cost of a false wake is a few tokens and a slightly odd reply; they
     are wrong when it actuates hardware. Under strict, a word matches when
     it IS the word — either as one token or as a compound the transcriber
     split in two, which is not a guess about what was meant but the same
     word with a space in it. */
  _tryWord(toks, w, strict){
    const tol  = strict ? 0 : w.length >= 7 ? 2 : w.length >= 4 ? 1 : 0;
    const skel = this._skel(w);
    const wlen = w.split(' ').length;                 // aliases may be 2 words
    if (wlen > 1){                                    // multi-word alias
      const joined = toks.join(' ');
      const at = joined.indexOf(w);
      if (at >= 0){
        const rest = joined.slice(at + w.length).trim();
        return {trigger:true, rest};
      }
      return null;
    }
    for (let k=0;k<toks.length;k++){
      const t = toks[k];
      const rest = () => toks.slice(k+1).join(' ').trim();
      if (t === w) return {trigger:true, rest:rest()};
      // the transcriber often splits a compound: "goodbye" -> "good bye".
      // EXACT only on the joined pair, or "good bytes" would match too.
      if (k+1 < toks.length && t + toks[k+1] === w)
        return {trigger:true, rest: toks.slice(k+2).join(' ').trim(), fuzzy:t+' '+toks[k+1]};
      if (strict) continue;
      if (t.startsWith(w) && t.length - w.length <= 2) return {trigger:true, rest:rest()};
      if (tol && this._lev(t, w) <= tol) return {trigger:true, rest:rest(), fuzzy:t};
      if (t.length >= 3 && Math.abs(t.length - w.length) <= 2 && this._skel(t) === skel)
        return {trigger:true, rest:rest(), fuzzy:t};
    }
    return null;
  },

  /* Which route, if any, this utterance addressed.

     An EXACT hit always beats a fuzzy one, wherever each was found. Without
     that rule a near-miss on the first route in the list would steal an
     utterance that named the second one outright — the worst possible
     failure here, because the person said the right word and was answered by
     the wrong assistant. Among equals the list order decides, which puts the
     default first. */
  heard(text){
    const toks = this.norm(text).split(' ').filter(Boolean);
    if (!toks.length) return null;
    let near = null;
    for (const r of Routes.list){
      for (const w of Routes.words(r)){
        const hit = this._tryWord(toks, this.norm(w), r.strict);
        if (!hit) continue;
        if (!hit.fuzzy) return Object.assign(hit, {route: r, word: w});
        if (!near) near = Object.assign(hit, {route: r, word: w});
      }
    }
    return near;
  },

  /* Every path that keeps this display awake comes through here — waking on a
     name, another utterance inside the window, and every frame of an answer
     being spoken. So this is the one place the screensaver has to hear about
     the wake word, rather than three. */
  touch(){ this.until = wallNow() + S.wakewindow; Saver.poke(); },

  /* returns text to act on, or null to ignore the utterance entirely */
  // is the gate in effect right now?
  armed(){
    if (S.wake === 'off') return false;
    if (S.wake === 'auto' && S.ptt) return false;   // holding SPACE is explicit
    return true;
  },

  /* MAY THE ROOM DRIVE THE FIGURE. Asked once per frame by Mic.step, and the
     reason a wall screen can ever reach its screensaver.

     The screensaver was never blocked — the idle clock runs perfectly well
     while a display sits listening, because an utterance that named no
     assistant pokes nothing. What it could not do was stop the FIGURE:
     Drive.extLevel overrides the phase outright, so a screen that had
     properly dimmed and shrunk went on dancing to the room, which is not a
     screensaver in any sense that matters on a panel left on all day.

     So the mic keeps hearing — it has to, or the wake word is never caught —
     and only what it shows is gated.

     No gate at all means this is not a wall: `wake` off, or auto with
     push-to-talk, is somebody at a desk who turned the microphone on to watch
     it, and taking the figure away from them would be removing the feature.
     Thinking and speaking are read off Drive rather than off `awake`, because
     an answer that runs past the end of the window is still this screen
     talking, and it must not go still mid-sentence. */
  engaged(){
    if (!this.armed()) return true;
    if (this.awake && wallNow() < this.until) return true;
    return Drive.phase === 'thinking' || Drive.phase === 'speaking';
  },

  gate(text){
    if (!this.armed()) return text;
    if (this.awake && wallNow() < this.until){
      if (this.heardSleep(text)){ this.sleepNow(true); return null; }
      /* Mid-conversation, another route's wake word switches to it. One
         person at one tablet changing what they are addressing — say the
         house name while talking to the model and the house answers, without
         having to say goodbye first.

         The conversation does NOT come with them. What was said to one
         assistant is not context the next one should be handed: it is
         another party's words, it would be paid for a second time, and on a
         house route it is a description of a room being sent somewhere it
         was never addressed to. */
      const sw = this.heard(text);
      /* The worse case, and the one this rule exists for. A display already
         awake passes everything it hears straight through — so without this,
         another person's house command lands in a stranger's conversation, is
         paid for, and is answered aloud. Dropped: not passed to the endpoint
         bound now, and not switched to. */
      if (sw && !Routes.usable(sw.route)) return this.notMine(sw);
      if (sw && sw.route.id !== this.route) return this.wakeOn(sw);
      this.touch();
      return text;
    }
    /* THE TRAIL, and this is the only moment it exists. After this the wake
       word is stripped and the near-miss is gone — which is why "it didn't
       work" has never been answerable: the one fact that explains it was
       discarded a line later. Carried on the object rather than logged,
       because nothing is recorded until the utterance turns out to have been
       addressed to this screen. */
    const h = this.heard(text);
    if (h) this.trail = {heard: text,
                         via: h.fuzzy ? 'fuzzy' : 'exact',
                         word: h.word || '', as: h.fuzzy || ''};
    if (!h){
      /* Nothing is said about it. Speech that named no assistant was not
         addressed to this screen, and announcing that it was heard and
         ignored puts a line on the wall about a conversation happening in
         front of it — every time anybody in the room speaks. The state is
         already on the button, which reads ASLEEP.

         Cleared rather than left: whatever the last note said, it is not
         about this utterance. */
      micNote('');
      return null;
    }
    if (!Routes.usable(h.route)) return this.notMine(h);
    return this.wakeOn(h);
  },

  /* Somebody in the room addressed a name this display may not use.
     SILENT: nothing spoken, nothing in the transcript. That utterance was
     addressed to a different device, and one nobody was talking to announcing
     that it cannot help is noise laid over the answer somebody else is
     waiting for.

     The status line is neither of those things — it is on the screen, for
     whoever is commissioning this — so the reason goes there and nowhere
     else. The awake window is deliberately NOT refreshed either: this was not
     addressed here, so it should not keep this display awake. */
  notMine(h){
    micNote('“' + h.word + '” is not for this display — ignored', true);
    return null;
  },

  /* Bind, and hand back whatever was said after the name — or nothing, when
     the name was the whole utterance and the right answer is hello. */
  wakeOn(h){
    const switching = this.awake && this.route && this.route !== h.route.id;
    if (switching){ forgetConversation(); this.convo = ''; }
    this.awake = true; this.route = h.route.id;
    this.touch(); syncTalk(); syncWake();
    if (h.fuzzy){
      micNote('woke on "' + h.fuzzy + '" (near “' + h.word + '”) — ' + h.route.name);
      /* Already worked out, and until now thrown away with the note that
         showed it. It is the only way to find out that two wake words are
         cross-triggering, which is the standing risk of several shared names
         in one house. */
      Events.add('wake_fuzzy', {level:'info', route: h.route.name,
                                detail: 'heard "' + h.fuzzy + '" near "' + h.word + '"'});
    }
    else if (switching)
      micNote('now talking to ' + h.route.name);
    if (!h.rest){                            // just the name — say hello back
      greet();
      return null;
    }
    return h.rest;
  },

  step(){
    if (!this.armed()){ this.awake = false; return; }
    if (!this.awake) return;
    if (Speech.active){ this.touch(); return; }   // don't age out mid-answer
    /* NOR WHILE ONE IS BEING WORKED ON. Speaking held the window open and
       thinking did not, so the entire round trip counted as the person having
       gone quiet — and an endpoint slower than the window said goodbye BEFORE
       it answered: "Sparky standing by", then the time, then nothing, because
       it had already slept. The order was inside out, and the wait it was
       measuring was its own.

       A question outstanding is the opposite of silence. The window is held
       until the answer arrives, and the countdown starts from the end of the
       reply — which is where a person would start counting too. */
    if (this.pending > 0){ this.touch(); return; }
    if (wallNow() > this.until){
      // same exit as the sleep word, so the user can choose to be told
      this.sleepNow(!!S.byeontimeout);
    }
  },

  /* How many questions are in flight. A count rather than a flag: a typed
     question and a spoken one can overlap, and a flag cleared by the first to
     come back would drop the window while the second was still out. */
  pending: 0,
  asked(){ this.pending++; },
  answered(){ this.pending = Math.max(0, this.pending - 1); this.touch(); }
};

/* LEARN — capture what the transcriber actually returns when this person
   says their wake word, and accept those forms from then on. This is the
   fix that survives an ASR that simply will not spell your pronunciation
   the way you spell it. */
const Learn = {
  on:false, left:0, got:[],

  target:'wake',
  /* Which route is being taught, when the target is a wake word. A sleep
     word belongs to the display, so it has no route. */
  route:'',

  say(m, live){
    const slot = this.target === 'sleep' ? 'learnsleepnote' : 'learnwakenote';
    const el = $(slot);
    if (el){ el.textContent = m; el.classList.toggle('live', !!live); }
    relay(slot, m, live);
  },
  clearNotes(){
    ['learnwakenote','learnsleepnote'].forEach(id=>{
      const el = $(id);
      if (el){ el.textContent = ''; el.classList.remove('live'); }
      relay(id, '');
    });
  },

  start(target){
    this.target = target || 'wake';
    /* No route to pick any more: the wake word belongs to the speech profile
       being edited, the same way the sleep word belongs to the display. */
    this.route = '';
    this.clearNotes();
    if (!Mic.active || !Listen.on){
      this.say('Press TALK first (bottom right), then try again.');
      return;
    }
    this.on = true; this.left = 3; this.got = [];
    Wake.awake = false;
    const what = this.target === 'wake'
      ? 'the wake word for ' + Routes.byId(this.route).name : 'your sleep word';
    this.say('LISTENING 1 of 3 — say ' + what + ' now, then pause.', true);
  },

  take(text){
    const t = Wake.norm(text);
    if (t) this.got.push(t.split(' ').slice(0,2).join(' '));
    this.left--;
    if (this.left > 0){
      this.say('Heard “' + t + '”.  LISTENING ' + (4-this.left) +
               ' of 3 — say it again.', true);
      return;
    }
    this.on = false;
    const isWake = this.target === 'wake';
    const r = isWake ? Routes.byId(this.route) : null;
    const have = isWake ? Wake.wakeCandidates() : Wake.sleepCandidates();
    const add = [...new Set(this.got)].filter(x => x && have.indexOf(x) < 0);
    if (!add.length){
      this.say('Nothing new to add — “' + this.got.join('”, “') +
               '” already matched.');
      return;
    }
    if (!isWake){
      const cur = (S.sleepaliases||'').split(/[\n,]/).map(x=>x.trim()).filter(Boolean);
      S.sleepaliases = [...new Set([...cur, ...add])].join('\n');
      const el = document.getElementById('sleepaliases');
      if (el) el.value = S.sleepaliases;
      this.say('Learned: ' + add.join(', ') + ' — I now answer to these as ' +
               'well as “' + S.sleepword + '”.');
      return;
    }
    /* Into the profile's own field, unsaved, for the admin to look at and
       commit — the same path the sleep word takes. It used to be relayed to a
       route's box in the panel; a route has no wake word to teach now. */
    const cur = (S.wakealiases||'').split(/[\n,]/).map(x=>x.trim()).filter(Boolean);
    S.wakealiases = [...new Set([...cur, ...add])].join('\n');
    const el = document.getElementById('wakealiases');
    if (el) el.value = S.wakealiases;
    if (window.parent !== window)
      window.parent.postMessage({rsn:1, kind:'learned', field:'wakealiases',
                                 words:add}, '*');
    this.say('Learned: ' + add.join(', ') + ' — this profile now answers to ' +
             'these as well as “' + (S.wakeword || '') + '”.');
  }
};

/* Spoken greeting when woken by name. Uses whatever the wake word is set
   to, so renaming it renames the greeting.

   A route may carry its own, which is what makes a house sound like a house
   and a model sound like a model. Blank means the shared phrases, so an
   admin sets one line once and every route uses it until one of them wants
   something else. The route's own is a single line rather than a pool: the
   variety in the shared field exists so a display somebody talks to all day
   does not repeat itself, and a route that says one specific thing is
   choosing that thing on purpose. */
const FALLBACK_GREETING = '{name} here. Go ahead.';
function greetingText(){
  const own = (Routes.current() || {}).greeting;
  if (own && own.trim()) return expand(own.trim());
  const pool = (S.greetings || '').split('\n').map(x=>x.trim()).filter(Boolean);
  return expand(pool.length ? pool[(Math.random()*pool.length)|0] : FALLBACK_GREETING);
}
function greet(){ respond(greetingText()); }

const FALLBACK_FAREWELL = 'Going quiet.';
function farewellText(){
  const pool = (S.farewells || '').split('\n').map(x=>x.trim()).filter(Boolean);
  return expand(pool.length ? pool[(Math.random()*pool.length)|0] : FALLBACK_FAREWELL);
}
function farewell(){ respond(farewellText()); }

/* ---- input mode: the user's choice, not an admin setting ----
   SPACE = hold to talk, release to send.
   AUTO  = the mic listens and sends when you stop speaking. */
const pttBtn = document.getElementById('pttbtn');
function syncPtt(){
  setBtn(pttBtn, S.ptt ? '⌨' : '🎙', S.ptt ? 'SPACE' : 'AUTO');
  pttBtn.title = S.ptt
    ? 'push to talk — hold SPACE while speaking (click for hands-free)'
    : 'hands-free — sends when you stop speaking (click for push-to-talk)';
  syncSeg('ptt');                        // keep the rig's copy in step
}
/* Both readouts are RELAYED as well as written.

   They only ever existed in the panel — this page has no element by either
   name — so for as long as they have been here they have described the gate
   to nobody. The state they report is only knowable on this side, which is
   why the code lives here; sending it is what was missing. Worth more now
   than it was, since what it says includes which route is being talked to. */
function syncWake(){
  let sleepTxt =
      S.wake === 'off' ? 'Not used while the wake word is off.'
    : !Wake.armed()    ? 'Not in effect — the wake word is inactive in this mode.'
    : Wake.awake       ? 'Say “' + (S.sleepword||'…') + '” to end the conversation now.'
    : 'Ready — used once it is awake.';
  if (S.byeontimeout && Wake.armed() && S.wake !== 'off')
    sleepTxt += ' Also spoken when the awake timer runs out.';
  const sl = document.getElementById('sleepstate');
  if (sl) sl.textContent = sleepTxt;
  relay('sleepstate', sleepTxt);

  const on = Wake.awake && Routes.current()
    ? 'AWAKE — talking to ' + Routes.current().name : 'ASLEEP';
  const wakeTxt =
      S.wake === 'off'                 ? 'OFF — every utterance is acted on, and ' +
                                          'goes to the default route.'
    : Wake.armed() && !Routes.spoken() ? 'ACTIVE — but ' + Routes.mute() + '. Now: ' + on
    : Wake.armed()                     ? 'ACTIVE — say ' + Routes.spoken() +
                                          ' to wake. Now: ' + on
    : 'NOT IN EFFECT — you are in SPACE mode, and AUTO ONLY skips the gate there. ' +
      'Switch the composer chip to AUTO, or set ALWAYS to require it in both modes.';
  const el = document.getElementById('wakestate');
  if (el) el.textContent = wakeTxt;
  relay('wakestate', wakeTxt);
  /* The one place wake state is reflected, so the one place the resting
     prompt has to hear about it — waking, sleeping, a mode change and a route
     document arriving all come through here. */
  paintPrompt();
}

function setPtt(v, remember){
  /* …except on a wall, which is speak only. Enforced here rather than at each
     caller for the same reason voice only is: the stored preference, the
     button and the shared document are three ways in, and a hallway screen
     that quietly went back to needing a space bar would look broken to
     everyone who walked up to it. */
  if (Kiosk.on) v = false;
  S.ptt = !!v;
  if (remember) Prefs.set('ptt', S.ptt);
  PTT.up();                              // never leave the gate stuck open
  Mic.open = !S.ptt;                     // AUTO means permanently open
  if (!S.ptt) Listen.sawSpeech = false;  // don't send whatever was buffered
  syncPtt(); syncTalk(); syncWake();
}
pttBtn.addEventListener('click', ()=> setPtt(!S.ptt, true));

const typingInComposer = () =>
  document.activeElement === qEl ||
  (document.activeElement && /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName));

window.addEventListener('keydown', e => {
  if (e.code !== 'Space' || !S.ptt) return;
  if (typingInComposer()) return;
  e.preventDefault();                 // no page scroll, no button re-activation
  PTT.down();
});
window.addEventListener('keyup', e => {
  if (e.code !== 'Space' || !S.ptt) return;
  if (typingInComposer()) return;
  e.preventDefault();
  PTT.up();
});
// releasing while the window is unfocused would otherwise leave it stuck open
window.addEventListener('blur', ()=> PTT.up());
function syncMic(){ syncTalk(); }

talkBtn.addEventListener('click', async ()=>{

  Speech.stop();
  await Mic.start();
  if (Mic.active) Listen.start(Mic.stream);
});

/* ---- transcript on/off: a viewer's own choice ----
   Kept in localStorage rather than the shared settings document, because one
   person wanting a clean field should not take the transcript away from
   everyone else looking at the same URL. */
const textBtn = $('textbtn');
function setTextVisible(on, remember){
  /* …except where the display itself is voice only, which is the one place a
     policy beats a preference. Enforced here rather than at each caller so
     there is no path — the button, the stored preference, an embed grant —
     that can put a transcript back on a screen in a hallway. */

  document.body.dataset.text = on ? 'on' : 'off';

  if (textBtn){
    textBtn.classList.toggle('on', on);
    textBtn.title = on ? 'hide the transcript and give the space to the field'
                       : 'show the transcript again';
  }
  setTimeout(resize, 0);              // the canvas box just changed size
}

/* ================================================ SHARED SETTINGS
   One document on the server defines the interface for everyone who opens
   the URL. This page only ever READS it: writing lives behind a sign-in on
   the admin listener, and the public listeners have no route that accepts a
   write at all. There is no key in this page and no gate to get wrong. */
const Settings = {
  async load(){
    try{
      const r = await fetch('settings', {cache:'no-store'});
      const j = await r.json();
      const got = j && j.settings || {};
      /* WHICH LISTENER THIS PAGE IS ON. The enrolment port answers this call
         and almost nothing else — see ENROL_GET — so this is where the page
         finds out, and it has to be read before anything is concluded from a
         404 somewhere else. */
      ENROL_ONLY = !!got.enrol_only;
      let n = 0;
      Object.keys(got).forEach(k=>{ if (k in S){ S[k] = got[k]; n++; } });
      if (n) repaintAll();
      return n;
    }catch(e){ return -1; }
  }
};

/* EITHER SIDE BEING ON IS ENOUGH, which is the same rule the server applies in
   status_for. A screen and a person can each carry the switch; making one of
   them win would mean turning yours on, seeing nothing, and having to work out
   which of two rows in two registers was holding it down.

   An attribute rather than a style, so the stylesheet decides what "off" looks
   like and this decides only whether it is. */
function syncStatusLine(){
  document.body.toggleAttribute('data-status',
    (typeof Display !== 'undefined' && Display.status)
    || (typeof Person !== 'undefined' && Person.status));
}

/* Relabel what is already on screen. The admin is tuning this against a live
   transcript, and a name that only applied to the next line would look like
   it had not taken. Its own function because the route document can change
   under a page too, and {name} and {route} both come from there. */
function repaintNames(){
  document.querySelectorAll('#log .msg').forEach(m=>{
    const w = m.querySelector('.who');
    if (w) w.textContent = speakerName(m.classList.contains('you') ? 'you' : 'ai',
                                       m.dataset.route);
  });
}

/* Rebuild every control from S — used after settings load. */
function repaintAll(){
  /* The format lives in the shared settings, so a change to it arrives the
     same way an appearance change does — and waiting until the next minute to
     honour it would make the panel's picker look broken for up to a minute. */
  if (typeof Clock !== 'undefined') Clock.paint();
  SLIDERS.forEach(f=>f());
  FIELDS.forEach(f=>f());
  ['mode','palette','layout','tmode','src','ptt','wake','micdsp','sttmodel','byeontimeout','ttsengine','face','fs']
    .forEach(syncSeg);
  setPalette(S.palette);
  setType();
  repaintNames();
  document.body.dataset.layout = S.layout;
  if (typeof syncPtt === 'function') syncPtt();
  if (typeof syncTalk === 'function') syncTalk();
  if (typeof syncWake === 'function') syncWake();
  if (typeof syncEngine === 'function') syncEngine();
  setTimeout(resize, 0);
}

/* Keep --barh honest. In the bleed layout the transcript is out of flow, so
   nothing makes room for the composer on its behalf — the last line would sit
   behind it. Measured rather than guessed at, because the composer's height
   moves with the type scale and drops to zero whenever it is hidden: the
   transcript toggle, an embed granted no input part, an embed with no chrome
   at all. A ResizeObserver catches every one of those without any of them
   having to remember to say so. */
(function trackBarHeight(){
  const bar = document.getElementById('bar');
  if (!bar) return;
  const set = ()=> document.documentElement.style.setProperty(
    '--barh', bar.getBoundingClientRect().height + 'px');
  if (window.ResizeObserver) new ResizeObserver(set).observe(bar);
  else window.addEventListener('resize', set);   // older browsers: close enough
  set();
})();

/* ================================================== THE EMBED'S CHROME
   Applying a grant is two separate things, and conflating them is the
   security bug this design exists to avoid: PARTS decide what is drawn,
   CAP decides what may happen. Hiding TALK does not close the microphone
   and closing the microphone does not hide TALK — `kiosk` and `signage`
   draw exactly the same thing and have opposite permissions. */
const EMBED_PARTS = ['visual','transcript','input','mode','talk','audio','text'];

function applyEmbed(){
  if (!EMBED || !Embed.grant) return;
  const parts = Embed.live.parts, cap = Embed.live.cap;
  const b = document.body;
  b.dataset.noparts = EMBED_PARTS.filter(p=> parts.indexOf(p) < 0).join(' ');
  // an empty composer is furniture, not a control
  const anyBar = ['input','mode','talk','audio','text'].some(p=> parts.indexOf(p) >= 0);
  if (anyBar) b.removeAttribute('data-nobar'); else b.dataset.nobar = '1';

  /* A viewer preference is only meaningful where the viewer has the control
     it belongs to. Stored prefs are per top-level site in every browser that
     partitions storage, so a host page inherits whatever was chosen there —
     including a transcript hidden by a TEXT button this token does not draw,
     which would leave a permanently blank frame nobody can recover. */
  if (parts.indexOf('text') < 0 && typeof setTextVisible === 'function')
    setTextVisible(parts.indexOf('transcript') >= 0);

  /* The capability half. The server refuses these too — this is so the
     interface never offers something that will come back a 403, not the
     enforcement itself. */
  if (!cap.speak && typeof setMuted === 'function') setMuted(true);
  if (!cap.mic && Mic.active) Mic.stop();
  const q = $('q');
  if (q){
    q.disabled = !cap.ask;
    if (!cap.ask) q.placeholder = '';
  }
  setTimeout(resize, 0);
}

/* A narrowing from the host page. Intersected with the grant in both
   directions, so anything not already permitted is simply dropped rather
   than refused loudly — a host that asks for more than it has is a bug in
   their integration, not an attack to alarm the person in front of it. */
function narrowEmbed(msg){
  if (!Embed.grant) return;
  if (Array.isArray(msg.parts))
    Embed.live.parts = Embed.grant.parts.filter(p=> msg.parts.indexOf(p) >= 0);
  if (msg.cap && typeof msg.cap === 'object'){
    const cap = {};
    Object.keys(Embed.grant.cap).forEach(k=>{
      cap[k] = (k in msg.cap)
        ? (typeof Embed.grant.cap[k] === 'boolean'
            ? (Embed.grant.cap[k] && !!msg.cap[k])
            : Math.min(Embed.grant.cap[k], Number(msg.cap[k]) || 0))
        : Embed.grant.cap[k];
    });
    Embed.live.cap = cap;
  }
  applyEmbed();
  tellHost('narrowed');
}

/* Post to the host's origin, never '*': the allow-list is the set of pages
   allowed to frame this, so it is also the only set worth talking to. */
function hostOrigin(){
  const o = Embed.grant && Embed.grant.origins || [];
  let ref = '';
  try{ ref = document.referrer ? new URL(document.referrer).origin : ''; }
  catch(e){}
  return o.indexOf(ref) >= 0 ? ref : (o[0] || null);
}

function tellHost(kind){
  const target = hostOrigin();
  if (!target || window.parent === window) return;
  window.parent.postMessage({rsn:1, kind, name: Embed.grant.name,
                             parts: Embed.live.parts, cap: Embed.live.cap},
                            target);
}

async function loadEmbed(){
  if (!EMBED) return;
  try{
    const r = await fetch('embed/session', {cache:'no-store'});
    const j = await r.json();
    if (!r.ok || !j.embed) throw new Error(j.error || ('HTTP ' + r.status));
    Embed.grant = j.embed;
    Embed.live = {parts: j.embed.parts.slice(), cap: Object.assign({}, j.embed.cap)};
    applyEmbed();
    /* Written from the grant rather than from a constant, so it never names
       a control this token does not draw. */
    if (Embed.live.parts.indexOf('transcript') >= 0){
      const ways = [];
      if (Embed.has('input')) ways.push('type below');
      if (Embed.has('talk') && Embed.can('mic')) ways.push('press TALK and speak');
      addMsg('ai', ways.length
        ? 'Surface online — ' + ways.join(', or ') + '.'
        : 'Surface online.');
    }
    window.addEventListener('message', e=>{
      if (e.source !== window.parent) return;
      if ((Embed.grant.origins || []).indexOf(e.origin) < 0) return;
      const m = e.data;
      if (m && m.rsn === 1 && m.kind === 'narrow') narrowEmbed(m);
    });
    tellHost('ready');
  }catch(e){
    /* The frame is up and the session is not. Say so in the frame — an
       integrator looking at a blank rectangle has nothing to go on. */
    document.body.dataset.noparts = 'visual input mode talk audio text';
    document.body.dataset.nobar = '1';
    addMsg('ai', 'This embed could not start its session: ' + e.message);
  }
}

/* ------------------------------------------------------ preview channel
   The admin page shows this page in an iframe and drives it from there, so
   what an operator tunes against is the real renderer rather than a copy of
   it. Two directions:
     in   settings — apply without saving, for live preview
          cmd      — do something only a browser can do: speak, listen, beep
     out  status   — the note text the panel used to display in-page
   Only accepted from the parent frame, and only when this page was opened
   as a preview. A page nobody framed ignores the channel entirely. */
if (PREVIEW){
  window.addEventListener('message', e=>{
    if (e.source !== window.parent) return;
    const m = e.data;
    if (!m || m.rsn !== 1) return;
    if (m.kind === 'settings' && m.settings){
      Object.keys(m.settings).forEach(k=>{ if (k in S) S[k] = m.settings[k]; });
      repaintAll();
      /* The panel pushes the whole document on every control it moves, so an
         appearance profile being previewed has to be laid back over the top or
         the first slider touched would wipe it. */
      Kiosk.applyLook();
      if (scanEl) scanEl.style.opacity = S.scan;
      tiltAim = S.tilt;
    } else if (m.kind === 'routes'){
      // the panel saved a route; take the new document rather than waiting
      // for a reload to notice
      Routes.load().then(()=>{ syncWake(); repaintNames(); });
    } else if (m.kind === 'hello'){
      /* The panel asking to be told again. The handshake below is announced
         once, unprompted, and a single announcement is a race the panel
         cannot win reliably: this page can finish loading before the parent
         has attached its listener, or before the parent knows who is signed
         in — and either way the message is gone and the panel sits empty
         until somebody reloads it. Asking is idempotent, so the panel can ask
         whenever it finds itself without an answer.

         Ignored before the settings have settled: replying with a half-loaded
         document would replace one wrong answer with another. The unprompted
         announcement is still coming. */
      if (previewReady) announcePreview();
    } else if (m.kind === 'cmd' && typeof CMD[m.cmd] === 'function'){
      try { CMD[m.cmd](m.arg); }
      catch(err){ relay('ttsnote', m.cmd + ' failed: ' + err.message); }
    }
  });
  document.body.dataset.preview = '1';
}

/* Load once, then — if this is a preview — hand the settled document to the
   admin page. It owns the defaults; a top-level `const` is not a property of
   window, so the parent cannot reach in and read it, nor should it have to. */
/* Applied twice: once now so the interface never flashes the admin's value
   before the viewer's, and again after the settings arrive, because loading
   them overwrites S wholesale — including ptt, which is a viewer control
   living in an admin document. A preview deliberately skips all of it: the
   admin is looking at what a fresh viewer gets, not at their own habits. */
/* ======================================================= STAYING UP ALONE
   Everything above assumes a page somebody opened and will close. A tablet on
   a wall is a browser tab running for a year: through server restarts, network
   drops, endpoint reboots, certificate renewals and its own operating system's
   ideas about backgrounding, with nobody standing in front of it to notice or
   reload.

   The failure mode this is written against is specific: A SCREEN THAT LOOKS
   PERFECT AND DOES NOTHING. The geometry is driven locally, so it keeps
   drifting and breathing with no server involvement at all — somebody walks
   past, sees it moving, and assumes it is fine while nothing has reached the
   server in a week. That is worse than a blank screen, which at least gets
   reported within the hour.

   IT POLLS, and that one decision pays for four others. A screen at rest
   issues no requests, so without a poll an outage would end and the screen
   would stay broken until somebody walked up and spoke to it. The same poll
   keeps `last_seen` fresh in the panel, gives the server somewhere to answer
   *reload yourself*, and carries the settings below so a change to them
   reaches a building of screens without anybody visiting one.

   WHAT RELOADS: everything, on every display. A configuration that moved, a
   server that came back, an admin's request, the nightly refresh — a screen
   showing settings somebody replaced an hour ago is stale whether or not it
   hangs on a wall, and one rule is also a rule somebody can predict. What
   keeps that from being an interruption is `busy()` below rather than a class
   of device: nothing reloads while somebody is talking to the screen or
   typing into it.

   WHAT DIFFERS BY DEVICE is what it SAYS. A kiosk speaks the outage aloud,
   because it has no transcript and nobody sitting at it; anything else stays
   quiet and fails at the moment somebody actually uses it. */
const Watch = {
  /* The server's clock, not this device's, taken from the first poll that
     answered. A reload request is a moment in server time, and comparing it
     against a tablet whose clock is a year out would either fire for ever or
     never fire at all. Zero until the first answer, which reads on the server
     as "this screen has just started" — and a request made before it started
     has already been satisfied by the load that is running this line. */
  boot: 0,
  gen: '',
  cfg: {poll_seconds: 20, retry_attempts: 3, retry_seconds: 4,
        refresh_at: '', refresh_stagger: 0, refresh_offset: 0},
  fails: 0, down: false, said: false,
  want: '',            // a reload that is owed, and why, or empty
  refreshAt: 0,        // ms on the DEVICE's clock, 0 for none
  lock: null,          // the screen wake lock, while it is held
  _t: 0, _inflight: false,

  start(){
    if (EMBED) return;          // an embed is a frame in somebody's page
    document.addEventListener('visibilitychange', ()=>{
      if (document.hidden) return;
      /* A backgrounded tab has its timers throttled to minutes and a
         suspended one has them stopped altogether, so the first thing a
         screen does on coming back is ask rather than wait out the rest of an
         interval that may have been running since yesterday. */
      this.relock();
      this.tick();
    });
    this.tick();
  },

  /* Not now, if somebody is mid-sentence with it. A reload that lands between
     a question and its answer is indistinguishable from a crash to the person
     who asked, and every reason for reloading here keeps until they have
     finished — the outage case included, because a screen that is talking is
     a screen somebody is standing at. */
  busy(){
    return Wake.awake || Listen.busy || Play.playing || Speech.active
           || typingInComposer();
  },

  wantReload(why){
    this.want = this.want || why;
    this.maybeReload();
  },

  maybeReload(){
    if (!this.want) return;
    /* Never the panel's own preview. It frames this same page, so everything
       here runs inside it — and the one thing it must never do is reload
       itself out from under the admin who is editing the very settings it is
       showing. The server blanks the two reasons it can see; this covers the
       third, which is that saving anything at all moves the stamp. The guard
       is here rather than at each caller because this is the only line in the
       object that actually reloads anything. */
    if (PREVIEW) return;
    /* NEVER while the server is unreachable. A reload into an outage replaces
       a working screen with the browser's own error page, and that page has no
       poll, no timer and no way back — the display would be gone until
       somebody walked over to it, which is the exact outcome all of this
       exists to prevent. The request keeps, and the reconnect below carries it
       out as part of coming back. */
    if (this.down || this.busy()) return;
    ev('reload: ' + this.want);
    location.reload();
  },

  offline(on){
    OFFLINE = on ? 'NO CONNECTION TO THE SERVER' : '';
    document.body.toggleAttribute('data-offline', !!OFFLINE);
    const el = $('offline');
    if (el) el.textContent = OFFLINE;
  },

  /* Said once, and only where there is nobody to read anything. A kiosk has no
     transcript and no composer, so speaking is the only way it can tell
     anybody — and saying it more than once would make an outage worse than the
     silence it replaced. Anything else stays quiet until somebody tries to use
     it, and then fails immediately at the request itself rather than making
     them sit out three attempts first. */
  announce(){
    if (this.said || PREVIEW || !Kiosk.on || this.busy()) return;
    this.said = true;
    respond('I have lost the connection to my server. I will keep trying.');
  },

  fail(){
    this.fails++;
    if (this.fails < Math.max(1, this.cfg.retry_attempts|0)) return;
    if (!this.down) ev('server unreachable');
    this.down = true;
    this.offline(true);
    this.announce();
  },

  took(j){
    const cfg = j.cfg || {};
    let moved = false;
    for (const k in this.cfg)
      if (k in cfg && this.cfg[k] !== cfg[k]){ this.cfg[k] = cfg[k]; moved = true; }
    /* Only when the setting actually changed, or when there is no time on the
       books. Re-planning on every poll would erase the refresh instead of
       carrying it out: the poll that runs at the appointed minute would move
       the appointment to tomorrow a line before anything checked whether it
       was due, and it would do that again every night for ever. */
    if (moved || !this.refreshAt) this.planRefresh();
    /* Back after being away. The page is reloaded rather than resumed: the
       conversation it was holding belongs to somebody who left minutes ago,
       and a reload is what picks up a deploy, a route corrected during the
       outage, and an appearance an admin fixed without walking over. */
    if (this.down) this.want = this.want || 'reconnected';
    this.down = false; this.said = false; this.fails = 0;
    this.offline(false);
    if (j.reload) this.want = this.want || 'asked by an admin';
    /* A stamp that moved: something a screen renders from was edited.
       TWO STATES ARE EXEMPT, and only two.

       `requested` is a screen waiting on a decision. The approval itself moves
       the stamp, Display.watch() is already handling that case in place with
       the words for it, and reloading here would replace those words with a
       page that came back silently approved.

       `setup` is a screen approved into an account and about to send somebody
       to choose a password. Reloading that one out from under itself is worse
       than anything the stamp could be telling it.

       IT USED TO READ `state === 'approved'`, which exempted everything else
       as well — and an unapproved screen is a legitimate working state, not a
       transient one. A tablet somebody opened the page on would sit there for
       days ignoring every configuration change, including one that took away
       what it was allowed to do: it went on using the permissions it fetched
       at load and found out only when it next asked an endpoint for something,
       which answered with a refusal in the status line rather than a sign-in
       page. Reported on 2026-08-20, on an endpoint changed to sign-in-required
       underneath a tablet that was already on it. */
    else if (this.gen && j.gen !== this.gen
             && Display.state !== 'requested' && Display.state !== 'setup')
      this.want = 'settings changed';
    this.gen = j.gen || this.gen;
    if (!this.boot) this.boot = j.now || 0;
    this.maybeReload();
  },

  async tick(){
    /* One chain, always. A tab coming back into view asks straight away, and
       without this that request would run alongside whichever one the timer
       already had in flight — leaving two timers armed, then four, each
       poll doubling the load on a server that is very likely already
       struggling if the polls are slow enough for this to happen at all. */
    if (this._inflight) return;
    this._inflight = true;
    clearTimeout(this._t);
    /* A request that never comes back is the shape a dropped route takes:
       not a refusal, not an error, just silence. Without a deadline the chain
       stops here for as long as the browser is prepared to wait — which is
       minutes — and a screen that has lost its network would sit looking
       perfect for all of them rather than saying so. */
    const cut = new AbortController();
    const bell = setTimeout(()=> cut.abort(), 15000);
    try{
      const r = await fetch('display/poll', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        cache: 'no-store', signal: cut.signal,
        body: JSON.stringify({boot: this.boot, events: Events.take()})
      });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const j = await r.json();
      this.took(j);
    }catch(e){
      this.fail();
    }
    clearTimeout(bell);
    this._inflight = false;
    this.checkRefresh();
    /* Faster while it is failing, because the interval between attempts is
       what the retry setting means — and back to the ordinary poll once it is
       answering, because a screen that is fine has nothing to say. */
    const secs = this.down || this.fails
      ? Math.max(1, this.cfg.retry_seconds|0)
      : Math.max(2, this.cfg.poll_seconds|0);
    this._t = setTimeout(()=> this.tick(), secs * 1000);
  },

  /* ---- the nightly refresh ----
     A tab that never reloads accumulates, and this is a net under work not yet
     done rather than a substitute for doing it. Read off the DEVICE's clock,
     for the same reason a screensaver's dark hours are: a screen's night is
     the night outside it. */
  planRefresh(){
    const at = String(this.cfg.refresh_at || '');
    const m = at.match(/^(\d{1,2}):(\d{2})$/);
    if (!m){ this.refreshAt = 0; return; }
    const d = new Date();
    d.setHours(+m[1], +m[2], 0, 0);
    /* Each screen takes its own offset inside the stagger window, computed on
       the server from this display's id: twelve tablets reconnecting in the
       same second is a load this server did not previously have. */
    let t = d.getTime() + (this.cfg.refresh_offset|0) * 1000;
    if (t <= Date.now()) t += 86400000;
    this.refreshAt = t;
  },

  checkRefresh(){
    if (!this.refreshAt || Date.now() < this.refreshAt) return;
    this.refreshAt = 0;
    this.planRefresh();                       // the same time tomorrow
    this.wantReload('nightly refresh');
  },

  /* ---- keeping the backlight on ----
     The device's own idea of when to sleep is the one thing between a wall
     screen and a black rectangle, and a screen that has gone dark cannot be
     walked up to and spoken to: the microphone is behind a page nobody can
     see. The lock is dropped by the browser whenever the tab is hidden, so it
     is taken again on every return rather than once at startup. */
  async relock(){
    if (!Kiosk.on || !Kiosk.keepAwake || PREVIEW) return;
    if (!navigator.wakeLock || this.lock || document.hidden) return;
    try{
      this.lock = await navigator.wakeLock.request('screen');
      this.lock.addEventListener('release', ()=>{ this.lock = null; });
    }catch(e){ this.lock = null; }           // refused, or not a secure origin
  },
};

function applyPrefs(){
  if (PREVIEW) return;
  if (Prefs.has('ptt'))   setPtt(Prefs.get('ptt'));
  if (Prefs.has('muted') && Speech.supported) setMuted(Prefs.get('muted'));
  setTextVisible(Prefs.get('text', true));
}
applyPrefs();

/* Both documents before anything is drawn from either. The routes decide
   what {name} expands to and what this display answers to, so loading them
   after the first paint would flash the fallback name into the opening line
   of the transcript.

   Hello first, and the endpoints after it — in that order rather than
   alongside, because the token this display holds decides which of them come
   back with a word attached. Asking for both at once would race, and the loser
   would be a display that had just enrolled and could not hear its own name
   until the next reload. The shared settings have no such dependency and
   still load in parallel. */
Promise.all([Settings.load(), Display.hello().then(()=> Routes.load())]).then(()=>{
  /* THE DOOR, AND NOTHING ELSE. Both calls above have already answered 404 on
     this listener and both of them fail quietly, which is what makes asking
     them harmless — but nothing below this line may run: it would start a
     poll against routes that are not there and end up telling somebody
     accepting an invitation that the screen has lost the server. */
  if (ENROL_ONLY) return enrolOnly();
  /* After BOTH, and not merely when the display answered. The two race, and
     loading the shared settings overwrites S wholesale — so a place's own
     appearance applied when hello came back first would be silently undone a
     moment later by the document it is supposed to override. */
  Kiosk.applyLook();
  applyPrefs();
  syncWake();
  /* Right-looking and inert, with the reason on the screen. The appearance
     settings are public, so this drew correctly before anybody approved
     anything; what it will not do is answer to a name, and somebody standing
     in front of a newly hung tablet should be told that rather than left to
     conclude it is broken. */
  /* A code was just typed into this screen, and whoever typed it is standing
     in front of it waiting to find out whether it worked. That answer outranks
     everything else the status line had to say. */
  if (ENROL) micNote(
      ENROL === 'ok'      ? 'enrolled as ' + Display.name
                            + (Routes.spoken() ? ' — say ' + Routes.spoken() : '')
    : ENROL === 'expired' ? 'that code had expired — ask for a new one'
    : ENROL === 'blocked' ? 'too many wrong codes — wait a minute and try again'
    : 'that code was not recognised — check it and try again',
    ENROL !== 'ok');
  else if (Display.known && !Display.approved && !Routes.spoken()
           && !Display.canRequest)
    micNote('waiting to be approved — ' + Display.name + ' (' + Display.id + ')');
  paintRequest();
  Display.watch();
  /* After hello, always: what this screen is decides whether it reloads
     itself, keeps its backlight on, or says anything aloud when the server
     goes away — and none of that is known until the display record is. */
  Watch.relock();
  Watch.start();
  /* After the prefs, always: the grant decides what this surface is, and a
     preference stored against another page on the same site does not get to
     argue with it. */
  loadEmbed();
  announcePreview();
});

/* Everything this page is on the enrolment listener: the house style, and one
   of four things to say. No watcher, no poll, no microphone and no endpoint —
   see the gate at the top of do_GET for what is actually reachable here. */
function enrolOnly(){
  document.body.dataset.enrolonly = '1';
  /* THE GATE IS THE PAGE HERE, and both of these have to be said or it is not
     drawn at all: `#request` is display:none without the first and `#gate` is
     without the second. They are normally set by paintRequest, off a display
     record — and there is no display record on this listener, which is how
     this shipped as a figure with nothing in front of it.

     Set outright rather than by calling paintRequest: that function decides
     whether somebody may ask for access and what a screen is allowed to show,
     and every one of those answers is about a device. There is no device
     here and never will be. */
  document.body.toggleAttribute('data-request', true);
  document.body.toggleAttribute('data-gate', true);
  /* Still dressed. The appearance settings are public and they arrived, so
     this looks like the rest of the product rather than like a form somebody
     forgot to style. */
  Kiosk.applyLook();
  /* `setup` is already forced before anything paints — see PERSON_ARRIVED.
     The other three are decided here, because a page loaded at this address
     without a live link is somebody who typed the port in. */
  if (GATE !== 'setup')
    GATE = PERSON_ARRIVED === 'ready' ? 'spent' : 'invite';
  paintGate();
}

/* The settled document, handed to the admin page — and it can be handed over
   more than once, because the panel is allowed to ask for it again. See the
   `hello` branch above for why once was not enough. */
let previewReady = false;
function announcePreview(){
  if (!PREVIEW || window.parent === window) return;
  previewReady = true;
  window.parent.postMessage({rsn:1, kind:'ready', settings:S}, '*');
}

on('reqsend', 'click', sendRequest);
/* One control, two jobs, and the mode decides which — the box is the same box
   and the difference is whether there is a password behind it yet. */
const gateGo = ()=> (GATE === 'setup' ? doSetup() : doLogin());
on('gatego', 'click', gateGo);
/* ENTER, from any of the three fields. Somebody typing a password does not
   reach for the mouse, and a form that only submits from its last field is one
   that ignores half the people using it. */
['gateuser', 'gatepass', 'gatepass2'].forEach(id=>
  on(id, 'keydown', e=>{ if (e.key === 'Enter') gateGo(); }));
on('gatecode', 'click', ()=> gateMode(GATE === 'code' ? 'login' : 'code'));
on('gatereq', 'click', ()=> gateMode(GATE === 'request' ? 'login' : 'request'));
on('enrolgo', 'click', useCode);
on('enrolcode', 'keydown', e=>{ if (e.key === 'Enter') useCode(); });
/* Typed off another screen, so it arrives with whatever spacing and case the
   person reading it out used. The server ignores both; this makes the field
   agree with it instead of looking like it is refusing what was typed. */
on('enrolcode', 'input', e=>{
  const el = e.target, at = el.selectionStart, was = el.value;
  el.value = was.toUpperCase();
  if (el.value !== was) el.setSelectionRange(at, at);
});
on('verdictok', 'click', ()=> $('verdict').classList.remove('on'));

setPalette('blue');
setType();
/* An embed's opening line is written once the grant is known: telling
   somebody to "press TALK" in a frame with no TALK button is the surest way
   to look broken. See loadEmbed(). */
if (!EMBED) addMsg('ai', PREVIEW
  ? "Preview. This is the display exactly as it is served — every control on the left drives this frame live."
  : "Surface online. Type below, or press TALK and speak to me — transcription runs locally on this server, not in the cloud. I answer aloud; AUDIO mutes me.");
</script>
</body>
</html>
