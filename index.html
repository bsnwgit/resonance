<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Resonance — voice and visual interface</title>
<link rel="icon" type="image/svg+xml" href="icon.svg">
<style>
  :root{
    /* palette is swapped at runtime by setPalette() — but ONLY the canvas
       channel. --paper is fixed neutral white and is what all text uses, so
       the transcript stays legible no matter how dark the geometry hue goes
       (the blue was pulled down deliberately to give the peak ramp somewhere
       to travel, which dragged every label down with it). */
    --ink:#05060a;
    --hue:#dfe9f2;
    --hue-dim:#7d93a8;
    --glass:255,255,255;
    --paper:238,244,250;
    --text:#f2f6fa;
    --ui:#c3cedb;
    --ui-bright:#dfe9f2;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--ink);
    color:var(--ui);
    font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }


  /* ---------- scrollbars ----------
     Part of the furniture, not the operating system's idea of a control:
     square like every other edge here, hairline-thin, no track, and a thumb
     that lifts on hover the same way the buttons do. The inset comes from a
     transparent border clipped to the content box, which is the only way to
     get breathing room around a webkit thumb. */
  ::-webkit-scrollbar{width:9px;height:9px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{
    background:rgba(var(--glass),.24);
    border:2px solid transparent;background-clip:content-box;
  }
  ::-webkit-scrollbar-thumb:hover{
    background:rgba(var(--glass),.46);
    border:2px solid transparent;background-clip:content-box;
  }
  ::-webkit-scrollbar-corner{background:transparent}
  /* Firefox has no ::-webkit-scrollbar, so it gets the standard properties.
     They are scoped behind @supports on purpose: setting them unconditionally
     makes Chrome ignore every rule above and fall back to the operating
     system's overlay bar, and Safari ignores these properties outright. */
  @supports not selector(::-webkit-scrollbar){
    *{scrollbar-width:thin;scrollbar-color:rgba(var(--glass),.24) transparent}
  }

  /* ---------- shell ---------- */
  #shell{position:fixed;inset:0;display:flex;flex-direction:column}

  /* ---------- the screen ---------- */
  #screen{position:relative;flex:1 1 auto;min-height:0;overflow:hidden;background:var(--ink)}
  #cv{position:absolute;inset:0;width:100%;height:100%;display:block}

  /* glass stack — everything below sits ON TOP of the canvas */
  .ov{position:absolute;inset:0;pointer-events:none}
  #milk{background:radial-gradient(ellipse at 50% 45%,
          rgba(var(--glass),.055) 0%,
          rgba(var(--glass),.022) 42%,
          rgba(var(--glass),0) 72%);}
  #scan{background:repeating-linear-gradient(to bottom,
          rgba(0,0,0,.30) 0px, rgba(0,0,0,.30) 1px,
          rgba(0,0,0,0) 1px, rgba(0,0,0,0) 3px);
        opacity:.35;mix-blend-mode:multiply}
  #vign{background:radial-gradient(ellipse at 50% 50%,
          rgba(0,0,0,0) 40%, rgba(0,0,0,.55) 78%, rgba(0,0,0,.88) 100%);}
  #edge{box-shadow:inset 0 0 120px 30px rgba(0,0,0,.75);}

  /* ---------- transcript ---------- */
  #log{
    position:relative;z-index:3;overflow-y:auto;padding:22px 26px 8px;
    display:flex;flex-direction:column;gap:14px;
  }
  .msg{max-width:76ch;white-space:pre-wrap;word-break:break-word}
  .msg .who{
    display:block;font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;
    color:rgba(var(--paper),.8);margin-bottom:5px;
  }
  .msg.you .body{color:rgba(var(--paper),.82)}
  .msg.ai  .body{color:var(--text)}
  .caret{display:inline-block;width:7px;height:13px;background:var(--text);
         vertical-align:-2px;margin-left:2px;animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}

  /* layout: hero = viz on top, transcript below.  bleed = transcript over viz. */
  body[data-layout="hero"]  #screen{flex:0 0 52%}
  body[data-layout="hero"]  #log{flex:1 1 auto;border-top:1px solid rgba(var(--glass),.10)}
  body[data-layout="bleed"] #screen{flex:1 1 auto}
  body[data-layout="bleed"] #log{
    position:absolute;inset:auto 0 0 0;max-height:62%;z-index:3;
    padding:40px 26px 14px;
    -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 60px);
            mask-image:linear-gradient(to bottom,transparent 0,#000 60px);
  }
  body[data-layout="bleed"] .msg.ai .body{text-shadow:0 0 16px rgba(0,0,0,.9)}

  /* A viewer can switch the transcript off and give the whole frame to the
     field. Must come after the layout rules: same specificity, so source
     order is what lets it override the hero split. */
  body[data-text="off"] #log{display:none}
  body[data-text="off"] #bar .pr,
  body[data-text="off"] #q{display:none}
  body[data-text="off"] #screen{flex:1 1 auto}
  body[data-text="off"] #bar{justify-content:flex-end}

  /* ---------- composer ---------- */
  #bar{
    position:relative;z-index:4;flex:0 0 auto;display:flex;align-items:center;gap:12px;
    padding:12px 26px;border-top:1px solid rgba(var(--glass),.12);
    background:linear-gradient(to top,rgba(0,0,0,.6),rgba(0,0,0,.15));
  }
  #bar .pr{color:rgba(var(--paper),.78);letter-spacing:.2em;font-size:10px}
  #q{
    flex:1;background:none;border:0;outline:0;color:var(--text);
    font:inherit;font-size:13px;caret-color:var(--text);
  }
  #q::placeholder{color:rgba(var(--paper),.5)}
  .src{display:flex;gap:6px}
  .src button{
    font:inherit;font-weight:400;font-size:9px;letter-spacing:.18em;padding:3px 8px;
    background:none;border:1px solid rgba(var(--glass),.16);
    color:rgba(var(--paper),.85);cursor:pointer;
  }
  .src button.on{border-color:var(--hue-dim);color:var(--hue)}
  /* same hover feedback the admin page gives, for the three controls a
     viewer actually has */
  .src button:hover:not([disabled]){border-color:var(--hue);color:var(--hue)}
  .src button.rec{border-color:#ff5a5a;color:#ff8a8a}
  .src button[disabled]{opacity:.35;cursor:not-allowed}

  #fps{position:fixed;left:12px;top:10px;z-index:20;font-size:9px;letter-spacing:.14em;
       color:rgba(var(--paper),.76)}
</style>
</head>
<body data-layout="hero">

<div id="fps"></div>

<div id="shell">
  <div id="screen">
    <canvas id="cv"></canvas>
    <div class="ov" id="milk"></div>
    <div class="ov" id="scan"></div>
    <div class="ov" id="vign"></div>
    <div class="ov" id="edge"></div>
  </div>

  <div id="log"></div>

  <div id="bar">
    <span class="pr">&gt;</span>
    <input id="q" autocomplete="off" spellcheck="false" placeholder="ask Resonance…">
    <!-- user-facing control. The TOKEN/TTS source switch is a rig/admin
         thing and lives in the panel; this is the one users get. -->
    <span class="src">
      <button id="pttbtn" title="how Resonance decides when you have finished speaking">⌨ SPACE</button>
      <button id="talkbtn" title="speak to Resonance — mic drives the geometry and your words are transcribed">🎤 TALK</button>
      <button id="mute" class="on" title="mute its voice">🔊 AUDIO</button>
      <button id="textbtn" class="on" title="hide the transcript and give the space to the field">▤ TEXT</button>
    </span>
  </div>
</div>

<script>
"use strict";
/* =====================================================================
   RESONANCE — chat surface
   Phase 1 of 3.  The geometry is driven by a SIMULATED TOKEN STREAM.
   Phases 2 (TTS) and 3 (mic) plug into the same place: they only need to
   push a 0..1 number into Drive.level each frame.  Nothing else changes.
   ===================================================================== */

/* Every control that used to live in this page now lives in admin.html,
   so these lookups must tolerate an absent element rather than throw. */
const $ = (id)=> document.getElementById(id);
const on = (id, ev, fn)=>{ const e = $(id); if (e) e.addEventListener(ev, fn); };

/* PREVIEW: this page inside the admin page's iframe. Same page, same code —
   the preview is the real thing rather than a second implementation that can
   drift from it. */
const PREVIEW = new URLSearchParams(location.search).has('preview');
function relay(slot, text, live){
  if (PREVIEW && window.parent !== window)
    window.parent.postMessage({rsn:1, kind:'status', slot, text, live:!!live}, '*');
}

/* ---------------------------------------------------------------- state */
const S = {
  mode:'stack', palette:'blue', layout:'hero',
  amp:1.0, lines:16, lag:3, depth:230, spread:620, persp:1100,
  tumble:1.0, reorient:12,
  tmode:'turntable', spin:1.0, tilt:0.187, wobble:1.0, roll:1.0,
  bloom:1.30, blur:15, milk:1.0, grain:.55, scan:.35, lw:1.0,
  rate:55, floor:0.55, crackle:0.5,
  spike:0.020, body:0.45, decay:1.0,
  grad:1.0, hot:0.62,
  src:'tts', vrate:1.0, vpitch:1.0,
  ttsengine:'local', ttsvoice:'',      // local = neural voice on the server
  micgain:1.6, micgate:0.020, ptt:true, micdsp:'clean',   // clean | raw
  sttmodel:'small.en', hangover:0.55,
  backend:'demo',              // demo | api  — demo answers from built-in text
  wake:'auto', wakeword:'resonance', wakewindow:12,   // off | auto | always
  wakealiases:'',                                 // what the model ACTUALLY hears you say
  sleepword:'goodbye', sleepaliases:'', byeontimeout:true,
  farewells:"{name} going quiet.\nStanding by.\nGoodbye.",
  greetings:"{name} here. Go ahead.\n{name} online. What do you need?\n"+
            "Yes? {name} is listening.\n{name} awake, go ahead.",
};

const PALETTES = {
  blue : {hue:'#3f7fd0', dim:'#2f6f9e', glass:'120,186,255', ink:'#01040c', hot:'#e8f6ff'},
  milk : {hue:'#9fb3c6', dim:'#8ea3b6', glass:'236,244,252', ink:'#05070b', hot:'#ffffff'},
  ice  : {hue:'#5f9fc0', dim:'#4f8ba6', glass:'169,220,242', ink:'#04080d', hot:'#e2f9ff'},
  amber: {hue:'#b08248', dim:'#a3743a', glass:'242,196,137', ink:'#0b0703', hot:'#fff0cf'},
  bone : {hue:'#938d7e', dim:'#8b8474', glass:'216,210,196', ink:'#080705', hot:'#fffaf0'},
};

/* Peak colour ramp: troughs sit at `hue`, crests run up to `hot`. Values
   are quantised to 16 steps so we build ~16 colour strings a frame rather
   than one per chunk. */
const rgbCache = {}, mixCache = {};
function toRgb(h){
  return rgbCache[h] || (rgbCache[h] = [
    parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)]);
}
function ramp(pal, t){
  const q = Math.round(Math.max(0,Math.min(1,t))*15);
  const key = pal.hue+q;
  if (mixCache[key]) return mixCache[key];
  const a = toRgb(pal.hue), b = toRgb(pal.hot), f = q/15;
  return mixCache[key] =
    'rgb('+(a[0]+(b[0]-a[0])*f|0)+','+(a[1]+(b[1]-a[1])*f|0)+','+(a[2]+(b[2]-a[2])*f|0)+')';
}

/* ------------------------------------------------------------- elements */
const cv   = document.getElementById('cv');
const ctx  = cv.getContext('2d');
const off  = document.createElement('canvas');       // geometry buffer
const octx = off.getContext('2d');
const logEl= document.getElementById('log');

/* Keep the newest line in view while a reply is being written, rather than
   jumping once at the end. Only follows when the reader is already at the
   bottom: if they have scrolled up to re-read something, yanking them back
   is worse than not following. */
let followLive = true;
function followLog(){ if (followLive) logEl.scrollTop = logEl.scrollHeight; }
logEl.addEventListener('scroll', ()=>{
  followLive = (logEl.scrollHeight - logEl.clientHeight - logEl.scrollTop) < 24;
});
const qEl  = document.getElementById('q');
const fpsEl= document.getElementById('fps');

let W=0,H=0,DPR=1;
function resize(){
  const r = cv.getBoundingClientRect();
  DPR = Math.min(window.devicePixelRatio||1, 2);
  const w = Math.max(1, Math.round(r.width  * DPR));
  const h = Math.max(1, Math.round(r.height * DPR));
  // assigning width/height clears the canvas, so only touch it on a real
  // size change — otherwise any layout jiggle blanks a frame
  if (w === W && h === H) return;
  W = w; H = h;
  cv.width=W; cv.height=H; off.width=W; off.height=H;
}
new ResizeObserver(resize).observe(document.getElementById('screen'));

/* ================================================================ DRIVE
   The single seam between "what is making noise" and "what is drawn".
   Drive.level is 0..1.  Phase 2/3 just write to it from a real analyser. */
const Drive = {
  level:0,          // smoothed energy actually used by the geometry
  target:0,         // what level is chasing
  impulse:0,        // decaying token energy
  phase:'idle',     // idle | thinking | speaking
  extLevel:null,    // phase 3: real measured level; null = internal model

  hit(weight){                       // one token arrived
    this.impulse = Math.min(1.15, this.impulse + 0.22 + weight*0.030);
    exciteBins(weight);              // and light up part of the spectrum
  },
  step(dt){
    this.impulse *= Math.pow(0.055, dt);          // fast decay, frame-rate safe
    if (this.extLevel != null)          this.target = this.extLevel;
    else if (this.phase === 'speaking') this.target = this.impulse;
    else if (this.phase === 'thinking') this.target = 0.13 + Math.sin(now*7.5)*0.045;
    else                                this.target = 0.0;
    // asymmetric slew: snap up, fall away slowly — this is what makes it
    // read as a voice rather than as a meter. Real audio needs a quicker
    // release or it smears over the gaps between words.
    const up = this.extLevel != null ? 0.55 : 0.30;
    const dn = this.extLevel != null ? 0.16 : 0.075;
    const k = this.target > this.level ? up : dn;
    this.level += (this.target - this.level) * (1 - Math.pow(1-k, dt*60));
  }
};

/* ========================================== FIELD MODEL (stationary in x)
   The earlier version was an oscilloscope: one sample pushed per frame
   into a ring buffer, every point reading further back in time. That
   makes the pattern TRANSLATE — data sweeping across a chart — which is
   exactly the behaviour we don't want.

   This model has no time axis along the line at all. Every x position is
   a fixed place that moves up and down where it stands:

     voice — standing modes. Spatial shape sin(mπu) is FIXED; only the
             amplitude oscillates in time. Nodes never move, so the form
             vibrates like a struck string rather than scrolling.
     noise — value noise evaluated at (position, time). Position is the
             lookup key, not an offset into history, so static shimmers
             in place and agitated regions bloom and fade where they are.

   Depth across the stack comes from a per-layer TEMPORAL phase offset
   (the "layer phase" control): layers rise and fall out of sync with one
   another, which ripples the sheet without any of it travelling.        */

/* ---------------------------------------------------------- voice modes */
const MODES = 10;
const mW = new Float32Array(MODES);   // temporal rate, rad/s
const mPh = new Float32Array(MODES);  // phase
const mG = new Float32Array(MODES);   // static gain — low modes carry body
const mD = new Float32Array(MODES);   // slow random gain drift
const mA = new Float32Array(MODES);   // live amplitude
for (let m=0;m<MODES;m++){
  mW[m]  = 2.1 + m*1.85 + Math.random()*1.1;
  mPh[m] = Math.random()*Math.PI*2;
  // geometric falloff, not 1/m — a high mode packs many more wiggles into
  // the same span, so a shallow rolloff lets it dominate and the form
  // reads as scribble instead of a voice with body
  mG[m]  = Math.pow(0.62, m);
}

function stepVoice(dt){
  const e = Drive.level;
  for (let m=0;m<MODES;m++){
    mD[m] += ((Math.random()*2-1) - mD[m]) * 0.06;
    // higher modes only wake up once there's real energy — consonants
    const want = e * Math.pow(e, m*0.20) * mG[m] * (0.75 + 0.35*mD[m]);
    mA[m] += (want - mA[m]) * (1 - Math.pow(0.02, dt));
  }
  stepBins(dt);
}

/* ------------------------------------------------------- formant bins
   Standing modes alone give smooth swells — an ocean, not a voice. A
   voice on a graph is SPIKES at particular places in the spectrum that
   jump and fall away.

   So: a bank of bins at fixed positions across the span. A token doesn't
   raise the whole surface, it excites a cluster of bins — a formant —
   which spikes and decays. Positions never move, so this stays in place;
   what changes is which parts of the spectrum are lit. */
const BINS = 30;
const binU = new Float32Array(BINS);   // fixed position, 0..1
const binA = new Float32Array(BINS);   // live height
const binS = new Float32Array(BINS);   // sign — spikes punch both ways
const binK = new Float32Array(BINS);   // per-bin decay
for (let j=0;j<BINS;j++){
  binU[j] = (j + 0.5)/BINS;
  binS[j] = Math.random() < 0.5 ? -1 : 1;
  binK[j] = 0.02 + Math.random()*0.16;
}

function exciteBins(weight){
  const clusters = 1 + (Math.random()*3|0);
  for (let q=0;q<clusters;q++){
    const c = Math.random()*BINS|0;
    const spread = 1 + (Math.random()*3|0);
    for (let d=-spread; d<=spread; d++){
      const j = c+d; if (j<0 || j>=BINS) continue;
      const f = 1 - Math.abs(d)/(spread+1);
      binA[j] = Math.min(2.4, binA[j] + (0.30 + weight*0.040)*f*(0.5+Math.random()));
    }
  }
}

function stepBins(dt){
  for (let j=0;j<BINS;j++) binA[j] *= Math.pow(binK[j], dt*S.decay*3);
  // thinking: sparse low flickers so the fabric isn't dead while it waits
  if (Drive.phase === 'thinking' && Math.random() < 0.10){
    binA[Math.random()*BINS|0] += 0.05 + Math.random()*0.10;
  }
}

/* Spike field, rebuilt once per frame and shared by every line — so the
   spikes line up through the depth of the fabric instead of each layer
   inventing its own. Periodic, so rings can sample it too. */
const FN = 256;
const field = new Float32Array(FN);
function buildField(){
  field.fill(0);
  const sig = Math.max(0.004, S.spike), inv = 1/(2*sig*sig);
  const reach = Math.ceil(3*sig*FN);
  for (let j=0;j<BINS;j++){
    const a = binA[j]*binS[j];
    if (Math.abs(a) < 0.002) continue;
    const c = Math.round(binU[j]*FN);
    for (let d=-reach; d<=reach; d++){
      const du = d/FN;
      field[((c+d)%FN+FN)%FN] += a * Math.exp(-du*du*inv);
    }
  }
}
const fieldAtU = u => field[((Math.round(u*FN)%FN)+FN)%FN];

/* Spatial basis tables. Rebuilt only when the point count changes, so the
   per-frame cost is one multiply-add per mode per point. */
let obN = 0, obTab = null, rbN = 0, rbTab = null;
function basisOpen(N){                       // fixed at both ends
  if (obN === N) return obTab;
  obN = N; obTab = new Float32Array(N*MODES);
  for (let i=0;i<N;i++){
    const u = i/(N-1);
    for (let m=0;m<MODES;m++) obTab[i*MODES+m] = Math.sin((m+1)*Math.PI*u);
  }
  return obTab;
}
function basisRing(N){                       // periodic — no seam
  if (rbN === N) return rbTab;
  rbN = N; rbTab = new Float32Array((N+1)*MODES);
  for (let i=0;i<=N;i++){
    const a = (i/N)*Math.PI*2;
    for (let m=0;m<MODES;m++) rbTab[i*MODES+m] = Math.cos((m+1)*a + mPh[m]);
  }
  return rbTab;
}

// per-line temporal coefficients; tOff is the layer's phase offset
const co = new Float32Array(MODES);
function lineCoef(tOff){
  for (let m=0;m<MODES;m++) co[m] = mA[m]*Math.cos(mW[m]*(now+tOff) + mPh[m]);
}
function modeSum(tab, i){
  let v = 0, b = i*MODES;
  for (let m=0;m<MODES;m++) v += tab[b+m]*co[m];
  return v;
}

/* ----------------------------------------------------- in-place noise
   Hash-based value noise keyed on (lane, position, time). Nothing is
   stored and nothing scrolls: ask for position i at time t and you get
   that point's current value. Each line has its own lane, so lines stay
   uncorrelated; each also gets a slowly moving envelope so some stretches
   are agitated while others sit almost flat.                            */
function hash3(a,b,c){
  let h = Math.imul(a,374761393) + Math.imul(b,668265263) + Math.imul(c,1274126177);
  h = Math.imul(h ^ (h>>>13), 1274126177);
  return ((h ^ (h>>>16)) >>> 0) / 2147483648 - 1;      // -1..1
}
function tn(a,b,t,rate){                     // smooth in time, rough in space
  const tt = t*rate, t0 = Math.floor(tt), f = tt-t0, s = f*f*(3-2*f);
  return hash3(a,b,t0)*(1-s) + hash3(a,b,t0+1)*s;
}
function tn2(a,x,t,rate,sc){                 // smooth in both
  const xx = x*sc, x0 = Math.floor(xx), fx = xx-x0, sx = fx*fx*(3-2*fx);
  const tt = t*rate, t0 = Math.floor(tt), ft = tt-t0, st = ft*ft*(3-2*ft);
  const v0 = hash3(a,x0,t0)*(1-sx)   + hash3(a,x0+1,t0)*sx;
  const v1 = hash3(a,x0,t0+1)*(1-sx) + hash3(a,x0+1,t0+1)*sx;
  return v0*(1-st) + v1*st;
}
function nzRaw(k,i){
  const t = now, A = Math.imul(k,1013) + 7;
  const fizz   = tn (A,   i, t, 20);                  // per-point static
  const wander = tn2(A+1, i, t, 2.0,  0.14);          // smooth undulation
  let   env    = 0.5 + 0.5*tn2(A+2, i, t, 0.45, 0.035);
  env *= env;                                         // bias toward quiet
  const laneE  = 0.30 + 0.70*(0.5 + 0.5*tn(A+3, 0, t, 0.30));
  let cr = tn(A+4, i, t, 7);                          // sparse crackle
  cr = Math.abs(cr) > 0.90 ? (cr - Math.sign(cr)*0.90)/0.10 : 0;
  return (fizz*0.90 + wander*0.50) * (0.12 + env*1.8) * laneE
       + cr * 1.1 * (0.35 + S.crackle);
}
// floor ducks under a loud voice rather than switching off
function noiseAmp(){ return S.floor * 0.115 * (1 - 0.55*Math.min(1, Drive.level)); }
function lineNoise(k,i){ return nzRaw(k,i) * noiseAmp(); }
function ringNoise(k,i,N){
  const w = i/N;                                      // crossfade seam shut
  return (nzRaw(k,i)*(1-w) + nzRaw(k,0)*w) * noiseAmp();
}

/* ============================================================== TUMBLE
   Continuous angular velocity on all three axes, re-aimed periodically —
   so it drifts most of the time and visibly reorients now and then. */
/* Axis note: internally Y is the vertical axis, so the "turntable spin"
   is rotation about Y. Controls are labelled by BEHAVIOUR (spin / tilt /
   roll) rather than by letter, because z-up and y-up conventions disagree
   and the letters were causing confusion. */
const ang = {x:0.187, y:0.55, z:0.0};
const vel = {x:0.0004, y:0.0042, z:0.0000};
const aim = {x:0.0004, y:0.0042, z:0.0000};
let tiltAim = 0.187;
let nextReorient = 6;

function reorient(){
  const r = () => (Math.random()-0.5);
  if (S.tmode === 'turntable'){
    // the platter never stops and never flips — only its rate drifts
    aim.y = 0.0014 + Math.random()*0.0020;
    aim.z = r()*0.0007;
    aim.x = 0;
    tiltAim = S.tilt * (0.72 + Math.random()*0.56);
  } else {
    const big = Math.random() < 0.55;
    aim.y = 0.0030 + r()*0.010;
    aim.x = r() * (big ? 0.016 : 0.0035);
    aim.z = r() * (big ? 0.012 : 0.0022);
  }
  nextReorient = now + S.reorient*(0.6 + Math.random()*0.8);
}

function stepTumble(dt){
  if (now > nextReorient) reorient();
  const k = 1 - Math.pow(0.986, dt*60);
  const s = S.tumble * dt * 60;

  vel.x += (aim.x - vel.x)*k;
  vel.y += (aim.y - vel.y)*k;
  vel.z += (aim.z - vel.z)*k;

  if (S.tmode === 'turntable'){
    ang.y += vel.y * s * S.spin;             // the platter
    ang.z += vel.z * s * S.roll;             // slow lean
    // hold a shallow viewing height instead of integrating — this is what
    // keeps it edge-on, a record seen from the side rather than from above
    const want = tiltAim + Math.sin(now*0.19)*0.045*S.wobble
                         + Math.sin(now*0.07+1.3)*0.030*S.wobble;
    ang.x += (want - ang.x) * (1 - Math.pow(0.992, dt*60));
  } else {
    ang.x += vel.x*s; ang.y += vel.y*s; ang.z += vel.z*s;
  }
}

/* ============================================================ GEOMETRY
   Each builder returns an array of polylines; each polyline is a flat
   array [x,y,z, x,y,z, …] in model space. */

/* Layer phase offset, in seconds. Layers vibrate out of sync with each
   other; nothing propagates along the line. */
const phaseOf = k => k * S.lag * 0.012;
/* Spikes stay at the same place in every layer but breathe out of phase
   through the depth, so they read as one ridge running through the fabric
   rather than as unrelated bumps per line. */
const layerGain = k => 0.72 + 0.28*Math.cos(5.5*(now + phaseOf(k)*2.2));

function buildStack(){
  const N = 190, lines = S.lines;
  const tab = basisOpen(N);
  const out = [];
  for (let k=0;k<lines;k++){
    const kt  = lines>1 ? k/(lines-1) : .5;
    const z   = (kt-0.5) * S.depth;
    const fade= 1 - Math.abs(kt-0.5)*0.55;       // centre layers loudest
    lineCoef(phaseOf(k));
    const gain = layerGain(k);
    const pts = new Float32Array(N*3), amp = new Float32Array(N);
    for (let i=0;i<N;i++){
      const it = i/(N-1);
      // taper the ends so the static dissolves instead of stopping dead
      const env = Math.pow(Math.sin(Math.PI*it), 1.35);
      const v = modeSum(tab,i)*S.body*fade
              + fieldAtU(it)*gain*env
              + lineNoise(k,i)*env;
      pts[i*3  ] = (it-0.5) * S.spread;
      pts[i*3+1] = -v * 130 * S.amp;
      pts[i*3+2] = z;
      amp[i] = v;                     // pre-scale, so colour is scale-free
    }
    out.push({p:pts, a:amp});
  }
  return out;
}

function buildOrb(){
  const rings = Math.max(3, S.lines), N = 96, R = S.spread*0.30;
  const tab = basisRing(N);
  const out = [];
  for (let k=0;k<rings;k++){
    const lat = (-0.5 + (k+0.5)/rings) * Math.PI;   // -pi/2 .. pi/2
    const cy  = Math.sin(lat)*R, rr = Math.cos(lat)*R;
    lineCoef(phaseOf(k));
    const gain = layerGain(k);
    const pts = new Float32Array((N+1)*3), amp = new Float32Array(N+1);
    for (let i=0;i<=N;i++){
      const a = (i/N)*Math.PI*2;
      const s = modeSum(tab,i)*S.body + fieldAtU(i/N)*gain;
      const v = s*Math.cos(lat) + ringNoise(k,i,N);
      const r = rr + v * 60 * S.amp;
      pts[i*3  ] = Math.cos(a)*r;
      pts[i*3+1] = cy + s*10*S.amp;
      pts[i*3+2] = Math.sin(a)*r * (S.depth/230);
      amp[i] = v;
    }
    out.push({p:pts, a:amp});
  }
  return out;
}

/* DISC — concentric rings lying flat in the horizontal plane, displaced
   vertically by the signal. Kept a true circle (no depth scaling) so the
   viewing tilt alone flattens it into an ellipse: a record on a turntable,
   seen from the side. */
function buildDisc(){
  const rings = Math.max(2, S.lines), N = 132, R = S.spread*0.44;
  const tab = basisRing(N);
  const out = [];
  for (let k=0;k<rings;k++){
    const rt = (k+1)/rings;
    const rr = R*rt;
    const lift = (rt-0.5) * S.depth * 0.10;        // very shallow cone
    lineCoef(phaseOf(k));
    const gain = layerGain(k);
    const pts = new Float32Array((N+1)*3), amp = new Float32Array(N+1);
    for (let i=0;i<=N;i++){
      const a = (i/N)*Math.PI*2;
      const s = modeSum(tab,i)*S.body + fieldAtU(i/N)*gain;
      const v = s*(0.35 + 0.65*rt) + ringNoise(k,i,N);
      pts[i*3  ] = Math.cos(a)*rr;
      pts[i*3+1] = lift - v * 100 * S.amp;
      pts[i*3+2] = Math.sin(a)*rr;
      amp[i] = v;
    }
    out.push({p:pts, a:amp});
  }
  return out;
}

function buildKnot(){
  const strands = Math.max(1, Math.round(S.lines/3)), N = 340;
  const R = S.spread*0.22, out = [];
  const tab = basisRing(N);
  for (let k=0;k<strands;k++){
    const off = k*0.13;
    lineCoef(phaseOf(k));
    const gain = layerGain(k);
    const pts = new Float32Array(N*3), amp = new Float32Array(N);
    for (let i=0;i<N;i++){
      const t = (i/N)*Math.PI*2;
      const s = modeSum(tab,i)*S.body + fieldAtU(i/N)*gain;
      const v = s + ringNoise(k,i,N);
      const w = 1 + v * 0.55 * S.amp;
      const rr = (2 + Math.cos(3*t + off)) * R * 0.5 * w;
      pts[i*3  ] = Math.cos(2*t + off) * rr;
      pts[i*3+1] = Math.sin(2*t + off) * rr;
      pts[i*3+2] = Math.sin(3*t + off) * R * (S.depth/230) * w;
      amp[i] = v;
    }
    out.push({p:pts, a:amp});
  }
  return out;
}

/* ========================================================== PROJECTION */
let cx_=1,sx_=0,cy_=1,sy_=0,cz_=1,sz_=0;
function setAngles(){
  cx_=Math.cos(ang.x); sx_=Math.sin(ang.x);
  cy_=Math.cos(ang.y); sy_=Math.sin(ang.y);
  cz_=Math.cos(ang.z); sz_=Math.sin(ang.z);
}
const P = {x:0,y:0,z:0};
function rot(x,y,z){
  const y1 =  y*cx_ - z*sx_,  z1 =  y*sx_ + z*cx_;
  const x2 =  x*cy_ + z1*sy_, z2 = -x*sy_ + z1*cy_;
  P.x = x2*cz_ - y1*sz_;
  P.y = x2*sz_ + y1*cz_;
  P.z = z2;
}

/* ============================================================== RENDER
   Polylines are cut into chunks, each chunk sorted by depth and stroked
   once. ~100–200 strokes/frame instead of thousands of segments, but you
   still get real occlusion cueing where lines cross. */
const CHUNK = 16;
const chunks = [];

function render(){
  setAngles();
  buildField();
  const build = S.mode==='stack' ? buildStack
              : S.mode==='disc'  ? buildDisc
              : S.mode==='orb'   ? buildOrb : buildKnot;
  const polys = build();

  const cx = W/2, cy = H/2, f = S.persp*DPR;
  const zoom = Math.min(W,H) / (760*DPR) * DPR;

  chunks.length = 0;
  for (const poly of polys){
    const pts = poly.p, amp = poly.a;
    const n = pts.length/3;
    let seg=null, segZ=0, segA=0, segN=0;
    for (let i=0;i<n;i++){
      rot(pts[i*3], pts[i*3+1], pts[i*3+2]);
      const sc = f/(f + P.z*zoom);
      if (sc <= 0.02) { seg=null; continue; }
      if (!seg){ seg=[]; segZ=0; segA=0; segN=0; chunks.push({p:seg, z:0, a:0}); }
      seg.push(cx + P.x*sc*zoom, cy + P.y*sc*zoom);
      segZ += P.z; segN++;
      // depth averages, but heat takes the chunk's PEAK — averaging would
      // dilute a sharp spike across its whole chunk and wash the colour out
      const av = Math.abs(amp[i]); if (av > segA) segA = av;
      const cur = chunks[chunks.length-1];
      cur.z = segZ/segN; cur.a = segA;
      if (seg.length/2 >= CHUNK && i < n-1){
        const carry = [seg[seg.length-2], seg[seg.length-1]];
        seg = carry.slice(); segZ = P.z; segA = av; segN = 1;
        chunks.push({p:seg, z:P.z, a:segA});
      }
    }
  }
  chunks.sort((a,b)=> b.z - a.z);              // painter: far first

  /* --- geometry buffer --- */
  octx.clearRect(0,0,W,H);
  octx.lineCap='round'; octx.lineJoin='round';
  const pal = PALETTES[S.palette];
  const halfD = Math.max(60, S.depth);
  for (const c of chunks){
    const p = c.p; if (p.length < 4) continue;
    const d = Math.max(-1, Math.min(1, c.z/halfD));      // -1 near .. 1 far
    const a = 0.92 - (d+1)*0.34;                          // near = brighter
    const w = (1.55 - (d+1)*0.42) * S.lw * DPR;
    // crest heat: troughs stay in the base hue, peaks run up toward `hot`
    // and pick up extra alpha and weight so they read as energy, not just
    // a different colour
    let g = c.a / Math.max(0.05, S.hot);
    g = Math.min(1, g); g = g*g*(3-2*g) * S.grad;
    octx.globalAlpha = Math.min(1, Math.max(0.05, a) * (1 + 0.55*g));
    octx.lineWidth   = Math.max(0.35*DPR, w * (1 + 0.5*g));
    octx.strokeStyle = ramp(pal, g);
    octx.beginPath();
    octx.moveTo(p[0],p[1]);
    for (let i=2;i<p.length;i+=2) octx.lineTo(p[i],p[i+1]);
    octx.stroke();
  }
  octx.globalAlpha = 1;

  /* --- composite: bloom, then sharp, then milk --- */
  ctx.globalCompositeOperation='source-over';
  ctx.fillStyle = pal.ink; ctx.fillRect(0,0,W,H);

  if (S.bloom > 0.01 && S.blur > 0){
    ctx.save();
    ctx.filter = 'blur('+(S.blur*DPR)+'px)';
    ctx.globalAlpha = Math.min(1, S.bloom*0.85);
    ctx.globalCompositeOperation = 'lighter';
    ctx.drawImage(off,0,0);
    ctx.restore();
  }
  ctx.globalCompositeOperation='lighter';
  ctx.globalAlpha = 0.92;
  ctx.drawImage(off,0,0);

  /* milk — the opaque-screen wash that sells it as glass, not vector art */
  if (S.milk > 0.01){
    const g = ctx.createRadialGradient(W*0.5,H*0.45,0, W*0.5,H*0.45, Math.max(W,H)*0.62);
    g.addColorStop(0,   'rgba('+pal.glass+','+(0.052*S.milk)+')');
    g.addColorStop(0.5, 'rgba('+pal.glass+','+(0.020*S.milk)+')');
    g.addColorStop(1,   'rgba('+pal.glass+',0)');
    ctx.globalCompositeOperation='lighter';
    ctx.globalAlpha=1; ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  }

  /* grain */
  if (S.grain > 0.01 && grainPat){
    ctx.globalCompositeOperation='overlay';
    ctx.globalAlpha = 0.10*S.grain;
    ctx.save();
    ctx.translate((Math.random()*256|0)-256, (Math.random()*256|0)-256);
    ctx.fillStyle = grainPat; ctx.fillRect(0,0,W+256,H+256);
    ctx.restore();
  }
  ctx.globalAlpha=1; ctx.globalCompositeOperation='source-over';
}

/* grain tile */
let grainPat = null;
(function makeGrain(){
  const g = document.createElement('canvas'); g.width=g.height=256;
  const c = g.getContext('2d'), d = c.createImageData(256,256);
  for (let i=0;i<d.data.length;i+=4){
    const v = 90 + (Math.random()*76|0);
    d.data[i]=d.data[i+1]=d.data[i+2]=v; d.data[i+3]=255;
  }
  c.putImageData(d,0,0);
  grainPat = ctx.createPattern(g,'repeat');
})();

/* ================================================================ LOOP */
let now=0, last=performance.now(), frames=0, fpsT=0;
function frame(t){
  requestAnimationFrame(frame);
  if (document.hidden) { last = t; return; }
  let dt = (t-last)/1000; last=t;
  if (dt > 0.1) dt = 0.1;               // tab-return guard
  now += dt;

  Speech.step();
  Wake.step();
  Listen.overrun();
  stepTumble(dt);
  stepVoice(dt);          // decays the bins…
  Mic.step();             // …so the mic must overwrite them after, not before
  Drive.step(dt);
  render();

  frames++; if (t-fpsT > 500){ fpsEl.textContent = Math.round(frames*1000/(t-fpsT))+' FPS';
                               frames=0; fpsT=t; }
}
resize(); requestAnimationFrame(frame);

/* ====================================================== TOKEN STREAMING
   Phase 1 driver.  Streams canned text word-by-word; every token is an
   impulse into Drive.  Punctuation buys a pause, which is most of what
   makes the motion read as speech. */
const REPLIES = [
  "Interface check. I am rendering from a simulated token stream — no telemetry is attached to this surface. Every impulse you see in the geometry is one token arriving, nothing more.",
  "Three forms are loaded. STACK is a scrolling waveform given depth: each line reads the same signal a few frames further back, so rotation turns the delay into a twist. ORB is a sphere of latitude rings displaced radially. KNOT is a parametric torus knot that breathes.",
  "The tumble is continuous angular velocity on all three axes, re-aimed on an interval. It drifts most of the time, then visibly reorients — which is the behaviour you described, rather than a fixed spin.",
  "Depth cueing is painter's-algorithm only. Chunks are sorted back to front and stroked with alpha and weight falling off with distance, so crossings occlude correctly without any real z-buffer.",
  "Speech synthesis is live. The browser engine will not route through an audio analyser, so there is no real envelope to read — what it gives is one boundary event per word. Each word is split into its estimated syllables and pulsed at speech rate, which is what you are watching now.",
  "The microphone is live and the transcription is local. Your audio is recorded here, posted to this same server, and turned into text by a Whisper model running on the box itself — none of it goes to a third party. The spikes you see while you talk are your real formants, not an estimate.",
];
let replyIx = 0;
let streamTimer = null;

/* ================================================= PHASE 3 — MIC DRIVE
   The first source that isn't estimated. Phases 1 and 2 had to *invent* an
   envelope; here we measure one.

     level  — RMS of the time-domain buffer, written straight to
               Drive.extLevel so the geometry's amplitude is real
     spikes — the FFT is folded onto the formant bins, log-spaced across
               90 Hz .. 4.2 kHz (where speech actually lives), taking the
               PEAK in each band rather than the mean so formants stay
               sharp. binA is what buildField() already reads, so the
               spikes now sit at genuine spectral positions instead of
               being scattered by exciteBins().

   getUserMedia needs a secure context — over plain HTTP the button is
   disabled and says so. Browser AGC/denoise are switched off: they are
   tuned to flatten exactly the dynamics we want to see.               */
const Mic = {
  ok: !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia),
  active:false, ctx:null, node:null, analyser:null, stream:null,
  td:null, fd:null, lo:null, hi:null,

  async start(){
    if (this.active) return;
    if (!window.isSecureContext){
      micNote('BLOCKED: mic needs a secure origin. Use the https:// URL (port 9701).');
      return;
    }
    if (!this.ok){ micNote('this browser exposes no getUserMedia'); return; }
    try{
      /* I originally forced all processing OFF to keep the dynamics the
         visualiser feeds on. That is the wrong default once a human is
         actually being transcribed: with auto-gain off, a normally-spoken
         word arrives quiet and the model mishears it, so you end up having
         to stress every word. CLEAN turns the browser's gain and denoise
         back on — much better recognition, slightly flatter geometry.   */
      const clean = S.micdsp !== 'raw';
      this.stream = await navigator.mediaDevices.getUserMedia({
        audio: clean
          ? { echoCancellation:true,  noiseSuppression:true,  autoGainControl:true }
          : { echoCancellation:false, noiseSuppression:false, autoGainControl:false }
      });
    }catch(e){
      micNote('mic refused: ' + (e && e.name ? e.name : e) +
              (e && e.name === 'NotAllowedError' ? ' — permission denied in the browser' : ''));
      return;
    }
    const AC = window.AudioContext || window.webkitAudioContext;
    this.ctx = new AC();
    if (this.ctx.state === 'suspended') await this.ctx.resume();
    this.node = this.ctx.createMediaStreamSource(this.stream);
    this.analyser = this.ctx.createAnalyser();
    this.analyser.fftSize = 2048;
    this.analyser.smoothingTimeConstant = 0.55;
    this.node.connect(this.analyser);        // NOT to destination — no echo
    this.td = new Uint8Array(this.analyser.fftSize);
    this.fd = new Uint8Array(this.analyser.frequencyBinCount);

    // precompute the log-spaced band edges once
    const nyq = this.ctx.sampleRate/2, n = this.analyser.frequencyBinCount;
    const f0 = 90, f1 = 4200;
    this.lo = new Int32Array(BINS); this.hi = new Int32Array(BINS);
    for (let j=0;j<BINS;j++){
      const fa = f0*Math.pow(f1/f0, j/BINS);
      const fb = f0*Math.pow(f1/f0, (j+1)/BINS);
      this.lo[j] = Math.max(0, Math.floor(fa/nyq*n));
      this.hi[j] = Math.min(n, Math.max(this.lo[j]+1, Math.ceil(fb/nyq*n)));
    }
    this.active = true;
    this.floor = -1;                                    // reseed per session
    Drive.phase = 'speaking';
    micNote('live · ' + Math.round(this.ctx.sampleRate/1000) + ' kHz · ' +
            (this.stream.getAudioTracks()[0] || {}).label);
    syncMic();
  },

  stop(){
    this.active = false;
    Drive.extLevel = null;
    Drive.phase = 'idle';
    try { if (this.stream) this.stream.getTracks().forEach(t=>t.stop()); } catch(e){}
    try { if (this.ctx) this.ctx.close(); } catch(e){}
    this.stream = null; this.ctx = null; this.analyser = null;
    micNote('off');
    syncMic();
  },

  open:false,        // push-to-talk gate; ignored when S.ptt is off
  raw:0, level:0, floor:0.010, thresh:0.010, vadOpen:false,

  step(){
    if (!this.active || !this.analyser) return;
    // While it is speaking, its own voice is coming out of the
    // speakers and back into the mic. Hand the geometry back to the TTS
    // driver rather than letting it chase its own echo.
    if (Speech.active){ Drive.extLevel = null; return; }
    // Push-to-talk: key up means the mic is closed, so hand the geometry
    // back to the idle model rather than showing room noise.
    if (S.ptt && !this.open){ Drive.extLevel = null; return; }

    this.analyser.getByteTimeDomainData(this.td);
    let sum = 0;
    for (let i=0;i<this.td.length;i++){ const v = (this.td[i]-128)/128; sum += v*v; }
    const raw = Math.sqrt(sum/this.td.length) * S.micgain * 3.2;
    this.raw = raw;                                     // pre-gate, for metering

    /* The visual gate and the speech detector must NOT be the same number.
       Sharing one made the gate do two jobs: raise it so the utterance
       actually ends, and you then have to shout to be heard at all.

       So the geometry keeps the user's gate, while detection uses a
       threshold that floats just above the measured room floor. The floor
       falls quickly toward quiet and rises very slowly, so it settles on
       the noise level rather than on your voice. */
    if (this.floor < 0) this.floor = raw;               // seed from the room
    const a = raw < this.floor ? 0.020 : 0.0030;        // fall fast, rise slow
    this.floor += (raw - this.floor) * a;
    this.thresh = Math.max(0.006, this.floor*2.2 + 0.004);
    this.vadOpen = raw > this.thresh;

    const lvl = raw < S.micgate ? 0 : raw;              // visual gate only
    this.level = lvl;
    Drive.extLevel = Math.min(1.25, lvl);
    Listen.feed(raw, this.vadOpen);
    meter();

    this.analyser.getByteFrequencyData(this.fd);
    const gateOpen = lvl > 0;
    for (let j=0;j<BINS;j++){
      let m = 0;
      for (let i=this.lo[j]; i<this.hi[j]; i++) if (this.fd[i] > m) m = this.fd[i];
      const v = gateOpen ? (m/255) * S.micgain : 0;
      binA[j] += (v*1.9 - binA[j]) * 0.40;              // smooth, keep punch
    }
  }
};
/* Live level readout. The gate is the single most important number for
   hands-free to work at all, and it is unguessable without seeing the
   room's actual noise floor — so show it. */
let _meterAt = 0;
function meter(){
  if (now - _meterAt < 0.1) return;
  _meterAt = now;
  const el = document.getElementById('miclevel');
  if (!el) return;
  const raw = Mic.raw || 0;
  const open = raw >= S.micgate;
  el.style.whiteSpace = 'pre-line';
  const bars = Math.min(20, Math.round(raw*40));
  el.textContent =
    'level ' + raw.toFixed(3) +
    '  [' + '#'.repeat(bars).padEnd(20,'·') + ']\n' +
    'voice thresh ' + (Mic.thresh||0).toFixed(3) +
    ' (room ' + (Mic.floor||0).toFixed(3) + ')  ' +
    (Mic.vadOpen ? (Listen.sawSpeech ? 'SPEAKING' : 'voice') : 'quiet') +
    '   ·   visual gate ' + S.micgate.toFixed(3) + (open ? ' open' : '');
}

/* Measure the room for 2s and put the gate just above it. */
function calibrate(){
  if (!Mic.active){ micNote('press TALK first, then calibrate'); return; }
  let peak = 0, n = 0;
  micNote('calibrating — stay quiet…');
  const id = setInterval(()=>{
    peak = Math.max(peak, Mic.raw || 0); n++;
    if (n >= 40){
      clearInterval(id);
      const g = Math.min(0.15, peak*1.6 + 0.004);
      S.micgate = g;
      const sl = document.getElementById('s_micgate');
      if (sl){ sl.value = g; sl.dispatchEvent(new Event('input')); }
      micNote('gate set to ' + g.toFixed(3) + ' (room floor ' + peak.toFixed(3) + ')');
    }
  }, 50);
}

function micNote(m){ const el = $('micnote'); if (el) el.textContent = m; relay('micnote', m); }

/* ============================================== PHASE 3b — SPEECH TO TEXT
   Local. Audio is recorded in the browser and POSTed to /stt on this same
   origin, where faster-whisper transcribes it on the server itself. Nothing
   leaves the machine — deliberately NOT the browser's SpeechRecognition,
   which in Chrome ships your audio to Google. That matters here because the
   whole point is reading hostnames, addresses and device names aloud.

   Voice activity detection reuses the mic's own RMS: the noise gate that
   already decides whether the geometry reacts doubles as the "is anyone
   talking" test, so there is only one threshold to tune. The recorder runs
   continuously and is cut ~0.9s after speech stops; whisper's own VAD trims
   the leading silence, so nothing gets clipped at the start of a word.    */
const Listen = {
  on:false, paused:false, busy:false,
  mr:null, mime:'', chunks:[], sawSpeech:false, quietAt:0, armedAt:0,

  supported(){
    return typeof MediaRecorder !== 'undefined' && typeof fetch === 'function';
  },

  start(stream){
    if (this.on || !stream) return;
    if (!this.supported()){ micNote('no MediaRecorder in this browser'); return; }
    this.on = true;
    this._arm(stream);
    syncTalk();
  },

  _arm(stream){
    const want = ['audio/webm;codecs=opus','audio/webm','audio/ogg;codecs=opus','audio/mp4'];
    this.mime = want.find(t => MediaRecorder.isTypeSupported(t)) || '';
    let mr;
    try { mr = new MediaRecorder(stream, this.mime ? {mimeType:this.mime} : undefined); }
    catch(e){ micNote('recorder failed: ' + e.message); this.on = false; syncTalk(); return; }
    this.chunks = []; this.sawSpeech = false; this.quietAt = 0; this.armedAt = now;
    mr.ondataavailable = e => { if (e.data && e.data.size) this.chunks.push(e.data); };
    mr.onstop = () => this._flush();
    try { mr.start(); } catch(e){ micNote('recorder start failed: ' + e.message); }
    this.mr = mr;
  },

  _flush(){
    const had = this.sawSpeech;
    const blob = new Blob(this.chunks, {type: this.mime || 'audio/webm'});
    this.chunks = [];
    // re-arm straight away so the next utterance isn't missed
    if (this.on && !this.paused && Mic.stream) this._arm(Mic.stream);
    if (had && blob.size > 2000) this._send(blob);
  },

  async _send(blob){
    this.busy = true; micNote('transcribing…'); syncTalk();
    try{
      /* No hint. Biasing the decoder toward the wake word — by either
         initial_prompt or hotwords — makes it treat the word as context
         already given and OMIT it from the transcript, which silently
         breaks the matching it was supposed to help. Measured both ways.
         The endpoint still accepts ?hint= for domain vocabulary later. */
      const t0 = performance.now();
      const r = await fetch('stt?model=' + encodeURIComponent(S.sttmodel), {
        method:'POST',
        headers:{'Content-Type': blob.type || 'audio/webm'},
        body: blob
      });
      const j = await r.json();
      if (j.error)      micNote('stt error: ' + j.error);
      else if (j.text)  {
        if (Learn.on){ Learn.take(j.text); }
        else {
            const trip = Math.round(performance.now() - t0);
          micNote('heard "' + j.text + '"  ·  ' + j.ms + 'ms decode, ' +
                  trip + 'ms round trip, +' + Math.round(S.hangover*1000) + 'ms silence wait');
          const act = Wake.gate(j.text);
          if (act) submit(act);
        }
      }
      else              micNote('nothing recognised — try speaking a little louder');
    }catch(e){
      micNote('stt request failed: ' + e.message);
    }
    this.busy = false; syncTalk();
  },

  /* --- push-to-talk: the key decides the boundaries, not the VAD --- */
  beginPTT(){
    if (!this.on || this.paused || !Mic.stream) return;
    this._arm(Mic.stream);            // fresh recording, no stale silence
  },
  endPTT(heldFor){
    if (!this.on || this.paused || !this.mr) return;
    if (heldFor < 0.3){               // stray tap, not an utterance
      this.sawSpeech = false;
      this._cut();
      micNote('too short — hold SPACE while you speak');
      return;
    }
    this.sawSpeech = true;            // they held the key; send it regardless
    this._cut();
  },

  /* fed from Mic.step with the gated level: >0 means the gate is open */
  feed(raw, speaking){
    if (!this.on || this.paused || !this.mr) return;
    if (S.ptt) return;                // key edges do the cutting instead
    if (speaking){
      this.sawSpeech = true; this.quietAt = 0;
      return;
    }
    if (this.sawSpeech){
      if (!this.quietAt) this.quietAt = now;
      else if (now - this.quietAt > S.hangover) this._cut();   // end of utterance
    } else if (now - this.armedAt > 20){
      this._cut();                                         // bin idle silence
    }
  },

  /* Safety net. If the room noise floor sits above the gate, the level
     never returns to zero, the utterance never "ends", and nothing is ever
     sent — the geometry reacts happily while it stays silent. Cut
     regardless after MAXLEN so speech always gets through. */
  MAXLEN: 12,
  overrun(){
    if (!this.on || this.paused || !this.mr || S.ptt) return;
    if (this.sawSpeech && now - this.armedAt > this.MAXLEN){
      micNote('long utterance — sending. If this keeps happening, raise the noise gate.');
      this._cut();
    }
  },

  _cut(){ this.quietAt = 0; try { this.mr.stop(); } catch(e){} },

  stop(){
    this.on = false; this.paused = false;
    if (typeof Wake !== 'undefined') Wake.awake = false;
    if (typeof PTT !== 'undefined'){ PTT.held = false; Mic.open = false; }
    try { if (this.mr) this.mr.stop(); } catch(e){}
    this.mr = null; this.chunks = [];
    syncTalk();
  },

  // don't record its own voice coming back through the speakers
  pause(){
    if (this.on && !this.paused){
      this.paused = true;
      try { if (this.mr) this.mr.stop(); } catch(e){}
      this.mr = null;
    }
  },
  resume(){
    if (this.on && this.paused){
      this.paused = false;
      if (Mic.stream) this._arm(Mic.stream);
    }
  }
};

/* ============================================ NEURAL VOICE (server-side)
   Browser speechSynthesis uses whatever the OS ships, which is mostly old
   concatenative engines — hence the machine-like sound. This plays a neural
   voice rendered on the server instead.

   It also fixes something phase 2 could only fake: because the audio goes
   through Web Audio, we finally get a REAL analyser on its own
   voice. The geometry stops being driven by estimated syllables and starts
   being driven by the actual waveform and spectrum, exactly like the mic. */
const Play = {
  available:false, probed:false, voices:[],
  ctx:null, an:null, src:null, gain:null, td:null, fd:null, lo:null, hi:null,
  playing:false, startedAt:0, dur:1, body:null, caret:null, full:'', onDone:null,

  async probe(){
    try{
      const r = await fetch('tts/voices', {cache:'no-store'});
      const j = await r.json();
      this.voices = j.voices || [];
      this.available = this.voices.length > 0;
      if (!S.ttsvoice && this.voices.length) S.ttsvoice = this.voices[0];
    }catch(e){ this.available = false; }
    this.probed = true;
    paintVoiceList();
    return this.available;
  },

  _audio(){
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!this.ctx) this.ctx = new AC();
    if (this.ctx.state === 'suspended') this.ctx.resume();
    return this.ctx;
  },

  async start(text, r, done){
    this.body = r.body; this.caret = r.caret; this.full = text; this.onDone = done;
    this.shown = 0;
    try{
      const resp = await fetch('tts?voice=' + encodeURIComponent(S.ttsvoice || '') +
                               '&rate=' + encodeURIComponent(S.vrate), {
        method:'POST', headers:{'Content-Type':'text/plain; charset=utf-8'}, body:text
      });
      if (!resp.ok){ throw new Error('tts ' + resp.status); }
      const buf = await resp.arrayBuffer();
      const ctx = this._audio();
      const audio = await ctx.decodeAudioData(buf);

      const an = ctx.createAnalyser();
      an.fftSize = 2048; an.smoothingTimeConstant = 0.5;
      const src = ctx.createBufferSource();
      src.buffer = audio;
      src.connect(an); an.connect(ctx.destination);

      this.an = an; this.src = src;
      this.td = new Uint8Array(an.fftSize);
      this.fd = new Uint8Array(an.frequencyBinCount);
      const nyq = ctx.sampleRate/2, n = an.frequencyBinCount, f0 = 90, f1 = 4200;
      this.lo = new Int32Array(BINS); this.hi = new Int32Array(BINS);
      for (let j=0;j<BINS;j++){
        this.lo[j] = Math.max(0, Math.floor(f0*Math.pow(f1/f0, j/BINS)/nyq*n));
        this.hi[j] = Math.min(n, Math.max(this.lo[j]+1,
                       Math.ceil(f0*Math.pow(f1/f0, (j+1)/BINS)/nyq*n)));
      }

      this.dur = audio.duration || 1;
      this.startedAt = now;
      this.playing = true;
      Drive.phase = 'speaking';
      src.onended = ()=> this.finishUp();
      src.start();
    }catch(e){
      note('neural voice failed (' + e.message + ') — falling back to the browser voice');
      S.ttsengine = 'browser'; syncSeg('ttsengine');
      Speech.local = false;
      Speech.next();                        // retry through the browser engine
    }
  },

  step(){
    if (!this.playing || !this.an) return;

    this.an.getByteTimeDomainData(this.td);
    let sum = 0;
    for (let i=0;i<this.td.length;i++){ const v = (this.td[i]-128)/128; sum += v*v; }
    Drive.extLevel = Math.min(1.25, Math.sqrt(sum/this.td.length) * 3.4);

    this.an.getByteFrequencyData(this.fd);
    for (let j=0;j<BINS;j++){
      let m = 0;
      for (let i=this.lo[j]; i<this.hi[j]; i++) if (this.fd[i] > m) m = this.fd[i];
      binA[j] += ((m/255)*1.9 - binA[j]) * 0.40;
    }

    // Reveal the transcript across the known audio duration, following it
    // down as it grows. This path is the default engine and used to write
    // the text without ever scrolling, so a long reply ran off the bottom
    // and only came into view once something else forced a scroll.
    const p = Math.min(1, (now - this.startedAt)/this.dur);
    if (this.body){
      const upto = this.full.slice(0, Math.ceil(p*this.full.length));
      if (upto.length !== this.shown){
        this.body.textContent = upto;
        this.shown = upto.length;
        followLog();
      }
    }
  },

  finishUp(){
    this.playing = false;
    Drive.extLevel = null;
    if (this.body) this.body.textContent = this.full;
    if (this.caret) this.caret.remove();
    const d = this.onDone; this.onDone = null;
    if (d) d();
  },

  stop(){
    if (this.src){ try { this.src.onended = null; this.src.stop(); } catch(e){} }
    this.src = null; this.an = null; this.playing = false;
    Drive.extLevel = null;
  }
};

/* ================================================== PHASE 2 — TTS DRIVE
   speechSynthesis will not route through a Web Audio analyser, so there is
   no real envelope to read. What it does give is a `boundary` event per
   word. That's too coarse on its own — one pulse per word looks robotic —
   so each word is broken into its estimated syllables and pulsed at speech
   rate. The geometry never learns this isn't a real envelope: it still only
   sees Drive.hit() and Drive.level, exactly as in phase 1.

   Safari (and some remote voices elsewhere) fire no boundary events at all.
   If none arrives shortly after speech starts, we fall back to a synthetic
   envelope timed from the text length, and reveal the transcript
   proportionally instead of per-word.                                   */
function syllables(w){
  w = w.toLowerCase().replace(/[^a-z]/g,'');
  if (!w) return 1;
  const m = w.match(/[aeiouy]+/g);
  let n = m ? m.length : 1;
  if (w.length > 3 && /e$/.test(w) && n > 1) n--;    // silent trailing e
  return Math.max(1, Math.min(7, n));
}

const Speech = {
  supported: typeof window !== 'undefined' && 'speechSynthesis' in window,
  voices: [], voice: null,
  active: false, synthetic: false,
  parts: [], pi: 0, base: 0, partLen: 0,
  body: null, caret: null, full: '',
  syl: 0, nextAt: 0, gap: 0.18,
  sawBoundary: false, fallbackAt: 0, startedAt: 0, synthDur: 1,

  speak(text, r){
    this.stop();
    this.full = text; this.body = r.body; this.caret = r.caret;
    // chunk by sentence: long single utterances get truncated in Chrome
    this.parts = text.match(/[^.!?]+[.!?]*\s*/g) || [text];
    this.pi = 0; this.base = 0;
    this.active = true;
    Listen.pause();
    Drive.phase = 'thinking';
    if (S.ttsengine === 'local' && Play.available){
      this.local = true;
      Play.start(text, r, ()=> this.finish());
      return;
    }
    this.local = false;
    /* speak() MUST be called synchronously inside the user gesture that
       triggered it. Chrome gates speechSynthesis on user activation at the
       moment of the call, and a priming utterance does not buy permission
       for a later one — so the old setTimeout "thinking" pause meant every
       utterance was silently dropped. The thinking beat now comes for free
       from the engine's own start latency: phase stays 'thinking' until
       onstart fires. */
    this.next();
  },

  next(){
    if (this.pi >= this.parts.length){ this.finish(); return; }
    const part = this.parts[this.pi];
    this.partLen = part.length;
    const u = new SpeechSynthesisUtterance(part);
    if (this.voice) u.voice = this.voice;
    u.rate = S.vrate; u.pitch = S.vpitch;

    u.onboundary = e => {
      if (e.name && e.name !== 'word') return;
      if (!this.sawBoundary) ev('boundary');
      this.sawBoundary = true; this.synthetic = false;
      const ci = e.charIndex || 0;
      const w  = (part.slice(ci).match(/^\S+/) || [''])[0];
      this.reveal(this.base + ci + w.length);
      this.syl    = syllables(w);
      this.gap    = Math.max(0.055, 0.185 / S.vrate);
      this.nextAt = now;
    };
    const advance = () => {
      if (!this.active) return;
      this.base += part.length; this.pi++; this.next();
    };
    u.onend = advance;
    u.onerror = e => {
      const why = (e && e.error) || 'unknown';
      ev('ERROR:' + why);
      if (why === 'not-allowed')
        note('BLOCKED: the browser wants a real click on the page first. Press TEST VOICE.');
      else if (why !== 'interrupted' && why !== 'canceled')
        note('speech error: ' + why);
      advance();
    };
    // arm the fallback from when audio actually STARTS, not from speak():
    // queueing delay would otherwise burn the window and fire a spurious
    // burst of synthetic pulses before the first real boundary lands
    u.onstart = () => {
      ev('start');
      Drive.phase = 'speaking';
      this.startedAt = now;
      this.fallbackAt = now + 0.9;
    };

    this.startedAt = now;
    this.sawBoundary = false;
    this.fallbackAt  = now + 3.0;      // generous until onstart tightens it
    // ~13 chars/sec of speech at rate 1.0
    this.synthDur = Math.max(0.4, part.length / (13 * S.vrate));
    if (this.pi === 0) evLog.length = 0;
    ev('speak(' + this.pi + ')');
    try { window.speechSynthesis.speak(u); }
    catch(err){ this.goSynthetic(); }
  },

  goSynthetic(){
    if (this.synthetic) return;
    this.synthetic = true;
    // onstart may never have fired (blocked, or a voice that reports
    // nothing), so drop into 'speaking' here or the pulses do nothing
    Drive.phase = 'speaking';
    this.gap = Math.max(0.055, 0.185 / S.vrate);
    this.nextAt = now;
    note('no boundary events from this voice — using estimated envelope');
  },

  reveal(n){
    if (!this.body) return;
    this.body.textContent = this.full.slice(0, Math.min(n, this.full.length));
    followLog();
  },

  step(){
    if (!this.active) return;
    if (this.local){ Play.step(); return; }

    if (!this.sawBoundary && !this.synthetic && now > this.fallbackAt) this.goSynthetic();

    if (this.synthetic){
      if (now >= this.nextAt){
        Drive.hit(3 + Math.random()*5);
        this.nextAt = now + this.gap*(0.7 + Math.random()*0.7);
      }
      const p = Math.min(1, (now - this.startedAt)/this.synthDur);
      this.reveal(this.base + Math.floor(p*this.partLen));
    } else {
      // one pulse per estimated syllable, spread across the word
      while (this.syl > 0 && now >= this.nextAt){
        Drive.hit(3 + Math.random()*5);
        this.syl--;
        this.nextAt += this.gap*(0.75 + Math.random()*0.5);
      }
    }
  },

  finish(){
    this.active = false; this.synthetic = false; this.syl = 0; this.local = false;
    Drive.extLevel = null;
    Listen.resume();
    this.reveal(this.full.length);
    if (this.caret) this.caret.remove();
    Drive.phase = 'idle';
  },

  stop(){
    const was = this.active;
    this.active = false; this.syl = 0; this.local = false;
    Play.stop();
    if (was) Listen.resume();
    // cancel() on an idle queue can itself wedge Chrome — only call it when
    // there is actually something to cancel
    if (!this.supported) return;
    try {
      const ss = window.speechSynthesis;
      if (ss.speaking || ss.pending || ss.paused) ss.cancel();
    } catch(e){}
  }
};
window.addEventListener('beforeunload', ()=>{ Speech.stop(); Mic.stop(); Listen.stop(); });

/* Browsers gate speechSynthesis on user activation at the moment speak() is
   called. No priming utterance here: a queued blank utterance can wedge
   Chrome's speech queue and kill every later one, which is a worse failure
   than the one it prevents. The real fix is calling speak() synchronously
   inside the gesture; this flag exists only for the DIAGNOSE readout. */
let ttsUnlocked = false;
function unlockTTS(){ ttsUnlocked = true; }
['pointerdown','keydown','touchstart'].forEach(ev =>
  window.addEventListener(ev, unlockTTS, true));

function note(msg){
  const el = $('ttsnote');
  if (el) el.textContent = msg;
  relay('ttsnote', msg);
}

/* Rolling lifecycle trace, so it's visible where speech dies without
   anyone needing to open devtools. */
const evLog = [];
function ev(s){
  evLog.push(s);
  if (evLog.length > 7) evLog.shift();
  note(evLog.join('  →  '));
}

function addMsg(who, text){
  const el = document.createElement('div');
  el.className = 'msg ' + who;
  el.innerHTML = '<span class="who">'+(who==='you'?'operator':'resonance')+'</span>'+
                 '<span class="body"></span>';
  el.querySelector('.body').textContent = text;
  logEl.appendChild(el);
  followLive = true;
  logEl.scrollTop = logEl.scrollHeight;
  return el.querySelector('.body');
}

function newReply(){
  const body = addMsg('ai','');
  const caret = document.createElement('span'); caret.className='caret';
  body.parentElement.appendChild(caret);
  return {body, caret};
}

/* One entry point; the source decides who drives the geometry.
   Muting only silences the VOICE — the reply still streams and the geometry
   still reacts, so the surface never looks dead just because audio is off. */
let muted = false;
function respond(text){
  clearTimeout(streamTimer);
  Speech.stop();
  const r = newReply();
  if (S.src === 'tts' && Speech.supported && !muted) Speech.speak(text, r);
  else stream(text, r);
}

function stream(text, r){
  clearTimeout(streamTimer);
  Drive.phase = 'thinking';
  const body = r.body, caret = r.caret;

  const toks = text.match(/\S+\s*/g) || [];
  let i = 0;
  const think = 500 + Math.random()*700;

  setTimeout(()=>{
    Drive.phase = 'speaking';
    (function next(){
      if (i >= toks.length){
        caret.remove();
        Drive.phase = 'idle';
        return;
      }
      const tk = toks[i++];
      body.textContent += tk;
      Drive.hit(tk.trim().length);
      followLog();

      let d = S.rate * (0.6 + Math.random()*0.9);
      if (/[,;:]\s*$/.test(tk)) d += S.rate*3.5;      // breath
      if (/[.!?]\s*$/.test(tk)) d += S.rate*7;        // full stop
      streamTimer = setTimeout(next, d);
    })();
  }, think);
}

/* The one place a real assistant gets wired in. DEMO answers from built-in
   text so the whole chain — mic, VAD, transcription, wake word, speech,
   geometry — can be commissioned and proven BEFORE any backend exists, and
   flipped back to afterwards to isolate whether a fault is ours or theirs. */
async function askBackend(text){
  if (S.backend === 'demo') return REPLIES[replyIx++ % REPLIES.length];
  return REPLIES[replyIx++ % REPLIES.length];     // TODO: real adapter
}

function submit(text){
  addMsg('you', text);
  qEl.value = '';
  askBackend(text).then(reply => respond(reply));
}
qEl.addEventListener('keydown', e=>{
  if (e.key !== 'Enter') return;
  const v = qEl.value.trim(); if (!v) return;
  submit(v);
});

/* Commissioning check: exercises each link in the chain and says which one
   is broken, rather than leaving you to guess from silence. */
async function selfTest(){
  const el = $('selftest');
  const lines = [];
  const show = (t)=>{ if (el) el.textContent = t; relay('selftest', t); };
  const say = (ok, m) => { lines.push((ok ? '  ok   ' : '  FAIL ') + m); show(lines.join('\n')); };
  show('running…');

  say(!!window.isSecureContext, 'secure origin (' + location.protocol + ') — needed for the mic');

  try{
    const r = await fetch('settings', {cache:'no-store'});
    const j = await r.json();
    say(r.ok, 'shared settings readable (' + Object.keys(j.settings||{}).length + ' stored)');
  }catch(e){ say(false, 'shared settings unreachable: ' + e.message); }

  try{
    const r = await fetch('stt/status', {cache:'no-store'});
    const j = await r.json();
    say(r.ok && !j.error, 'speech-to-text service · model ' + j.model +
        ' · loaded [' + (j.loaded||[]).join(', ') + ']');
  }catch(e){ say(false, 'speech-to-text unreachable: ' + e.message); }

  try{
    const r = await fetch('tts/voices', {cache:'no-store'});
    const j = await r.json();
    say((j.voices||[]).length > 0, 'neural voice service · ' +
        (j.voices||[]).length + ' installed · using ' + (S.ttsvoice || 'default'));
  }catch(e){ say(false, 'neural voice service unreachable: ' + e.message); }

  say(Speech.supported && Speech.voices.length > 0,
      'speech out · ' + Speech.voices.length + ' voices · ' +
      (Speech.voice ? Speech.voice.name : 'none selected'));
  say(!!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia), 'microphone API present');
  say(typeof MediaRecorder !== 'undefined', 'audio recorder present');
  say(Mic.active, 'microphone open' + (Mic.active ? '' : ' — press TALK to test it'));

  const reply = await askBackend('self test');
  say(!!reply, 'backend (' + S.backend + ') answered ' + (reply ? reply.length + ' chars' : 'nothing'));

  const before = document.querySelectorAll('.msg').length;
  respond(reply);
  say(document.querySelectorAll('.msg').length > before, 'reply rendered and spoken');

  lines.push(lines.some(l=>l.startsWith('  FAIL')) ? '\nsomething above needs fixing.'
                                                   : '\nall green — safe to connect a real backend.');
  show(lines.join('\n'));
}

function setPalette(p){
  const c = PALETTES[p]; const r = document.documentElement.style;
  r.setProperty('--hue',c.hue); r.setProperty('--hue-dim',c.dim);
  r.setProperty('--glass',c.glass); r.setProperty('--ink',c.ink);
}

// `src` appears both in the composer chips and in the rig, so a click has
// to update every seg bound to that key, not just the one clicked
const BOOL_KEYS = new Set(['ptt','byeontimeout']);
function syncSeg(key){
  document.querySelectorAll('.seg[data-set="'+key+'"] button').forEach(b=>
    b.classList.toggle('on',
      BOOL_KEYS.has(key) ? (b.dataset.v === '1') === !!S[key] : b.dataset.v === S[key]));
}
document.querySelectorAll('.seg[data-set]').forEach(seg=>{
  const key = seg.dataset.set;
  seg.addEventListener('click', e=>{
    const b = e.target.closest('button');
    if (!b || b.disabled) return;
    S[key] = BOOL_KEYS.has(key) ? b.dataset.v === '1' : b.dataset.v;
    syncSeg(key);
    if (key==='palette') setPalette(S[key]);
    if (key==='tmode')   reorient();
    if (key==='src'){ Speech.stop(); clearTimeout(streamTimer); Drive.phase='idle'; }
    if (key==='ptt'){ setPtt(S.ptt); syncWake(); }
    if (key==='wake'){ Wake.awake = false; syncTalk(); syncWake(); }
    if (key==='byeontimeout') syncWake();
    if (key==='ttsengine'){ Speech.stop(); syncEngine(); }
    if (key==='micdsp' && Mic.active){        // constraints apply at open time
      const wasListening = Listen.on;
      Listen.stop(); Mic.stop();
      micNote('reopening mic with ' + S.micdsp + ' processing…');
      Mic.start().then(()=>{ if (wasListening && Mic.active) Listen.start(Mic.stream); });
    }
    if (key==='layout'){ document.body.dataset.layout = S.layout; setTimeout(resize,0); }
  });
});

const voiceSel = $('voicesel');
function loadVoices(){
  if (!Speech.supported) return;
  const v = window.speechSynthesis.getVoices();
  if (!v.length) return;
  Speech.voices = v;
  const prev = Speech.voice && Speech.voice.name;
  if (!voiceSel) return;
  voiceSel.innerHTML = '';
  v.forEach((vo,i)=>{
    const o = document.createElement('option');
    o.value = i; o.textContent = vo.name + ' · ' + vo.lang + (vo.localService ? '' : ' · net');
    voiceSel.appendChild(o);
  });
  let pick = v.findIndex(x => x.name === prev);
  if (pick < 0) pick = v.findIndex(x => x.default);
  if (pick < 0) pick = v.findIndex(x => /^en/i.test(x.lang));
  if (pick < 0) pick = 0;
  voiceSel.value = pick;
  Speech.voice = v[pick];
  note(v.length + ' voices. Local voices fire word events; some network voices do not.');
}
/* BEEP — a plain Web Audio tone. This deliberately does not touch
   speechSynthesis, so it splits the problem cleanly in two:
     beep audible, speech silent  -> the speech engine / chosen voice
     neither audible              -> the PAGE has no audio at all: muted tab,
                                     site sound blocked, wrong output device,
                                     or an embedded webview rather than a
                                     real browser                          */
let audioCtx = null;
CMD.beep = ()=>{
  try{
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC){ note('no Web Audio in this browser at all'); return; }
    audioCtx = audioCtx || new AC();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const t = audioCtx.currentTime;
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = 'sine'; o.frequency.value = 440;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.30, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.45);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(t); o.stop(t + 0.5);
    note('BEEP sent · AudioContext=' + audioCtx.state +
         ' · heard it? then audio works and the problem is the speech engine.' +
         ' Silent? then the PAGE has no audio — muted tab, site sound blocked,' +
         ' wrong output device, or not a real browser window.');
  } catch(e){ note('beep failed: ' + e.message); }
};

/* Speaks synchronously inside the click — no timer, so user activation is
   definitely still live. If this is silent but the page is otherwise fine,
   the problem is the voice or the output device, not the gesture gate. */
CMD.testvoice = ()=>{
  if (S.ttsengine === 'local' && Play.available){
    Speech.stop();
    respond('Neural voice check. This is ' + (S.ttsvoice||'the default voice') +
            ', rendered on your own server.');
    return;
  }
  if (!Speech.supported){ note('no speechSynthesis in this browser'); return; }
  Speech.stop();
  const u = new SpeechSynthesisUtterance('Resonance interface online.');
  if (Speech.voice) u.voice = Speech.voice;
  u.rate = S.vrate; u.pitch = S.vpitch; u.volume = 1;
  u.onstart = ()=> note('STARTED — audio is playing now. Hear nothing? Check output device/volume.');
  u.onend   = ()=> note('finished cleanly.');
  u.onerror = e => note('FAILED: ' + ((e && e.error) || 'unknown'));
  note('queued…');
  window.speechSynthesis.speak(u);
  setTimeout(()=>{
    if (!window.speechSynthesis.speaking && !window.speechSynthesis.pending)
      note('never started — the engine dropped it. Try a different voice (prefer a local one).');
  }, 1200);
};

    'voice=' + (v ? v.name + (v.localService ? ' (local)' : ' (NETWORK)') : 'none'),
    'speaking=' + (ss ? ss.speaking : '-') + ' pending=' + (ss ? ss.pending : '-') +
