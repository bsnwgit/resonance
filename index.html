   installing it, who wants the address bar back for a minute; asking again on
   their very next tap would make the screen unusable exactly when somebody is
   working on it. So a deliberate exit buys a minute of quiet, after which a
   wall goes back to being a wall. */
const FullScreen = {
  leftAt: 0,
  GRACE: 60,                            // seconds of quiet after a manual exit

  el(){ return document.fullscreenElement || document.webkitFullscreenElement; },
  can(){
    const r = document.documentElement;
    return !!(r.requestFullscreen || r.webkitRequestFullscreen);
  },

  ask(){
    if (EMBED || PREVIEW || !Kiosk.on || !Kiosk.fullscreen
        || !this.can() || this.el()) return;
    if (this.leftAt && (wallNow() - this.leftAt) < this.GRACE) return;
    const r = document.documentElement;
    try{
      const p = (r.requestFullscreen || r.webkitRequestFullscreen).call(r);
      /* A rejected request is not a fault worth saying anything about: the
         browser refused, the screen still works, and there is nobody standing
         in front of a hallway tablet to read a complaint about it. */
      if (p && p.catch) p.catch(()=>{});
    }catch(e){}
    /* The same gesture is the best moment to take the wake lock as well. It
       does not require user activation the way this does, but a browser that
       refused it at load — an unfocused tab, a page not yet interacted with —
       will grant it here, and a commissioning touch is the one gesture a wall
       screen is guaranteed to get. */
    Watch.relock();
  },

  init(){
    ['fullscreenchange', 'webkitfullscreenchange'].forEach(ev=>
      document.addEventListener(ev, ()=>{
        // Out, and we did not do it — so somebody did, and they get a minute.
        if (!this.el()) this.leftAt = wallNow();
      }));
  },
};
FullScreen.init();

/* Every signal that is not speech. Passive, so none of it costs a frame, and
   on the window rather than the canvas because a voice-only display is mostly
   canvas but the request form and the verdict are not.

   The same gesture that ends the screensaver is the one that can ask for the
   full screen, and the one that can open a microphone the browser would not
   let the page open by itself — there is only ever one first touch, and all
   three want it. */
['pointerdown', 'touchstart', 'keydown', 'wheel'].forEach(ev=>
  window.addEventListener(ev, ()=>{
    lastTouch = wallNow();
    Saver.poke(); FullScreen.ask();
    if (typeof Kiosk !== 'undefined') Kiosk.touched();
  }, {passive: true}));

/* ================================================================ LOOP */
let now=0, last=performance.now(), frames=0, fpsT=0;
function frame(t){
  requestAnimationFrame(frame);
  if (document.hidden) { last = t; return; }
  let dt = (t-last)/1000; last=t;
  if (dt > 0.1) dt = 0.1;               // tab-return guard
  now += dt;

  Speech.step();
  Wake.step();
  Listen.overrun();
  stepTumble(dt);
  stepVoice(dt);          // decays the bins…
  Mic.step();             // …so the mic must overwrite them after, not before
  Drive.step(dt);
  Saver.step(dt);         // after Drive: it moves the finished figure, not the signal
  /* An embed that does not draw the figure should not pay for it. Everything
     above this line still runs — the mic, the voice and the wake word are
     not the visualiser, and a `chat` embed that stopped listening because it
     has no canvas would be a baffling bug. */
  if (!EMBED || Embed.has('visual')) render();

  frames++; if (t-fpsT > 500){ fpsEl.textContent = Math.round(frames*1000/(t-fpsT))+' FPS';
                               frames=0; fpsT=t; }
}
resize(); requestAnimationFrame(frame);

/* ====================================================== TOKEN STREAMING
   Phase 1 driver.  Streams canned text word-by-word; every token is an
   impulse into Drive.  Punctuation buys a pause, which is most of what
   makes the motion read as speech. */
const REPLIES = [
  "Interface check. I am rendering from a simulated token stream — no telemetry is attached to this surface. Every impulse you see in the geometry is one token arriving, nothing more.",
  "Five forms are loaded. RIDGE is the one that does not turn — the speech rectified into a landform above its own exact reflection, drawn as a mesh a few hundred rows deep, held at a fixed angle and run edge to edge of the frame. DISC is a rotating ring. ORB is a sphere of latitude rings displaced radially. KNOT is a parametric torus knot that breathes. DNA is a ball-and-stick double helix: a sphere for every base, a thin rod in to the axis, and no backbone drawn at all — the chain of spheres is the backbone.",
  "The tumble is continuous angular velocity on all three axes, re-aimed on an interval. It drifts most of the time, then visibly reorients — which is the behaviour you described, rather than a fixed spin.",
  "Depth cueing is painter's-algorithm only. Chunks are sorted back to front and stroked with alpha and weight falling off with distance, so crossings occlude correctly without any real z-buffer.",
  "Speech synthesis is live. The browser engine will not route through an audio analyser, so there is no real envelope to read — what it gives is one boundary event per word. Each word is split into its estimated syllables and pulsed at speech rate, which is what you are watching now.",
  "The microphone is live and the transcription is local. Your audio is recorded here, posted to this same server, and turned into text by a Whisper model running on the box itself — none of it goes to a third party. The spikes you see while you talk are your real formants, not an estimate.",
];
let replyIx = 0;
let streamTimer = null;

/* ================================================= PHASE 3 — MIC DRIVE
   The first source that isn't estimated. Phases 1 and 2 had to *invent* an
   envelope; here we measure one.

     level  — RMS of the time-domain buffer, written straight to
               Drive.extLevel so the geometry's amplitude is real
     spikes — the FFT is folded onto the formant bins, log-spaced across
               90 Hz .. 4.2 kHz (where speech actually lives), taking the
               PEAK in each band rather than the mean so formants stay
               sharp. binA is what buildField() already reads, so the
               spikes now sit at genuine spectral positions instead of
               being scattered by exciteBins().

   getUserMedia needs a secure context — over plain HTTP the button is
   disabled and says so. Browser AGC/denoise are switched off: they are
   tuned to flatten exactly the dynamics we want to see.               */
const Mic = {
  ok: !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia),
  active:false, ctx:null, node:null, analyser:null, stream:null,
  td:null, fd:null, lo:null, hi:null,

  async start(){
    if (this.active) return;
    /* The capability gate, at the one place a microphone can open. It sits
       above the secure-context check deliberately: an embed denied a mic
       should never reach a prompt, whatever else is true of the page. The
       wake word reaches this method too, which is exactly why the gate is
       here rather than on the TALK button. */
    if (EMBED && !Embed.can('mic')){
      micNote('this embed is not permitted to use a microphone', true);
      return;
    }
    if (!window.isSecureContext){
      micNote('BLOCKED: mic needs a secure origin. Use the https:// URL (port 9701).', true);
      return;
    }
    if (!this.ok){
      micNote('this browser exposes no getUserMedia', true);
      Events.add('no_recorder', {level:'error', once:true,
                                 detail:'no getUserMedia in this browser'});
      return;
    }
    try{
      /* I originally forced all processing OFF to keep the dynamics the
         visualiser feeds on. That is the wrong default once a human is
         actually being transcribed: with auto-gain off, a normally-spoken
         word arrives quiet and the model mishears it, so you end up having
         to stress every word. CLEAN turns the browser's gain and denoise
         back on — much better recognition, slightly flatter geometry.   */
      const clean = S.micdsp !== 'raw';
      this.stream = await navigator.mediaDevices.getUserMedia({
        audio: clean
          ? { echoCancellation:true,  noiseSuppression:true,  autoGainControl:true }
          : { echoCancellation:false, noiseSuppression:false, autoGainControl:false }
      });
    }catch(e){
      micNote('mic refused: ' + (e && e.name ? e.name : e) +
              (e && e.name === 'NotAllowedError' ? ' — permission denied in the browser' : ''));
      /* The one an admin most needs and can least see: a wall screen whose
         microphone was refused looks exactly like one nobody is talking to. */
      Events.add('mic_denied', {level:'error',
                                detail: (e && e.name ? e.name : String(e))});
      return;
    }
    const AC = window.AudioContext || window.webkitAudioContext;
    this.ctx = new AC();
    if (this.ctx.state === 'suspended') await this.ctx.resume();
    this.node = this.ctx.createMediaStreamSource(this.stream);
    this.analyser = this.ctx.createAnalyser();
    this.analyser.fftSize = 2048;
    this.analyser.smoothingTimeConstant = 0.55;
    this.node.connect(this.analyser);        // NOT to destination — no echo
    this.td = new Uint8Array(this.analyser.fftSize);
    this.fd = new Uint8Array(this.analyser.frequencyBinCount);

    // precompute the log-spaced band edges once
    const nyq = this.ctx.sampleRate/2, n = this.analyser.frequencyBinCount;
    const f0 = 90, f1 = 4200;
    this.lo = new Int32Array(BINS); this.hi = new Int32Array(BINS);
    for (let j=0;j<BINS;j++){
      const fa = f0*Math.pow(f1/f0, j/BINS);
      const fb = f0*Math.pow(f1/f0, (j+1)/BINS);
      this.lo[j] = Math.max(0, Math.floor(fa/nyq*n));
      this.hi[j] = Math.min(n, Math.max(this.lo[j]+1, Math.ceil(fb/nyq*n)));
    }
    this.active = true;
    this.floor = -1;                                    // reseed per session
    /* THE PHASE IS NOT TOUCHED HERE, and this line used to say
       `Drive.phase = 'speaking'`. It was doing nothing for the geometry —
       Drive.step ignores the phase entirely whenever extLevel is set, which
       is every frame the mic is open — and it was quietly holding the whole
       display awake: Saver counts idle time only while the phase is 'idle',
       so a screen with its microphone on never reached its screensaver, ever.
       Opening a microphone is not this display speaking. The phase belongs to
       the conversation, and the conversation sets it. */
    micNote('live · ' + Math.round(this.ctx.sampleRate/1000) + ' kHz · ' +
            (this.stream.getAudioTracks()[0] || {}).label);
    syncMic();
  },

  stop(){
    this.active = false;
    /* Whatever was holding the gate open, the microphone it was holding it
       for is gone. Cleared rather than decremented: a tool interrupted by the
       mic closing never gets to release. */
    this.override = 0;
    Drive.extLevel = null;
    Drive.phase = 'idle';
    try { if (this.stream) this.stream.getTracks().forEach(t=>t.stop()); } catch(e){}
    try { if (this.ctx) this.ctx.close(); } catch(e){}
    this.stream = null; this.ctx = null; this.analyser = null;
    micNote('off');
    syncMic();
  },

  open:false,        // push-to-talk gate; ignored when S.ptt is off
  raw:0, level:0, floor:0.010, thresh:0.010, vadOpen:false,

  /* Reasons the mic may drive the figure even with the assistant asleep.
     MIC ONLY is the one that needs it: the rig opens the microphone FOR the
     figure, so gating it would remove the entire point of the toggle.
     CALIBRATE does not, and briefly did — `raw` and the meter are measured
     above the gate now, so calibration reads the room whether the display is
     awake or not. A COUNT rather than a flag, so two holders cannot release
     each other's hold. */
  override:0,
  hold(){ this.override++; },
  release(){ this.override = Math.max(0, this.override - 1); },

  step(){
    if (!this.active || !this.analyser) return;
    // While it is speaking, its own voice is coming out of the
    // speakers and back into the mic. Hand the geometry back to the TTS
    // driver rather than letting it chase its own echo.
    if (Speech.active){ Drive.extLevel = null; return; }
    // Push-to-talk: key up means the mic is closed, so hand the geometry
    // back to the idle model rather than showing room noise.
    if (S.ptt && !this.open){ Drive.extLevel = null; return; }

    this.analyser.getByteTimeDomainData(this.td);
    let sum = 0;
    for (let i=0;i<this.td.length;i++){ const v = (this.td[i]-128)/128; sum += v*v; }
    const raw = Math.sqrt(sum/this.td.length) * S.micgain * 3.2;
    this.raw = raw;                                     // pre-gate, for metering

    /* The visual gate and the speech detector must NOT be the same number.
       Sharing one made the gate do two jobs: raise it so the utterance
       actually ends, and you then have to shout to be heard at all.

       So the geometry keeps the user's gate, while detection uses a
       threshold that floats just above the measured room floor. The floor
       falls quickly toward quiet and rises very slowly, so it settles on
       the noise level rather than on your voice. */
    if (this.floor < 0) this.floor = raw;               // seed from the room
    const a = raw < this.floor ? 0.020 : 0.0030;        // fall fast, rise slow
    this.floor += (raw - this.floor) * a;
    this.thresh = Math.max(0.006, this.floor*2.2 + 0.004);
    this.vadOpen = raw > this.thresh;

    const lvl = raw < S.micgate ? 0 : raw;              // visual gate only
    this.level = lvl;

    /* ASLEEP: THE FIGURE ONLY. Everything above this line runs whatever the
       wake gate says, and it has to — the floor, the threshold and `vadOpen`
       ARE the speech detector, and `Listen.feed` below is what captures the
       utterance the wake word arrives in. Gating this as an early return, the
       way the two guards at the top of this function do, stopped the display
       hearing its own name at all.

       Those two guards can return early because they are cases where there is
       nothing worth measuring: its own voice echoing back, or a closed
       push-to-talk key. Asleep is the opposite — it is the state in which
       listening matters most. So only the two writes that reach the geometry
       are gated: the level, and the formant bins below. See Wake.engaged. */
    const show = this.override
              || typeof Wake === 'undefined' || Wake.engaged();
    Drive.extLevel = show ? Math.min(1.25, lvl) : null;
    Listen.feed(raw, this.vadOpen);
    meter();

    this.analyser.getByteFrequencyData(this.fd);
    /* Writing zeros rather than skipping the loop, so the bins DECAY to
       silence instead of freezing at whatever was last heard. */
    const gateOpen = show && lvl > 0;
    for (let j=0;j<BINS;j++){
      let m = 0;
      for (let i=this.lo[j]; i<this.hi[j]; i++) if (this.fd[i] > m) m = this.fd[i];
      const v = gateOpen ? (m/255) * S.micgain : 0;
      binA[j] += (v*1.9 - binA[j]) * 0.40;              // smooth, keep punch
    }
  }
};
/* Live level readout. The gate is the single most important number for
   hands-free to work at all, and it is unguessable without seeing the
   room's actual noise floor — so show it. */
let _meterAt = 0;
function meter(){
  if (now - _meterAt < 0.1) return;
  _meterAt = now;
  const raw = Mic.raw || 0;
  const open = raw >= S.micgate;
  const bars = Math.min(20, Math.round(raw*40));
  const text =
    'level ' + raw.toFixed(3) +
    '  [' + '#'.repeat(bars).padEnd(20,'·') + ']\n' +
    'voice thresh ' + (Mic.thresh||0).toFixed(3) +
    ' (room ' + (Mic.floor||0).toFixed(3) + ')  ' +
    (Mic.vadOpen ? (Listen.sawSpeech ? 'SPEAKING' : 'voice') : 'quiet') +
    '   ·   visual gate ' + S.micgate.toFixed(3) + (open ? ' open' : '');
  const el = document.getElementById('miclevel');
  if (el){ el.style.whiteSpace = 'pre-line'; el.textContent = text; }
  /* Relayed, because the readout only exists in the panel. Without this it
     was measured ten times a second and shown to nobody — and it is the one
     thing that makes the noise gate settable, since the room's actual floor
     cannot be guessed. Same defect the wake and sleep state readouts had. */
  relay('miclevel', text);
}

/* Measure the room for 2s and put the gate just above it. */
function calibrate(){
  if (!Mic.active){ micNote('press TALK first, then calibrate', true); return; }
  let peak = 0, n = 0;
  micNote('calibrating — stay quiet…');
  const id = setInterval(()=>{
    peak = Math.max(peak, Mic.raw || 0); n++;
    if (n >= 40){
      clearInterval(id);
      const g = Math.min(0.15, peak*1.6 + 0.004);
      S.micgate = g;
      const sl = document.getElementById('s_micgate');
      if (sl){ sl.value = g; sl.dispatchEvent(new Event('input')); }
      micNote('gate set to ' + g.toFixed(3) + ' (room floor ' + peak.toFixed(3) + ')');
    }
  }, 50);
}

/* The status line, and whether what it says is a refusal.
   `bad` is not decoration: this line carries both "here is what happened" and
   "here is why nothing happened", and on a wall screen read from across a room
   those two need to be tellable apart without reading the words. */
/* ================================================================ EVENTS
   What this screen has to say about itself, held until the next poll and sent
   up with it. Not its own request: a screen reporting a fault is a screen
   already having a bad time, and a second connection to make is a second
   thing to fail.

   Queued rather than sent, and capped here as well as at the server: a
   microphone that will not open produces this every time somebody presses the
   button, and the queue must not become the fault. */
const Events = {
  q: [],
  seen: {},
  add(kind, opts){
    if (EMBED || PREVIEW) return;          // neither is a screen on a wall
    const o = opts || {};
    /* A FACT rather than an event — no recorder in this browser will be just
       as true tomorrow — so it is said once and never again. */
    if (o.once){
      if (this.seen[kind]) return;
      this.seen[kind] = 1;
    }
    if (this.q.length >= 12) return;
    this.q.push({kind, level: o.level || 'info',
                 detail: (o.detail || '').slice(0, 300),
                 route: (o.route || '').slice(0, 60),
                 ms: Math.max(0, Math.round(o.ms || 0))});
  },
  /* Taken, not copied: whatever goes out is gone from the queue, so a poll
     that fails does not send the same thing twice on the next one. What that
     costs is a lost report on a dropped poll, which is the right way round —
     a screen that is offline has a fault somebody will see anyway. */
  take(){
    const out = this.q;
    this.q = [];
    return out;
  },
};

/* When anybody last touched this screen. A message that follows a touch is one
   somebody asked for, whatever the wake gate happens to be doing — CALIBRATE,
   MIC ONLY, a code typed into the box. Set by the same listener that ends the
   screensaver, because there is only ever one first touch. */
/* SEEDED AT LOAD, not at zero. The first seconds of a page are when the
   things worth reading happen — no microphone, an insecure origin, no
   recorder — and none of them follows a touch. Starting the clock here gives
   them their moment and then lets the screen go quiet. */
let lastTouch = performance.now()/1000;
const TOUCH_GRACE = 8;          // seconds a touch keeps the screen talkative

/* SHOULD THE WALL STAY QUIET.

   A display asleep still does plenty — it transcribes every utterance in the
   room, because that is the only way the wake word is ever caught — and it was
   narrating all of it. On a wall that is worse than noise: `#status:empty`
   collapses the bar, so each note made it appear, push the figure down and
   vanish again. A screen that twitches at conversations nobody addressed to it
   reads as broken, and the twitching is the part people notice.

   THE QUESTION IS WHETHER THIS SCREEN IS IN A CONVERSATION, and nothing else.
   An earlier version asked the WAKE GATE instead, and it was silently useless:
   `Wake.armed()` is false in auto + push-to-talk, so on a display set that way
   this returned false on the first line and nothing was ever hushed. The gate
   mode is not the question — a push-to-talk screen sitting idle twitches at
   the room exactly as a hands-free one does.

   So: thinking or speaking is a conversation, being awake is a conversation,
   and a touch in the last few seconds means somebody is standing there and the
   messages are for them — which covers CALIBRATE and MIC ONLY on a screen that
   is otherwise asleep, and covers holding SPACE, which is a keydown like any
   other.

   ERRORS ARE HUSHED TOO, and getting that wrong is what made two attempts at
   this fail. `bad` looked like the right exemption — a fault is worth a jump —
   but the most frequent message on an idle screen is flagged with it:
   "nothing recognised" fires on every scrap of room noise that transcribes to
   nothing, which while asleep is nearly all of it. Exempting `bad` exempted
   precisely the thing being complained about.

   A wall loses nothing by it. `relay` still sends every message to the panel,
   `Events.add` still records the real faults, and the ones that matter most —
   no microphone, an insecure origin — happen in the first seconds, which the
   seeded clock above keeps visible. What is left is a screen that says nothing
   about work nobody asked it to do.

   CLEARING is never hushed, or a note left on screen would outlive whatever
   put it there. */
function hush(){
  if (typeof Drive !== 'undefined' && Drive.phase !== 'idle') return false;
  if (typeof Wake !== 'undefined' && Wake.awake) return false;
  return (wallNow() - lastTouch) > TOUCH_GRACE;
}

/* THE PANEL STILL SEES EVERYTHING. Only the painting is suppressed; `relay`
   sends the real text regardless, so an admin watching the rig loses no
   diagnostics because a screen decided to be quiet. */
function micNote(m, bad){
  const el = $('micnote');
  const show = (!m || !hush()) ? m : '';
  if (el){ el.textContent = show; el.classList.toggle('bad', !!bad); }
  relay('micnote', m);
}

/* ============================================== PHASE 3b — SPEECH TO TEXT
   Local. Audio is recorded in the browser and POSTed to /stt on this same
   origin, where faster-whisper transcribes it on the server itself. Nothing
   leaves the machine — deliberately NOT the browser's SpeechRecognition,
   which in Chrome ships your audio to Google. That matters here because the
   whole point is reading hostnames, addresses and device names aloud.

   Voice activity detection reuses the mic's own RMS: the noise gate that
   already decides whether the geometry reacts doubles as the "is anyone
   talking" test, so there is only one threshold to tune. The recorder runs
   continuously and is cut ~0.9s after speech stops; whisper's own VAD trims
   the leading silence, so nothing gets clipped at the start of a word.    */
const Listen = {
  on:false, paused:false, busy:false,
  mr:null, mime:'', chunks:[], sawSpeech:false, quietAt:0, armedAt:0,

  supported(){
    return typeof MediaRecorder !== 'undefined' && typeof fetch === 'function';
  },

  start(stream){
    if (this.on || !stream) return;
    if (!this.supported()){
      micNote('no MediaRecorder in this browser', true);
      Events.add('no_recorder', {level:'error', once:true,
                                 detail:'no MediaRecorder in this browser'});
      return;
    }
    this.on = true;
    this._arm(stream);
    syncTalk();
  },

  _arm(stream){
    const want = ['audio/webm;codecs=opus','audio/webm','audio/ogg;codecs=opus','audio/mp4'];
    this.mime = want.find(t => MediaRecorder.isTypeSupported(t)) || '';
    let mr;
    try { mr = new MediaRecorder(stream, this.mime ? {mimeType:this.mime} : undefined); }
    catch(e){ micNote('recorder failed: ' + e.message, true); this.on = false; syncTalk(); return; }
    this.chunks = []; this.sawSpeech = false; this.quietAt = 0; this.armedAt = now;
    mr.ondataavailable = e => { if (e.data && e.data.size) this.chunks.push(e.data); };
    mr.onstop = () => this._flush();
    try { mr.start(); } catch(e){ micNote('recorder start failed: ' + e.message, true); }
    this.mr = mr;
  },

  _flush(){
    const had = this.sawSpeech;
    const blob = new Blob(this.chunks, {type: this.mime || 'audio/webm'});
    this.chunks = [];
    // re-arm straight away so the next utterance isn't missed
    if (this.on && !this.paused && Mic.stream) this._arm(Mic.stream);
    if (had && blob.size > 2000) this._send(blob);
  },

  async _send(blob){
    this.busy = true;
    /* SAID ONLY WHERE SOMEBODY IS TALKING TO THIS SCREEN. A display asleep
       still transcribes everything it hears — it has to, or the wake word is
       never caught — but announcing each attempt is telling a room about work
       it did not ask for, and it MOVES THE PAGE: `#status:empty` collapses the
       bar, so every passing conversation made it appear, push the figure down
       and vanish again. A screen that twitches at speech nobody addressed to
       it reads as broken.

       The same predicate as the mic's visual gate, so what a display shows and
       what it says about itself agree. Errors below are deliberately NOT
       gated: those are faults, and rare enough not to be a flicker. */
    micNote('transcribing…');                  // hushed by micNote when asleep
    syncTalk();
    try{
      /* No hint. Biasing the decoder toward the wake word — by either
         initial_prompt or hotwords — makes it treat the word as context
         already given and OMIT it from the transcript, which silently
         breaks the matching it was supposed to help. Measured both ways.
         The endpoint still accepts ?hint= for domain vocabulary later. */
      const t0 = performance.now();
      const r = await fetch('stt?model=' + encodeURIComponent(S.sttmodel), {
        method:'POST',
        headers:{'Content-Type': blob.type || 'audio/webm'},
        body: blob
      });
      const j = await r.json();
      if (j.error)      { micNote('stt error: ' + j.error, true);
                          Events.add('stt_error', {level:'error',
                                                   detail: String(j.error)}); }
      else if (j.text)  {
        if (Learn.on){ Learn.take(j.text); }
        else {
          /* NOTHING IS SHOWN UNTIL THE GATE HAS DECIDED IT WAS ADDRESSED.
             This used to print what it heard first and let the gate overwrite
             it, which meant a display in an occupied room put every private
             conversation within earshot on screen — a transcript of people
             who were not talking to it, in a corridor, on a wall. The whole
             argument for a wake word is that what is said near it is none of
             its business, and printing it is exactly as much of a breach as
             answering it would have been.

             What survives is the timing, which is about this device rather
             than about anybody in the room, and it is only written once
             somebody has addressed it. */
          const state = !Wake.armed() ? 'gate off'
                      : Wake.awake && wallNow() < Wake.until
                        ? 'awake, ' + Math.max(0, Math.round(Wake.until - wallNow())) + 's left'
                      : 'woken';
          const act = Wake.gate(j.text);
          if (act){
            const trip = Math.round(performance.now() - t0);
            micNote('heard you  ·  ' + state + '  ·  ' + j.ms + 'ms decode, ' +
                    trip + 'ms round trip, +' + Math.round(S.hangover*1000) + 'ms silence wait');
            /* Measured already and thrown away with the note. Only where it
               ran LONG: a screen doing its job in half a second has nothing
               to report, and a store of ordinary timings is a store nobody
               reads. */
            if (trip >= 3000)
              Events.add('stt_slow', {level:'warn', ms: trip,
                                      detail: j.ms + 'ms decode of ' + trip
                                              + 'ms round trip'});
            submit(act);
          }
        }
      }
      else              micNote('nothing recognised — try speaking a little louder', true);
    }catch(e){
      micNote('stt request failed: ' + e.message, true);
      Events.add('stt_error', {level:'error', detail: e.message});
    }
    this.busy = false; syncTalk();
  },

  /* --- push-to-talk: the key decides the boundaries, not the VAD --- */
  beginPTT(){
    if (!this.on || this.paused || !Mic.stream) return;
    this._arm(Mic.stream);            // fresh recording, no stale silence
  },
  endPTT(heldFor){
    if (!this.on || this.paused || !this.mr) return;
    if (heldFor < 0.3){               // stray tap, not an utterance
      this.sawSpeech = false;
      this._cut();
      micNote('too short — hold SPACE while you speak', true);
      return;
    }
    this.sawSpeech = true;            // they held the key; send it regardless
    this._cut();
  },

  /* fed from Mic.step with the gated level: >0 means the gate is open */
  feed(raw, speaking){
    if (!this.on || this.paused || !this.mr) return;
    if (S.ptt) return;                // key edges do the cutting instead
    if (speaking){
      this.sawSpeech = true; this.quietAt = 0;
      return;
    }
    if (this.sawSpeech){
      if (!this.quietAt) this.quietAt = now;
      else if (now - this.quietAt > S.hangover) this._cut();   // end of utterance
    } else if (now - this.armedAt > 20){
      this._cut();                                         // bin idle silence
    }
  },

  /* Safety net. If the room noise floor sits above the gate, the level
     never returns to zero, the utterance never "ends", and nothing is ever
     sent — the geometry reacts happily while it stays silent. Cut
     regardless after MAXLEN so speech always gets through. */
  MAXLEN: 12,
  overrun(){
    if (!this.on || this.paused || !this.mr || S.ptt) return;
    if (this.sawSpeech && now - this.armedAt > this.MAXLEN){
      micNote('long utterance — sending. If this keeps happening, raise the noise gate.');
      this._cut();
    }
  },

  _cut(){ this.quietAt = 0; try { this.mr.stop(); } catch(e){} },

  stop(){
    this.on = false; this.paused = false;
    if (typeof Wake !== 'undefined') Wake.awake = false;
    if (typeof PTT !== 'undefined'){ PTT.held = false; Mic.open = false; }
    try { if (this.mr) this.mr.stop(); } catch(e){}
    this.mr = null; this.chunks = [];
    syncTalk();
  },

  // don't record its own voice coming back through the speakers
  pause(){
    if (this.on && !this.paused){
      this.paused = true;
      try { if (this.mr) this.mr.stop(); } catch(e){}
      this.mr = null;
    }
  },
  resume(){
    if (this.on && this.paused){
      this.paused = false;
      if (Mic.stream) this._arm(Mic.stream);
    }
  }
};

/* ============================================ NEURAL VOICE (server-side)
   Browser speechSynthesis uses whatever the OS ships, which is mostly old
   concatenative engines — hence the machine-like sound. This plays a neural
   voice rendered on the server instead.

   It also fixes something phase 2 could only fake: because the audio goes
   through Web Audio, we finally get a REAL analyser on its own
   voice. The geometry stops being driven by estimated syllables and starts
   being driven by the actual waveform and spectrum, exactly like the mic. */
const Play = {
  available:false, probed:false, voices:[],
  ctx:null, an:null, src:null, gain:null, td:null, fd:null, lo:null, hi:null,
  playing:false, startedAt:0, dur:1, body:null, caret:null, full:'', onDone:null,

  async probe(){
    try{
      const r = await fetch('tts/voices', {cache:'no-store'});
      const j = await r.json();
      this.voices = j.voices || [];
      this.available = this.voices.length > 0;
      if (!S.ttsvoice && this.voices.length) S.ttsvoice = this.voices[0];
    }catch(e){ this.available = false; }
    this.probed = true;
    paintVoiceList();
    return this.available;
  },

  _audio(){
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!this.ctx) this.ctx = new AC();
    if (this.ctx.state === 'suspended') this.ctx.resume();
    return this.ctx;
  },

  async start(text, r, done){
    this.body = r.body; this.caret = r.caret; this.full = text; this.onDone = done;
    this.shown = 0;
    try{
      /* The route's own voice where it has one, so a room with three
         assistants in it can tell which one just answered without reading
         anything. Resolved from the REPLY's own route: it was read off the
         live binding on the assumption that start() is reached synchronously
         from respond() while that binding still holds, and that assumption is
         false for exactly the endpoint this matters most for — a slow one,
         whose awake window ends before it answers. */
      const resp = await fetch('tts?voice=' + encodeURIComponent(Routes.voiceOf(r.rid)) +
                               '&rate=' + encodeURIComponent(S.vrate), {
        method:'POST', headers:{'Content-Type':'text/plain; charset=utf-8'}, body:text
      });
      if (!resp.ok){ throw new Error('tts ' + resp.status); }
      const buf = await resp.arrayBuffer();
      const ctx = this._audio();
      const audio = await ctx.decodeAudioData(buf);

      const an = ctx.createAnalyser();
      an.fftSize = 2048; an.smoothingTimeConstant = 0.5;
      const src = ctx.createBufferSource();
      src.buffer = audio;
      src.connect(an); an.connect(ctx.destination);

      this.an = an; this.src = src;
      this.td = new Uint8Array(an.fftSize);
      this.fd = new Uint8Array(an.frequencyBinCount);
      const nyq = ctx.sampleRate/2, n = an.frequencyBinCount, f0 = 90, f1 = 4200;
      this.lo = new Int32Array(BINS); this.hi = new Int32Array(BINS);
      for (let j=0;j<BINS;j++){
        this.lo[j] = Math.max(0, Math.floor(f0*Math.pow(f1/f0, j/BINS)/nyq*n));
        this.hi[j] = Math.min(n, Math.max(this.lo[j]+1,
                       Math.ceil(f0*Math.pow(f1/f0, (j+1)/BINS)/nyq*n)));
      }

      this.dur = audio.duration || 1;
      this.startedAt = now;
      this.playing = true;
      Drive.phase = 'speaking';
      src.onended = ()=> this.finishUp();
      src.start();
    }catch(e){
      note('neural voice failed (' + e.message + ') — falling back to the browser voice');
      /* Silent degradation of the part people notice most, and on a wall the
         note that says so is read by nobody. */
      Events.add('tts_fallback', {level:'warn', detail: e.message});
      S.ttsengine = 'browser'; syncSeg('ttsengine');
      Speech.local = false;
      Speech.next();                        // retry through the browser engine
    }
  },

  step(){
    if (!this.playing || !this.an) return;

    this.an.getByteTimeDomainData(this.td);
    let sum = 0;
    for (let i=0;i<this.td.length;i++){ const v = (this.td[i]-128)/128; sum += v*v; }
    Drive.extLevel = Math.min(1.25, Math.sqrt(sum/this.td.length) * 3.4);

    this.an.getByteFrequencyData(this.fd);
    for (let j=0;j<BINS;j++){
      let m = 0;
      for (let i=this.lo[j]; i<this.hi[j]; i++) if (this.fd[i] > m) m = this.fd[i];
      binA[j] += ((m/255)*1.9 - binA[j]) * 0.40;
    }

    // Reveal the transcript across the known audio duration, following it
    // down as it grows. This path is the default engine and used to write
    // the text without ever scrolling, so a long reply ran off the bottom
    // and only came into view once something else forced a scroll.
    const p = Math.min(1, (now - this.startedAt)/this.dur);
    if (this.body){
      const upto = this.full.slice(0, Math.ceil(p*this.full.length));
      if (upto.length !== this.shown){
        this.body.textContent = upto;
        this.shown = upto.length;
        followLog();
      }
    }
  },

  /* Every utterance builds its own analyser and source and wires them to the
     context destination, and that context is shared for the life of the page.
     A node left connected is held alive by the audio graph rather than by the
     reference the next utterance overwrites — so without this, a screen that
     is never reloaded accumulates one live analyser per reply for as long as
     it is up. Both exits release: finishUp is the natural end, stop is the
     interrupted one, and stop clears onended so the two never both run. */
  _release(){
    if (this.src){ try { this.src.disconnect(); } catch(e){} }
    if (this.an){ try { this.an.disconnect(); } catch(e){} }
    this.src = null; this.an = null;
  },

  finishUp(){
    this.playing = false;
    Drive.extLevel = null;
    this._release();
    if (this.body) this.body.textContent = this.full;
    if (this.caret) this.caret.remove();
    const d = this.onDone; this.onDone = null;
    if (d) d();
  },

  stop(){
    if (this.src){ try { this.src.onended = null; this.src.stop(); } catch(e){} }
    this._release();
    this.playing = false;
    Drive.extLevel = null;
  }
};

/* ================================================== PHASE 2 — TTS DRIVE
   speechSynthesis will not route through a Web Audio analyser, so there is
   no real envelope to read. What it does give is a `boundary` event per
   word. That's too coarse on its own — one pulse per word looks robotic —
   so each word is broken into its estimated syllables and pulsed at speech
   rate. The geometry never learns this isn't a real envelope: it still only
   sees Drive.hit() and Drive.level, exactly as in phase 1.

   Safari (and some remote voices elsewhere) fire no boundary events at all.
   If none arrives shortly after speech starts, we fall back to a synthetic
   envelope timed from the text length, and reveal the transcript
   proportionally instead of per-word.                                   */
function syllables(w){
  w = w.toLowerCase().replace(/[^a-z]/g,'');
  if (!w) return 1;
  const m = w.match(/[aeiouy]+/g);
  let n = m ? m.length : 1;
  if (w.length > 3 && /e$/.test(w) && n > 1) n--;    // silent trailing e
  return Math.max(1, Math.min(7, n));
}

const Speech = {
  supported: typeof window !== 'undefined' && 'speechSynthesis' in window,
  voices: [], voice: null,
  active: false, synthetic: false,
  parts: [], pi: 0, base: 0, partLen: 0,
  body: null, caret: null, full: '',
  syl: 0, nextAt: 0, gap: 0.18,
  sawBoundary: false, fallbackAt: 0, startedAt: 0, synthDur: 1,

  speak(text, r){
    this.stop();
    this.full = text; this.body = r.body; this.caret = r.caret;
    // chunk by sentence: long single utterances get truncated in Chrome
    this.parts = text.match(/[^.!?]+[.!?]*\s*/g) || [text];
    this.pi = 0; this.base = 0;
    this.active = true;
    Listen.pause();
    Drive.phase = 'thinking';
    if (S.ttsengine === 'local' && Play.available){
      this.local = true;
      Play.start(text, r, ()=> this.finish());
      return;
    }
    this.local = false;
    /* speak() MUST be called synchronously inside the user gesture that
       triggered it. Chrome gates speechSynthesis on user activation at the
       moment of the call, and a priming utterance does not buy permission
       for a later one — so the old setTimeout "thinking" pause meant every
       utterance was silently dropped. The thinking beat now comes for free
       from the engine's own start latency: phase stays 'thinking' until
       onstart fires. */
    this.next();
  },

  next(){
    if (this.pi >= this.parts.length){ this.finish(); return; }
    const part = this.parts[this.pi];
    this.partLen = part.length;
    const u = new SpeechSynthesisUtterance(part);
    if (this.voice) u.voice = this.voice;
    u.rate = S.vrate; u.pitch = S.vpitch;

    u.onboundary = e => {
      if (e.name && e.name !== 'word') return;
      if (!this.sawBoundary) ev('boundary');
      this.sawBoundary = true; this.synthetic = false;
      const ci = e.charIndex || 0;
      const w  = (part.slice(ci).match(/^\S+/) || [''])[0];
      this.reveal(this.base + ci + w.length);
      this.syl    = syllables(w);
      this.gap    = Math.max(0.055, 0.185 / S.vrate);
      this.nextAt = now;
    };
    const advance = () => {
      if (!this.active) return;
      this.base += part.length; this.pi++; this.next();
    };
    u.onend = advance;
    u.onerror = e => {
      const why = (e && e.error) || 'unknown';
      ev('ERROR:' + why);
      if (why === 'not-allowed')
        note('BLOCKED: the browser wants a real click on the page first. Press TEST VOICE.');
      else if (why !== 'interrupted' && why !== 'canceled')
        note('speech error: ' + why);
      advance();
    };
    // arm the fallback from when audio actually STARTS, not from speak():
    // queueing delay would otherwise burn the window and fire a spurious
    // burst of synthetic pulses before the first real boundary lands
    u.onstart = () => {
      ev('start');
      Drive.phase = 'speaking';
      this.startedAt = now;
      this.fallbackAt = now + 0.9;
    };

    this.startedAt = now;
    this.sawBoundary = false;
    this.fallbackAt  = now + 3.0;      // generous until onstart tightens it
    // ~13 chars/sec of speech at rate 1.0
    this.synthDur = Math.max(0.4, part.length / (13 * S.vrate));
    if (this.pi === 0) evLog.length = 0;
    ev('speak(' + this.pi + ')');
    try { window.speechSynthesis.speak(u); }
    catch(err){ this.goSynthetic(); }
  },

  goSynthetic(){
    if (this.synthetic) return;
    this.synthetic = true;
    // onstart may never have fired (blocked, or a voice that reports
    // nothing), so drop into 'speaking' here or the pulses do nothing
    Drive.phase = 'speaking';
    this.gap = Math.max(0.055, 0.185 / S.vrate);
    this.nextAt = now;
    note('no boundary events from this voice — using estimated envelope');
  },

  reveal(n){
    if (!this.body) return;
    this.body.textContent = this.full.slice(0, Math.min(n, this.full.length));
    followLog();
  },

  step(){
    if (!this.active) return;
    if (this.local){ Play.step(); return; }

    if (!this.sawBoundary && !this.synthetic && now > this.fallbackAt) this.goSynthetic();

    if (this.synthetic){
      if (now >= this.nextAt){
        Drive.hit(3 + Math.random()*5);
        this.nextAt = now + this.gap*(0.7 + Math.random()*0.7);
      }
      const p = Math.min(1, (now - this.startedAt)/this.synthDur);
      this.reveal(this.base + Math.floor(p*this.partLen));
    } else {
      // one pulse per estimated syllable, spread across the word
      while (this.syl > 0 && now >= this.nextAt){
        Drive.hit(3 + Math.random()*5);
        this.syl--;
        this.nextAt += this.gap*(0.75 + Math.random()*0.5);
      }
    }
  },

  finish(){
    this.active = false; this.synthetic = false; this.syl = 0; this.local = false;
    Drive.extLevel = null;
    Listen.resume();
    this.reveal(this.full.length);
    if (this.caret) this.caret.remove();
    Drive.phase = 'idle';
  },

  stop(){
    const was = this.active;
    this.active = false; this.syl = 0; this.local = false;
    Play.stop();
    if (was) Listen.resume();
    // cancel() on an idle queue can itself wedge Chrome — only call it when
    // there is actually something to cancel
    if (!this.supported) return;
    try {
      const ss = window.speechSynthesis;
      if (ss.speaking || ss.pending || ss.paused) ss.cancel();
    } catch(e){}
  }
};
window.addEventListener('beforeunload', ()=>{ Speech.stop(); Mic.stop(); Listen.stop(); });

/* Browsers gate speechSynthesis on user activation at the moment speak() is
   called. No priming utterance here: a queued blank utterance can wedge
   Chrome's speech queue and kill every later one, which is a worse failure
   than the one it prevents. The real fix is calling speak() synchronously
   inside the gesture; this flag exists only for the DIAGNOSE readout. */
let ttsUnlocked = false;
function unlockTTS(){ ttsUnlocked = true; }
['pointerdown','keydown','touchstart'].forEach(ev =>
  window.addEventListener(ev, unlockTTS, true));

function note(msg, bad){
  const el = $('ttsnote');
  const show = (!msg || !hush()) ? msg : '';             // see hush()
  if (el){ el.textContent = show; el.classList.toggle('bad', !!bad); }
  relay('ttsnote', msg);
}

/* Rolling lifecycle trace, so it's visible where speech dies without
   anyone needing to open devtools. */
const evLog = [];
function ev(s){
  evLog.push(s);
  if (evLog.length > 7) evLog.shift();
  note(evLog.join('  →  '));
}

/* convo is capped for the model; this caps what the browser holds on to. A tab
   on a wall is never reloaded, so an uncapped transcript is a DOM that only
   grows — generous enough that scrolling back still feels unbounded to
   somebody sitting at a desk. */
const LOG_MAX = 200;

function addMsg(who, text, rid){
  const el = document.createElement('div');
  el.className = 'msg ' + who;
  /* Stamped with the endpoint this line belongs to. Retuning the label in the
     panel still relabels the whole transcript, but each line is relabelled as
     ITSELF rather than as whoever happens to be answering now.

     PASSED IN, because reading it here reads it too late. A line is built when
     it is drawn, and a reply is drawn when the model has finished thinking —
     by which time a slow endpoint's awake window has lapsed and currentId()
     answers with the DEFAULT. An eleven-second answer from Sparky arrived
     credited to Resonance, which is the one thing a room with three
     assistants in it must never do. Falls back to the live one for anything
     with no route of its own to name. */
  el.dataset.route = rid || Routes.currentId();
  el.innerHTML = '<span class="who"></span><span class="body"></span>';
  el.querySelector('.who').textContent = speakerName(who, el.dataset.route);
  el.querySelector('.body').textContent = text;
  logEl.appendChild(el);
  while (logEl.childElementCount > LOG_MAX) logEl.removeChild(logEl.firstElementChild);
  followLive = true;
  logEl.scrollTop = logEl.scrollHeight;
  return el.querySelector('.body');
}

function newReply(rid){
  const body = addMsg('ai', '', rid);
  const caret = document.createElement('span'); caret.className='caret';
  body.parentElement.appendChild(caret);
  return {body, caret, rid};
}

/* One entry point; the source decides who drives the geometry.
   Muting only silences the VOICE — the reply still streams and the geometry
   still reacts, so the surface never looks dead just because audio is off. */
let muted = false;
/* A line the screen SAYS but does not RECORD.

   `respond` is the wrong tool for this: it opens a reply in the transcript,
   and a sign-in is not part of anybody's conversation — it would sit in the
   log of the next person to use the screen. So the reveal is pointed at two
   detached nodes that are never inserted anywhere. Nothing is written to the
   page; the voice and the figure are the whole of the output, which is what
   was asked for.

   The figure reacts for free: `Speech.speak` sets the phase and the playback
   analyser drives the geometry, exactly as it does for an answer.

   TIMING, and this is the part that decides whether it works at all. Chrome
   gates `speechSynthesis` on user activation AT THE MOMENT OF THE CALL, and a
   sign-in is decided after an await — the activation from the click is spent
   by then, so on the browser voice this is silently dropped. On the LOCAL
   engine it goes through `Play`, which is ordinary audio playback and not
   subject to that gate. So it is reliable on local TTS and best-effort
   otherwise, which is stated in the panel rather than left to be discovered. */
function announce(pool){
  /* A POOL, one per line, the same shape as the greetings — a screen somebody
     signs into all day should not say the same words every time. */
  const lines = String(pool || '').split('\n').map(x=> x.trim()).filter(Boolean);
  if (!lines.length) return;
  const text = expand(lines[(Math.random()*lines.length)|0]).trim();
  if (!text || muted || S.src !== 'tts' || !Speech.supported) return;
  Speech.speak(text, {body: document.createElement('div'),
                      caret: document.createElement('span')});
}

function respond(text, rid){
  clearTimeout(streamTimer);
  Speech.stop();
  const r = newReply(rid);
  if (S.src === 'tts' && Speech.supported && !muted) Speech.speak(text, r);
  else stream(text, r);
}

function stream(text, r){
  clearTimeout(streamTimer);
  Drive.phase = 'thinking';
  const body = r.body, caret = r.caret;

  const toks = text.match(/\S+\s*/g) || [];
  let i = 0;
  const think = 500 + Math.random()*700;

  setTimeout(()=>{
    Drive.phase = 'speaking';
    (function next(){
      if (i >= toks.length){
        caret.remove();
        Drive.phase = 'idle';
        return;
      }
      const tk = toks[i++];
      body.textContent += tk;
      Drive.hit(tk.trim().length);
      followLog();

      let d = S.rate * (0.6 + Math.random()*0.9);
      if (/[,;:]\s*$/.test(tk)) d += S.rate*3.5;      // breath
      if (/[.!?]\s*$/.test(tk)) d += S.rate*7;        // full stop
      streamTimer = setTimeout(next, d);
    })();
  }, think);
}

/* The one place a real assistant gets wired in. DEMO answers from built-in
   text so the whole chain — mic, VAD, transcription, wake word, speech,
   geometry — can be commissioned and proven BEFORE any backend exists, and
   flipped back to afterwards to isolate whether a fault is ours or theirs. */
/* Recent turns, so a question can refer to the last answer. In the tab only:
   nothing is written down and nothing survives a reload. Persisting this is a
   separate decision with its own entry on the roadmap, deliberately not made
   by accident here. */
const convo = [];
const CONVO_MAX = 24;
function remember(role, content){
  convo.push({role, content});
  while (convo.length > CONVO_MAX) convo.shift();
}
function forgetConversation(){ convo.length = 0; }

/* Where this display is, so the server can tell the model what day it is
   here rather than what day it is on the server. Resolved once — it does not
   change while the page is open, and an older browser that does not answer
   simply leaves the server on its own clock. */
const LOCAL_TZ = (()=>{
  try{ return Intl.DateTimeFormat().resolvedOptions().timeZone || ''; }
  catch(e){ return ''; }
})();

/* `bare` sends the question with no conversation behind it. The self-test
   needs that: a diagnostic that inherits whatever was being discussed is
   answered in that context, so it stops being a measurement of the backend
   and becomes a measurement of the backend plus the last ten minutes. */
/* Returns {reply} rather than the bare string it used to. Some endpoints have
   something to say about the conversation as well as in it — a house keeps a
   conversation of its own, and its id comes back beside the words. */
async function askBackend(text, bare, rid){
  /* No display-wide demo switch any more. Whether an endpoint answers from
     built-in text is a property OF that endpoint — the server replies
     {demo:true} for one set to DEMO and the branch below handles it. Two
     places meaning "demo", one of them overriding the other invisibly, is a
     setting nobody could reason about. */
  let who = '';
  try{
    /* Taken and cleared in one step, before the request rather than after
       it: a typed question following a spoken one must not inherit the spoken
       one's trail, and a failed request must not leave it to be picked up by
       the next. */
    const trail = Wake.trail; Wake.trail = null;
    const r = await fetch('ask', {
      method:'POST', headers:{'Content-Type':'application/json'},
      /* The server runs on UTC and the person is not necessarily standing in
         UTC. Only the browser knows where they are, so it says. */
      /* Which name was spoken, so the server knows where to send this. The
         id, not the word: the server has the document this came from and a
         wake word is a thing people mispronounce. An id it does not
         recognise — a route deleted while this display was awake — falls
         back to the default there rather than failing here. */
      /* And which conversation this is a turn of, where the endpoint keeps
         one of its own. It is held for exactly as long as the route binding —
         see Wake.convo — because that is what makes an answer of "which
         room?" followed by "the kitchen" mean anything. */
      /* What was HEARD, before the wake word came off, and how it matched.
         Only for a turn that arrived by voice: a question typed into the
         composer has no recogniser output and no wake word to have matched,
         and inventing one would put a fiction in the record. */
      body: JSON.stringify({text, history: bare ? [] : convo, tz: LOCAL_TZ,
                            /* The one passed in, where there is one. It
                               agrees with the live binding today only because
                               this body is built before the first await —
                               which is a property of how this function is
                               written rather than a rule anybody stated, and
                               the rest of the turn stopped trusting it. */
                            route: rid || Routes.currentId(),
                            trail: trail,
                            conversation_id: bare ? '' : Wake.convo})
    });
    const j = await r.json().catch(()=>({}));
    who = j && j.name || '';
    /* Refused because this display may not use that endpoint. The gate
       upstairs drops these before they are ever sent, so arriving here means
       either a question typed into the composer or a display running code
       that is not the code we shipped — and the answer to both is the same
       silence. Not spoken, not in the transcript, and NOT the "I could not
       reach it" line below: this did reach it, and was refused. */
    if (j && j.refused){
      note('refused: this display may not use ' + (who || 'that endpoint'), true);
      return {reply: '', refused: true};
    }
    // the route still being on demo is not an error, just not wired up yet
    if (j && j.demo) return {reply: REPLIES[replyIx++ % REPLIES.length],
                             route: (j && j.route) || ''};
    if (!r.ok || j.error) throw new Error(j.error || ('HTTP ' + r.status));
    if (j.ms) ev((j.name || 'reply') + ' ' + j.ms + 'ms');
    if (!bare && j.conversation_id) Wake.convo = j.conversation_id;
    /* Which endpoint actually answered. It has been in this response all
       along and only the note used it; the transcript resolved the name for
       itself, later, and got it wrong whenever the answer outlasted the
       awake window. */
    return {reply: j.reply, route: j.route || ''};
  }catch(e){
    /* Say something, and name whoever did not answer. A voice interface that
       goes quiet is indistinguishable from a broken one, and the person may
       not be looking at the screen — a command that failed silently is
       indistinguishable from one that worked, which is worse still.

       The name, never the reason: "the house" is what somebody can act on,
       where "401 from the conversation API" tells them nothing and tells
       everyone in earshot what this box is wired to. The reason goes to the
       note, which is on the screen rather than in the air. */
    note('backend: ' + e.message, true);
    return {reply: "I could not reach " + (who || 'the assistant') + " just then."};
  }
}

function submit(text){
  if (EMBED && !Embed.can('ask')) return;
  /* WHO THIS WAS SAID TO, read now rather than when the answer comes back.
     Everything below this line happens after a round trip that can take ten
     seconds or more, and the wake binding does not survive that: the person's
     own line, the reply, and the voice it is spoken in were all resolved
     against whatever was current at the moment they were drawn, which for a
     slow endpoint is the default. The whole turn belongs to the endpoint that
     was addressed when it was spoken. */
  const rid = Routes.currentId();
  addMsg('you', text, rid);
  remember('user', text);
  qEl.value = '';
  /* Held from here until the answer is in, so the awake window cannot end
     during the wait it is meant to be waiting through. */
  Wake.asked();
  askBackend(text, false, rid)
    /* Released in a finally, not at the top of the then: this counter is the
       only thing keeping the display awake, and a path that skipped it — a
       refusal, a throw inside respond — would be a screen that never sleeps
       again. Exactly once, whatever happened. */
    .finally(()=> Wake.answered())
    .then(out => {
    /* A refusal is silent, so there is nothing to say and nothing to
       remember. Putting an empty turn in the history would leave the next
       question preceded by an assistant that said nothing, which is a thing
       models try to make sense of. */
    if (out.refused) return;
    remember('assistant', out.reply);
    /* The server's answer about which endpoint replied wins where it gives
       one — it is the only party that knows whether it fell through to
       another — and the endpoint that was addressed is the fallback. */
    respond(out.reply, out.route || rid);
    /* Nothing here ends the conversation. A house reports that it has finished
       acting, and for one day this slept on that — which made it the one
       endpoint you could not speak to twice, silently, with every following
       sentence dropped at the wake gate by a display that looked broken. The
       awake window ends conversations, everywhere, the same way. */
  });
}
qEl.addEventListener('keydown', e=>{
  if (e.key !== 'Enter') return;
  const v = qEl.value.trim(); if (!v) return;
  submit(v);
});

/* Commissioning check: exercises each link in the chain and says which one
   is broken, rather than leaving you to guess from silence. */
async function selfTest(){
  const el = $('selftest');
  const lines = [];
  const show = (t)=>{ if (el) el.textContent = t; relay('selftest', t); };
  const say = (ok, m) => { lines.push((ok ? '  ok   ' : '  FAIL ') + m); show(lines.join('\n')); };
  show('running…');

  say(!!window.isSecureContext, 'secure origin (' + location.protocol + ') — needed for the mic');

  try{
    const r = await fetch('settings', {cache:'no-store'});
    const j = await r.json();
    say(r.ok, 'shared settings readable (' + Object.keys(j.settings||{}).length + ' stored)');
  }catch(e){ say(false, 'shared settings unreachable: ' + e.message); }

  try{
    const r = await fetch('stt/status', {cache:'no-store'});
    const j = await r.json();
    say(r.ok && !j.error, 'speech-to-text service · model ' + j.model +
        ' · loaded [' + (j.loaded||[]).join(', ') + ']');
  }catch(e){ say(false, 'speech-to-text unreachable: ' + e.message); }

  try{
    const r = await fetch('tts/voices', {cache:'no-store'});
    const j = await r.json();
    say((j.voices||[]).length > 0, 'neural voice service · ' +
        (j.voices||[]).length + ' installed · using ' + (S.ttsvoice || 'default'));
  }catch(e){ say(false, 'neural voice service unreachable: ' + e.message); }

  say(Speech.supported && Speech.voices.length > 0,
      'speech out · ' + Speech.voices.length + ' voices · ' +
      (Speech.voice ? Speech.voice.name : 'none selected'));
  say(!!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia), 'microphone API present');
  say(typeof MediaRecorder !== 'undefined', 'audio recorder present');
  say(Mic.active, 'microphone open' + (Mic.active ? '' : ' — press TALK to test it'));

  /* A real instruction, not the words "self test". A model handed two words
     with no question in them quite reasonably asks what you mean, and that
     non-answer then gets spoken aloud and read as a failure — the check
     passes, the transcript says something baffling. Ask it something it can
     actually answer, with no conversation behind it. */
  const cur = Routes.current();
  /* Which device the server thinks this is. Not being approved is not a
     failure — a personal install restricts nothing and never needs it — so
     the check is whether a token was issued at all, and the state rides in
     the text where somebody commissioning a wall display will read it. */
  say(Display.known || PREVIEW || !!EMBED, 'display identity · ' +
      (EMBED ? 'embedded — an embed is not a display and holds no token'
       : PREVIEW ? 'preview — the panel, not a display'
       : !Display.known ? 'no token issued — cookies may be blocked in this browser'
       : Display.name + ' (' + Display.id + ') · ' +
         (Display.approved ? 'approved'
                           : 'not approved — endpoints restricted to named '
                             + 'displays will refuse it')));

  say(Routes.list.length > 0, 'endpoints · ' +
      (Routes.list.map(r=> r.name +
                           (r.wakeword ? ' (“' + r.wakeword + '”' +
                                         (r.strict ? ', exact' : '') + ')' : '') +
                           (Routes.usable(r) ? '' : ' — not for this display')).join(', ')
       || 'none — nothing has a name to answer to'));

  /* Against the route the display would actually use right now, which is the
     default unless something woke it — so the line says which. A self-test
     that silently tested a different destination from the one that answers
     would be worse than no self-test. */
  const {reply} = await askBackend(
    'Reply with one short sentence confirming you can hear me.', true);
  say(!!reply, 'default endpoint “' + (cur ? cur.name : 'none') + '” answered ' +
      (reply ? reply.length + ' chars: "' + reply.trim().slice(0, 60) +
               (reply.trim().length > 60 ? '…' : '') + '"'
             : 'nothing'));

  /* Identity rather than count: the transcript is capped, so once it is full a
     new line replaces an old one and the total never moves. Counting here
     would report a working reply as a failure on any display that had been up
     long enough to reach the cap. */
  const lastMsg = ()=>{ const m = document.querySelectorAll('.msg'); return m[m.length-1] || null; };
  const before = lastMsg();
  respond(reply);
  say(lastMsg() !== before, 'reply rendered and spoken');

  lines.push(lines.some(l=>l.startsWith('  FAIL')) ? '\nsomething above needs fixing.'
                                                   : '\nall green.');
  show(lines.join('\n'));
}

function setPalette(p){
  const c = PALETTES[p]; const r = document.documentElement.style;
  r.setProperty('--hue',c.hue); r.setProperty('--hue-dim',c.dim);
  r.setProperty('--glass',c.glass); r.setProperty('--ink',c.ink);
}

/* Typography. Two variables and nothing else: every font-size on the page is
   a multiple of --fs, and every element inherits its family, so these two
   move the whole interface together and cannot leave one part of it behind.

   Both are validated against the lists rather than written through — the
   value arrives from a settings document, and a settings document is a file
   somebody can edit by hand. An unknown face would otherwise become a raw
   font-family string, and an unknown size a raw multiplier. */
const FACES = {mono:'--face-mono', sans:'--face-sans', wide:'--face-wide'};
const SIZES = ['1', '1.12', '1.25'];
function setType(){
  const r = document.documentElement.style;
  const v = FACES[S.face] || FACES.mono;
  r.setProperty('--face', 'var(' + v + ')');
  r.setProperty('--fs', SIZES.indexOf(String(S.fs)) >= 0 ? String(S.fs) : '1');
}

// `src` appears both in the composer chips and in the rig, so a click has
// to update every seg bound to that key, not just the one clicked
const BOOL_KEYS = new Set(['ptt','byeontimeout']);
function syncSeg(key){
  document.querySelectorAll('.seg[data-set="'+key+'"] button').forEach(b=>
    b.classList.toggle('on',
      BOOL_KEYS.has(key) ? (b.dataset.v === '1') === !!S[key] : b.dataset.v === S[key]));
}
document.querySelectorAll('.seg[data-set]').forEach(seg=>{
  const key = seg.dataset.set;
  seg.addEventListener('click', e=>{
    const b = e.target.closest('button');
    if (!b || b.disabled) return;
    S[key] = BOOL_KEYS.has(key) ? b.dataset.v === '1' : b.dataset.v;
    syncSeg(key);
    if (key==='palette') setPalette(S[key]);
    if (key==='tmode')   reorient();
    if (key==='src'){ Speech.stop(); clearTimeout(streamTimer); Drive.phase='idle'; }
    if (key==='ptt'){ setPtt(S.ptt); syncWake(); }
    if (key==='wake'){ Wake.awake = false; syncTalk(); syncWake(); }
    if (key==='byeontimeout') syncWake();
    if (key==='ttsengine'){ Speech.stop(); syncEngine(); }
    if (key==='micdsp' && Mic.active){        // constraints apply at open time
      const wasListening = Listen.on;
      Listen.stop(); Mic.stop();
      micNote('reopening mic with ' + S.micdsp + ' processing…');
      Mic.start().then(()=>{ if (wasListening && Mic.active) Listen.start(Mic.stream); });
    }
    if (key==='layout'){ document.body.dataset.layout = S.layout; setTimeout(resize,0); }
  });
});

const SLIDERS = [];
function slider(id, key, fmt){
  const s = $('s_'+id), o = $('o_'+id);
  if (!s) return;                 // the controls live on the admin page now
  const paint = ()=>{ s.value = S[key]; if (o) o.textContent = fmt? fmt(S[key]) : S[key]; };
  const sync  = ()=>{ S[key] = parseFloat(s.value); if (o) o.textContent = fmt? fmt(S[key]) : S[key]; };
  s.addEventListener('input', sync); paint();
  SLIDERS.push(paint);
}

/* Text areas / inputs are bound by hand; collect their painters too so one
   call can rebuild the whole panel after settings arrive from the server. */
const FIELDS = [];
function bindField(id, key){
  const el = document.getElementById(id);
  if (!el) return;
  const paint = ()=>{ el.value = S[key] == null ? '' : S[key]; };
  el.addEventListener('input', ()=>{ S[key] = el.value; });
  paint();
  FIELDS.push(paint);
}

   speaker or the canvas. It asks this page to do them instead. */

  idle:     ()=>{ clearTimeout(streamTimer); Speech.stop(); Drive.phase='idle'; },
