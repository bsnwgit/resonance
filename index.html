     nowhere to type it and no sign that a code was a thing. */
  /* CAN THIS BROWSER ACTUALLY USE WHAT IS ON THIS PORT? The server already
     answered that per endpoint, in `allowed`, and its answer accounts for the
     endpoint's own sign-in requirement and its allow-list. If something here
     is usable, this browser is not somebody who has to get past a gate — it
     is somebody who can talk to the assistant, and putting a sign-in box in
     front of them would be the deployment-wide approval setting overruling
     the per-endpoint one that replaced it.

     That collision is exactly what this fixes: "General users require
     approval" forced the request form onto EVERY unapproved browser, so an
     endpoint deliberately set to need no sign-in still met one.
 
     A screen being commissioned reaches the code box the other way, by typing
     <server>/e/CODE, which is the path the documentation already gives for a
     television with a remote. */
  const usableHere = (Routes.list || []).some(r=> Routes.usable(r));
  /* A PORT WITH NOTHING ON IT. Not a gate: there is no assistant here to sign
     in to, so a sign-in box would be asking somebody to authenticate to an
     empty room. Says what is true and what fixes it. */
  /* `Routes.loaded`, not just an empty list. Before the first successful
     read the list is empty because nothing has arrived yet, and saying "no
     assistant answers here" then would be this page reporting its own
     unfinished boot — or a dropped request — as a configuration fault. */
  const emptyPort = D.known && Routes.loaded && !(Routes.list || []).length;
  const canEnrol = D.known && D.state !== 'approved' && !usableHere && !emptyPort;
  if (emptyPort){
    document.body.toggleAttribute('data-request', true);
    document.body.toggleAttribute('data-gate', true);
    const head = $('gatehead'), note = $('gatenote'), fields = $('gatefields'),
          links = $('gatelinks');
    if (fields) fields.style.display = 'none';
    if (links) links.style.display = 'none';
    if (head) head.textContent = 'Nothing is set up on this port';
    if (note){
      note.className = '';
      note.textContent = 'No assistant answers here yet. An administrator '
                       + 'gives one this port under ACCESS ▸ AI.';
    }
    ['reqhead', 'reqform', 'reqsend', 'reqnote', 'enrol'].forEach(id=>{
      const el = $(id);
      if (el) el.style.display = 'none';
    });
    return;
  }
  const canAsk = canEnrol && D.canRequest;
  document.body.toggleAttribute('data-enrol', canEnrol);
  document.body.toggleAttribute('data-request', canEnrol);
  /* The gate and the page it sits on appear together: anything that is not an
     approved screen is somebody who has to get past this, whichever of the
     four ways is theirs. */
  document.body.toggleAttribute('data-gate', canEnrol);
  /* AND THE GATE IS PAINTED HERE. It was painted only when a person arrived or
     when a link was pressed, so a first load with neither showed the markup's
     own defaults: the sign-in box with the confirm-password field still in it
     and the code box open underneath. Everything corrected itself the moment
     anything was clicked, which is the signature of a state that is drawn on
     change and never on arrival. */
  paintGate();
  if (!canEnrol) return;
  /* REQUEST ACCESS is not offered where nobody may ask. The link would open a
     form this deployment refuses to take, which is worse than not offering
     it: somebody fills the thing in before finding out. */
  const reqlink = $('gatereq');
  if (reqlink) reqlink.style.display = canAsk ? '' : 'none';
  if (GATE === 'request' && !canAsk) GATE = 'login';
  if (GATE !== 'request'){
    ['reqhead', 'reqform', 'reqsend', 'reqnote'].forEach(id=>{
      const el = $(id);
      if (el) el.style.display = 'none';
    });
    return;
  }
  /* The three request elements go away when nobody may ask, leaving the code
     box as the whole of the page — which is what it is for a screen being
     commissioned in a deployment that takes no requests. */
  $('reqhead').style.display = canAsk ? '' : 'none';
  $('reqsend').style.display = canAsk ? '' : 'none';
  $('reqnote').style.display = canAsk ? '' : 'none';
  if (!canAsk){ $('reqform').style.display = 'none'; return; }

  const head = $('reqhead'), form = $('reqform'), btn = $('reqsend');
  /* Three ways to arrive here, and they are not the same conversation: never
     asked, asked and waiting, or asked and turned down. */
  const asking = D.state === 'requested';
  const again = D.state === 'expired' || (D.answered && D.state !== 'denied');
  head.innerHTML = '';
  const line = document.createElement('div');
  line.textContent =
      D.state === 'denied'  ? 'This device was not given access.'
    : D.state === 'expired' ? 'This device’s access has run out.'
    : asking                ? 'Waiting for somebody to decide.'
    : 'This device has not been given access yet.';
  head.appendChild(line);
  const sub = document.createElement('div');
  sub.style.marginTop = '6px';
  sub.style.opacity = '.72';
  sub.textContent =
      D.state === 'denied'  ? (D.reason || 'No reason was given.')
                              + (D.mayAskAgain ? ' You can ask again.'
                                               : ' It cannot ask again.')
    : D.state === 'expired' ? 'Ask again — you will not have to fill this in '
                              + 'a second time.'
    : asking                ? 'Nothing else to do here. This screen will say '
                              + 'so as soon as it is decided.'
    : 'Fill this in and somebody will decide.';
  head.appendChild(sub);

  /* Only ever rebuilt when there is something new to draw. Re-rendering under
     somebody's cursor would take the field they were typing in away from
     them, and a form somebody is filling in is exactly the wrong thing to
     replace on a twenty-second timer. */
  /* The form is wanted even where an admin defined no fields: the address is
     always asked for, so there is always something to fill in. It used to
     stand or fall on D.form.length, which would now hide the one field that
     is not optional. */
  const wantForm = !asking && !again && D.mayAskAgain;
  if (wantForm && !form.contains(document.activeElement)
      && form.dataset.built !== String(D.form.length)){
    form.innerHTML = '';
    /* FIXED, AND FIRST. This is not something a deployment chose to ask —
       it is the login the request is FOR, so it cannot be renamed, reordered
       or switched off. Everything under it is the admin's own. */
    const mlab = document.createElement('label');
    const mcap = document.createElement('span');
    mcap.textContent = 'Email address';
    mlab.appendChild(mcap);
    const mel = document.createElement('input');
    mel.type = 'email'; mel.id = 'reqemail';
    mel.autocapitalize = 'none'; mel.spellcheck = false;
    mel.placeholder = 'you@example.com';
    mlab.appendChild(mel);
    form.appendChild(mlab);
    const mnote = document.createElement('div');
    mnote.className = 'req';
    mnote.style.marginTop = '-4px';
    mnote.textContent = 'this is what you will sign in with';
    form.appendChild(mnote);
    D.form.forEach((f, i)=>{
      const lab = document.createElement('label');
      const cap = document.createElement('span');
      cap.textContent = f.label;
      if (!f.required){
        const opt = document.createElement('span');
        opt.className = 'req';
        opt.textContent = '  optional';
        cap.appendChild(opt);
      }
      lab.appendChild(cap);
      const el = document.createElement(f.message ? 'textarea' : 'input');
      el.dataset.i = i;
      if (!f.message) el.type = 'text';
      el.spellcheck = !!f.message;
      lab.appendChild(el);
      form.appendChild(lab);
    });
    form.dataset.built = String(D.form.length);
  }
  form.style.display = wantForm ? '' : 'none';

  btn.style.display = (asking || !D.mayAskAgain) ? 'none' : '';
  btn.textContent = again ? 'ASK AGAIN' : 'REQUEST ACCESS';
  btn.disabled = false;
  btn.dataset.renew = again ? '1' : '';
}

function reqNote(m, bad){
  const el = $('reqnote');
  if (!el) return;
  el.className = bad ? 'bad' : '';
  el.textContent = m || '';
}

async function sendRequest(){
  const btn = $('reqsend');
  const renew = btn.dataset.renew === '1';
  const answers = {};
  let email = '';
  if (!renew){
    $('reqform').querySelectorAll('[data-i]').forEach(el=>{
      answers[el.dataset.i] = el.value;
    });
    email = (($('reqemail') || {}).value || '').trim();
    /* Caught here as well as at the server. The person is standing in front of
       this screen and can fix it now; the admin reading the row tomorrow
       cannot, and an approved request with no address is an account nobody
       can ever sign in to. */
    if (!email){
      reqNote('an email address is needed — it is what you will sign in with',
              true);
      if ($('reqemail')) $('reqemail').focus();
      return;
    }
  }
  btn.disabled = true;
  reqNote('sending…');
  try{
    const r = await fetch('display/request', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify(renew ? {renew:true} : {answers, email})
    });
    const j = await r.json().catch(()=>({}));
    if (!r.ok || !j.display) throw new Error(j.error || ('HTTP ' + r.status));
    Display.take(j.display);
    reqNote('');
    paintRequest();
    Display.watch();
  }catch(e){
    btn.disabled = false;
    reqNote(e.message, true);
  }
}

function enrolNote(m, bad){
  const el = $('enrolnote');
  if (el){ el.textContent = m; el.classList.toggle('bad', !!bad); }
}

/* Six characters, redeemed in place. The URL form still works and still has
   its place — a television with a remote and no browser open yet — but a
   screen already showing this page should not send somebody back to the
   address bar to finish setting it up. */
async function useCode(){
  const el = $('enrolcode'), btn = $('enrolgo');
  const code = (el.value || '').replace(/[^A-Za-z0-9]/g, '');
  if (!code){ enrolNote('type the code first', true); el.focus(); return; }
  btn.disabled = true;
  enrolNote('checking…');
  try{
    const r = await fetch('display/enrol', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({code})
    });
    const j = await r.json().catch(()=>({}));
    if (!r.ok || !j.display){
      /* The server's own three reasons, in words. A code typed off another
         screen is mistyped often enough that "no" is not a useful answer. */
      const why = (j && j.state) || '';
      throw new Error(
          why === 'expired' ? 'that code had expired — ask for a new one'
        : why === 'blocked' ? 'too many wrong codes — wait a minute and try again'
        : 'that code was not recognised — check it and try again');
    }
    /* Reloaded rather than continued in place. This device has just become a
       different display: a new token, a name, its own appearance and whatever
       endpoints were ticked for it before the screen was ever switched on. A
       reload picks all of that up in the order the page already knows how to
       do it, instead of a second path through the same setup that would have
       to be kept in step with the first. */
    enrolNote('enrolled — starting up…');
    location.replace('?enrol=ok');
  }catch(e){
    btn.disabled = false;
    enrolNote(e.message, true);
    el.select();
  }
}

/* The answer, whichever way it went. It interrupts once and then gets out of
   the way — the person asked and walked off, and a status line they are not
   looking at is not a reply. */
function verdict(title, body){
  const box = $('verdict');
  if (!box) return;
  $('verdicttitle').textContent = title;
  $('verdictbody').textContent = body || '';
  box.classList.add('on');
  // The screensaver hides this while it drifts, and an answer somebody has
  // been waiting days for must not arrive behind it.
  Saver.poke();
}

/* ================================================================ ROUTES
   Three names reaching three destinations. A route is a name, a wake word
   and its aliases, an adapter and its configuration, and optionally its own
   voice — so you can HEAR which one answered, which matters the moment two
   of them can reply to the same room.

   This page sees two thirds of one. Presentation and routing arrive here
   because wake-word matching happens in the browser and a newly hung display
   has to look right; the connection half — adapter kind, base URL, key —
   is never published to any browser at any tier. So nothing on this page
   knows or can say what a route is wired to. It knows a name and a word.

   The document is public and this page only reads it, exactly like the
   shared settings. */
const Routes = {
  list: [], defaultId: '',
  /* Whether the list has ever ARRIVED, as against being empty. The two are
     not the same and one caller has to tell them apart: a port with no
     endpoint on it says so and hides the interface, and doing that because a
     fetch failed would take a working screen off the air over one bad
     response. Set only on a successful read, and never cleared — a later
     failure leaves the last good list rather than pretending there is none. */
  loaded: false,

  async load(){
    try{
      const r = await fetch('routes', {cache:'no-store'});
      const j = await r.json();
      /* A wake word is no longer required to be on the list. Without a
         display token the routing half does not arrive at all, and an
         endpoint with a name and no word is exactly what that looks like —
         still worth holding, because {assistant} and the transcript's labels
         are drawn from it and a page that has not enrolled should still read
         correctly. It simply answers to nothing. */
      this.list = (j && j.routes || []).filter(x=> x && x.id);
      this.defaultId = (j && j.default) || (this.list[0] || {}).id || '';
      this.loaded = true;
      return this.list.length;
    }catch(e){ return -1; }
  },

  byId(id){ return this.list.find(r=> r.id === id) || null; },

  /* May this display use it? The server decides and sends the answer beside
     each endpoint; absent means yes, so nothing here has to know what the
     rule was. An endpoint arrives here whether or not the answer is yes — the
     wake word of one this display may NOT use is exactly what the gate needs
     in order to drop that utterance instead of passing it to somebody else's
     conversation. */
  usable(r){ return !!r && r.allowed !== false; },

  /* Everything it can actually be woken by. */
  wakeable(){ return this.list.filter(r=> r.wakeword && this.usable(r)); },

  /* Where a question goes. The wake word that woke it decides, and the route
     stays bound to the CONVERSATION rather than to the sentence — a
     follow-up reaches the same destination without being re-addressed, which
     is the only tolerable behaviour for speech. Nothing was addressed at all
     when it was typed into the composer or the wake gate is off, and that is
     what the default is for. */
  current(){
    if (Wake.route){ const r = this.byId(Wake.route); if (r) return r; }
    const d = this.byId(this.defaultId);
    if (this.usable(d)) return d;
    /* The default is one this display may not use, so every question typed
       into the composer would be refused at the server. Fall to the first it
       may — which is what the server does with a default that has been
       switched off, for the same reason: a composer that silently does
       nothing is worse than one that answers from somewhere reachable. */
    return this.list.find(r=> this.usable(r)) || d || this.list[0] || null;
  },
  currentId(){ const r = this.current(); return r ? r.id : ''; },

  /* Every form one route answers to. */
  words(r){ return r ? [r.wakeword].concat(r.aliases || []).filter(Boolean) : []; },

  /* For the "say X to wake me" note. Wake words, not names: the word is what
     somebody has to say, and on most routes the two are the same anyway.
     Only the ones this display may actually reach — telling somebody to say a
     word that will be dropped is worse than telling them nothing.

     Empty is a real answer now, so it is one rather than a made-up word: an
     unapproved display answers to nothing at all, and printing “resonance”
     at somebody standing in front of it would be a lie they can test. */
  spoken(){
    const w = this.wakeable().map(r=> '“' + r.wakeword + '”');
    return w.length ? w.join(' or ') : '';
  },

  /* …and why, when it is empty. Two different silences: one is a display
     waiting for somebody to approve it, the other is a server with no
     endpoint that has a name. */
  mute(){
    return Display.known && !Display.approved
      ? 'this display has not been approved yet, so no name reaches anything from it'
      : 'nothing here has a name to answer to';
  },

  /* The voice this route answers in, falling back to the shared choice.
     Hearing which one replied is worth more than reading it on a wall
     display that shows no text at all. */
  voice(){
    const r = this.current();
    return (r && r.voice) || S.ttsvoice || '';
  },
  /* The voice of ONE route, named. current() is right while somebody is being
     answered and wrong the moment the answer takes longer than the awake
     window: the reply arrives, the binding has lapsed, and the endpoint that
     did the work is spoken in the default's voice. Anything that speaks a
     reply resolves it through here, with the id the reply came back with. */
  voiceOf(rid){
    const r = rid ? this.byId(rid) : null;
    return (r && r.voice) || (rid ? (S.ttsvoice || '') : this.voice());
  },
};
const FALLBACK_WAKEWORD = 'resonance';

/* ---------------------------------------------------------- variables
   One expander for every setting that names something — the greeting, the
   farewell, and the two transcript labels. `{name}` predates this and meant
   the wake word, so it keeps meaning exactly that rather than being renamed
   into a tidier scheme that would break every greeting already written.
   With routes there are several wake words, so it means the one belonging to
   whichever route is answering — which is the same sentence, and now says
   something more useful.

   `{assistant}` is its name, which is a separate field. Put it in the
   assistant label and the transcript attributes each answer to whichever one
   gave it.

   An unknown variable is left standing rather than blanked. Somebody typing
   {displya} should see their typo, not a name that silently vanished. */
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
/* Each takes the endpoint it is being expanded FOR. Usually that is whichever
   is answering, but a transcript line written twenty minutes ago belongs to
   whoever gave it — recomputing those against the endpoint bound now would
   rewrite history every time somebody switched. */
/* No argument means "whoever is answering" — a greeting, a farewell, anything
   said in the moment. An argument means a specific endpoint, and an argument
   that names nothing means the DEFAULT rather than whoever is bound now: the
   opening line is written before the endpoints have finished loading, so it
   carries no id, and resolving that to "current" made it drift to a different
   name every time somebody switched. */
function forRoute(rid){
  return rid === undefined ? Routes.current()
                           : (Routes.byId(rid) || Routes.byId(Routes.defaultId));
}
const VARS = {
  name:    (rid)=>{
    const r = forRoute(rid);
    return cap(((r && r.wakeword) || FALLBACK_WAKEWORD).trim());
  },
  assistant: (rid)=>{
    const r = forRoute(rid);
    return cap(((r && r.name) || FALLBACK_WAKEWORD).trim());
  },
  /* The name it is listed under, which is the admin's once somebody has set
     one and the declared name until then. The same place either way, so a
     {display} written into a greeting before approval keeps meaning what it
     meant after it. */
  display: ()=> Display.named || DISPLAY_NAME,
  /* WHO IS SIGNED IN, which nothing here could say before. Every name this
     table held was a machine's or an assistant's, because the transcript
     label predates accounts entirely: the only way to attribute a line was
     the device it was typed at, and {display} in `the person` is a laptop
     labelling its owner's words with the laptop's name.

     It falls through to the device, so ONE setting is right in both places a
     screen can be. A personal browser has somebody signed in and says their
     name; a wall screen has nobody and says the room's. Without the fallback
     an admin would have to choose which of the two to get wrong. */
  user: ()=> Person.name || Display.named || DISPLAY_NAME,
};
function expand(s, rid){
  return String(s == null ? '' : s).replace(/\{(\w+)\}/g, (m, k)=>{
    const f = VARS[k.toLowerCase()];
    return f ? f(rid) : m;
  });
}

/* The label above a line of transcript. Falls back to the shipped default
   when a setting expands to nothing — `{display}` on a URL that declared no
   name would otherwise leave the line attributed to nobody at all. */
const SPEAKER_FALLBACK = {you: 'operator', ai: 'resonance'};
function speakerName(who, rid){
  const raw = who === 'you' ? S.opname : S.ainame;
  return expand(raw, rid).trim() || SPEAKER_FALLBACK[who] || '';
}

/* ------------------------------------------------------- viewer prefs
   The three controls a viewer actually has, remembered in this browser
   until its data is cleared, so a display stays how they left it.

   Deliberately narrow: everything else — look, geometry, palette, voice,
   wake word — stays in the shared settings document, because the whole
   point of that document is that one admin decides what everyone sees.
   Only what a viewer can already reach is theirs to keep.

   A stored choice outranks the admin's value, and keeps outranking it after
   the admin changes theirs. Once someone has muted this display it stays
   muted for them; clearing browser data is what puts it back.

   The microphone is NOT remembered. Re-opening it on load would trip a
   permission prompt nobody asked for, and a page that turns your microphone
   on by itself is not a page anyone should ship. */
const PREFS_KEY = 'resonance.prefs';
const Prefs = {
  data: {},
  load(){
    try{
      const raw = JSON.parse(localStorage.getItem(PREFS_KEY));
      this.data = (raw && typeof raw === 'object') ? raw : {};
    }catch(e){ this.data = {}; }
  },
  has(k){ return Object.prototype.hasOwnProperty.call(this.data, k); },
  get(k, fallback){ return this.has(k) ? this.data[k] : fallback; },
  set(k, v){
    this.data[k] = v;
    try{ localStorage.setItem(PREFS_KEY, JSON.stringify(this.data)); }catch(e){}
    /* …and to the person, where one has unlocked. Kept in the browser as well
       rather than instead: the local copy is what this machine falls back to
       when nobody is signed in, and losing it because somebody once unlocked
       here would change what the machine does after they leave. */
    this.push();
  },
  /* The server's copy, taken wholesale. Not merged with what this browser had
     — a merge would mean a machine somebody borrowed once quietly voting on
     their settings forever. */
  adopt(obj){
    if (!obj || typeof obj !== 'object') return;
    this.data = Object.assign({}, this.data, obj);
    try{ localStorage.setItem(PREFS_KEY, JSON.stringify(this.data)); }catch(e){}
  },
  push(){
    /* Signed in, which is the only state there is now — `open` was the
       third of three when a PIN was optional. A browser with no session
       keeps its preferences locally, exactly as this page always has. */
    if (typeof Person === 'undefined' || !Person.is()) return;
    clearTimeout(this._t);
    /* Debounced. Three switches can move in a second while somebody settles
       in, and each one is a write of a document nobody is reading yet. */
    this._t = setTimeout(()=>{
      const out = {};
      ['ptt', 'muted', 'text'].forEach(k=>{ if (this.has(k)) out[k] = !!this.data[k]; });
      fetch('person/settings', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({settings: out}),
      }).catch(()=>{});
    }, 400);
  },
  _t: 0,
};
Prefs.load();

/* ---------------------------------------------------------------- state */
const S = {
  mode:'ridge', palette:'blue', layout:'hero',
  /* HOW THE CLOCK READS, from SETTINGS ▸ ADMIN ▸ Time format. Declared here
     with the shipped default and not merely read off the document, because a
     settings load takes only the keys this page already has — see the merge in
     loadSettings — so a key with no default here is a setting the server sends
     and the display silently drops. */
  clock_time:'locale', clock_date:'locale',
  /* WHAT THE SCREEN SAYS ALOUD WHEN SOMEBODY SIGNS IN, and when somebody
     fails to. BOTH EMPTY BY DEFAULT, which means silent — and that is the
     right default rather than a timid one. A wall in a shared space
     announcing "that did not work" tells everybody in earshot that somebody
     just got a password wrong, and announcing the success tells them who is
     now signed in. Neither is a thing to switch on for somebody. */
  loginok:'', loginbad:'',
  face:'mono', fs:'1',                 // typography — see setType()
  /* Who the transcript says is speaking. The assistant's label defaults to
     the VARIABLE rather than to a word: with several endpoints a fixed label
     attributes every answer to the same name, which is wrong the moment a
     second one exists. It was a literal while there was only one, and that
     reasoning did not survive the endpoints landing. The person's stays
     literal — nothing about them varies. */
  opname:'operator', ainame:'{assistant}',
  amp:1.0, lines:16, lag:3, depth:230, spread:620, persp:1100,
  tumble:1.0, reorient:12,
  tmode:'turntable', spin:1.0, tilt:0.187, wobble:1.0, roll:1.0,
  bloom:1.30, blur:15, milk:1.0, grain:.55, scan:.35, lw:1.0,
  rate:55, floor:0.55, crackle:0.5,
  spike:0.020, body:0.45, decay:1.0,
  grad:1.0, hot:0.62,
  src:'tts', vrate:1.0, vpitch:1.0,
  ttsengine:'local', ttsvoice:'',      // local = neural voice on the server
  micgain:1.6, micgate:0.020, ptt:true, micdsp:'clean',   // clean | raw
  sttmodel:'small.en', hangover:0.55,
  /* The wake WORD is not here any more, and its absence is the point: it
     belongs to a route now, because with several of them the word is what
     picks between them. What is left here is the gate's behaviour, which is
     one thing for the whole display however many routes it can reach. The
     sleep word stays shared for the same reason — there is one way out of a
     conversation regardless of which route you are in. */
  wake:'auto', wakewindow:12,                     // off | auto | always
  /* The wake word now belongs to a SPEECH PROFILE rather than to a route: an
     endpoint names a profile, and the profile says what wakes it. Kept as
     ordinary settings so a profile captures them like everything else. */
  wakeword:'resonance', wakealiases:'', wakestrict:false,
  sleepword:'goodbye', sleepaliases:'', byeontimeout:true,
  farewells:"{name} going quiet.\nStanding by.\nGoodbye.",
  greetings:"{name} here. Go ahead.\n{name} online. What do you need?\n"+
            "Yes? {name} is listening.\n{name} awake, go ahead.",
};

const PALETTES = {
  blue : {hue:'#3f7fd0', dim:'#2f6f9e', glass:'120,186,255', ink:'#01040c', hot:'#e8f6ff'},
  milk : {hue:'#9fb3c6', dim:'#8ea3b6', glass:'236,244,252', ink:'#05070b', hot:'#ffffff'},
  ice  : {hue:'#5f9fc0', dim:'#4f8ba6', glass:'169,220,242', ink:'#04080d', hot:'#e2f9ff'},
  amber: {hue:'#b08248', dim:'#a3743a', glass:'242,196,137', ink:'#0b0703', hot:'#fff0cf'},
  rust : {hue:'#b0584a', dim:'#a34a3d', glass:'242,168,150', ink:'#0b0403', hot:'#ffe0d4'},
};

/* Peak colour ramp: troughs sit at `hue`, crests run up to `hot`. Values
   are quantised to 16 steps so we build ~16 colour strings a frame rather
   than one per chunk. */
const rgbCache = {}, mixCache = {};
function toRgb(h){
  return rgbCache[h] || (rgbCache[h] = [
    parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)]);
}
function ramp(pal, t){
  const q = Math.round(Math.max(0,Math.min(1,t))*15);
  const key = pal.hue+q;
  if (mixCache[key]) return mixCache[key];
  const a = toRgb(pal.hue), b = toRgb(pal.hot), f = q/15;
  return mixCache[key] =
    'rgb('+(a[0]+(b[0]-a[0])*f|0)+','+(a[1]+(b[1]-a[1])*f|0)+','+(a[2]+(b[2]-a[2])*f|0)+')';
}

/* ------------------------------------------------------------- elements */
const cv   = document.getElementById('cv');
const ctx  = cv.getContext('2d');
const off  = document.createElement('canvas');       // geometry buffer
const octx = off.getContext('2d');
const logEl= document.getElementById('log');

/* Keep the newest line in view while a reply is being written, rather than
   jumping once at the end. Only follows when the reader is already at the
   bottom: if they have scrolled up to re-read something, yanking them back
   is worse than not following. */
let followLive = true;
function followLog(){ if (followLive) logEl.scrollTop = logEl.scrollHeight; }
logEl.addEventListener('scroll', ()=>{
  followLive = (logEl.scrollHeight - logEl.clientHeight - logEl.scrollTop) < 24;
});
const qEl  = document.getElementById('q');
const fpsEl= document.getElementById('fps');

let W=0,H=0,DPR=1;
function resize(){
  const r = cv.getBoundingClientRect();
  DPR = Math.min(window.devicePixelRatio||1, 2);
  const w = Math.max(1, Math.round(r.width  * DPR));
  const h = Math.max(1, Math.round(r.height * DPR));
  // assigning width/height clears the canvas, so only touch it on a real
  // size change — otherwise any layout jiggle blanks a frame
  if (w === W && h === H) return;
  W = w; H = h;
  cv.width=W; cv.height=H; off.width=W; off.height=H;
}
new ResizeObserver(resize).observe(document.getElementById('screen'));

/* ================================================================ DRIVE
   The single seam between "what is making noise" and "what is drawn".
   Drive.level is 0..1.  Phase 2/3 just write to it from a real analyser. */
const Drive = {
  level:0,          // smoothed energy actually used by the geometry
  target:0,         // what level is chasing
  impulse:0,        // decaying token energy
  phase:'idle',     // idle | thinking | speaking
  extLevel:null,    // phase 3: real measured level; null = internal model

  hit(weight){                       // one token arrived
    this.impulse = Math.min(1.15, this.impulse + 0.22 + weight*0.030);
    exciteBins(weight);              // and light up part of the spectrum
  },
  step(dt){
    this.impulse *= Math.pow(0.055, dt);          // fast decay, frame-rate safe
    if (this.extLevel != null)          this.target = this.extLevel;
    else if (this.phase === 'speaking') this.target = this.impulse;
    else if (this.phase === 'thinking') this.target = 0.13 + Math.sin(now*7.5)*0.045;
    else                                this.target = 0.0;
    // asymmetric slew: snap up, fall away slowly — this is what makes it
    // read as a voice rather than as a meter. Real audio needs a quicker
    // release or it smears over the gaps between words.
    const up = this.extLevel != null ? 0.55 : 0.30;
    const dn = this.extLevel != null ? 0.16 : 0.075;
    const k = this.target > this.level ? up : dn;
    this.level += (this.target - this.level) * (1 - Math.pow(1-k, dt*60));
  }
};

/* ========================================== FIELD MODEL (stationary in x)
   The earlier version was an oscilloscope: one sample pushed per frame
   into a ring buffer, every point reading further back in time. That
   makes the pattern TRANSLATE — data sweeping across a chart — which is
   exactly the behaviour we don't want.

   This model has no time axis along the line at all. Every x position is
   a fixed place that moves up and down where it stands:

     voice — standing modes. Spatial shape sin(mπu) is FIXED; only the
             amplitude oscillates in time. Nodes never move, so the form
             vibrates like a struck string rather than scrolling.
     noise — value noise evaluated at (position, time). Position is the
             lookup key, not an offset into history, so static shimmers
             in place and agitated regions bloom and fade where they are.

   Depth across the stack comes from a per-layer TEMPORAL phase offset
   (the "layer phase" control): layers rise and fall out of sync with one
   another, which ripples the sheet without any of it travelling.        */

/* ---------------------------------------------------------- voice modes */
const MODES = 10;
const mW = new Float32Array(MODES);   // temporal rate, rad/s
const mPh = new Float32Array(MODES);  // phase
const mG = new Float32Array(MODES);   // static gain — low modes carry body
const mD = new Float32Array(MODES);   // slow random gain drift
const mA = new Float32Array(MODES);   // live amplitude
for (let m=0;m<MODES;m++){
  mW[m]  = 2.1 + m*1.85 + Math.random()*1.1;
  mPh[m] = Math.random()*Math.PI*2;
  // geometric falloff, not 1/m — a high mode packs many more wiggles into
  // the same span, so a shallow rolloff lets it dominate and the form
  // reads as scribble instead of a voice with body
  mG[m]  = Math.pow(0.62, m);
}

function stepVoice(dt){
  const e = Drive.level;
  for (let m=0;m<MODES;m++){
    mD[m] += ((Math.random()*2-1) - mD[m]) * 0.06;
    // higher modes only wake up once there's real energy — consonants
    const want = e * Math.pow(e, m*0.20) * mG[m] * (0.75 + 0.35*mD[m]);
    mA[m] += (want - mA[m]) * (1 - Math.pow(0.02, dt));
  }
  stepBins(dt);
}

/* ------------------------------------------------------- formant bins
   Standing modes alone give smooth swells — an ocean, not a voice. A
   voice on a graph is SPIKES at particular places in the spectrum that
   jump and fall away.

   So: a bank of bins at fixed positions across the span. A token doesn't
   raise the whole surface, it excites a cluster of bins — a formant —
   which spikes and decays. Positions never move, so this stays in place;
   what changes is which parts of the spectrum are lit. */
const BINS = 30;
const binU = new Float32Array(BINS);   // fixed position, 0..1
const binA = new Float32Array(BINS);   // live height
const binS = new Float32Array(BINS);   // sign — spikes punch both ways
const binK = new Float32Array(BINS);   // per-bin decay
for (let j=0;j<BINS;j++){
  binU[j] = (j + 0.5)/BINS;
  binS[j] = Math.random() < 0.5 ? -1 : 1;
  binK[j] = 0.02 + Math.random()*0.16;
}

function exciteBins(weight){
  const clusters = 1 + (Math.random()*3|0);
  for (let q=0;q<clusters;q++){
    const c = Math.random()*BINS|0;
    const spread = 1 + (Math.random()*3|0);
    for (let d=-spread; d<=spread; d++){
      const j = c+d; if (j<0 || j>=BINS) continue;
      const f = 1 - Math.abs(d)/(spread+1);
      binA[j] = Math.min(2.4, binA[j] + (0.30 + weight*0.040)*f*(0.5+Math.random()));
    }
  }
}

function stepBins(dt){
  for (let j=0;j<BINS;j++) binA[j] *= Math.pow(binK[j], dt*S.decay*3);
  // thinking: sparse low flickers so the fabric isn't dead while it waits
  if (Drive.phase === 'thinking' && Math.random() < 0.10){
    binA[Math.random()*BINS|0] += 0.05 + Math.random()*0.10;
  }
}

/* Spike field, rebuilt once per frame and shared by every line — so the
   spikes line up through the depth of the fabric instead of each layer
   inventing its own. Periodic, so rings can sample it too. */
const FN = 256;
const field = new Float32Array(FN);
function buildField(){
  field.fill(0);
  const sig = Math.max(0.004, S.spike), inv = 1/(2*sig*sig);
  const reach = Math.ceil(3*sig*FN);
  for (let j=0;j<BINS;j++){
    const a = binA[j]*binS[j];
    if (Math.abs(a) < 0.002) continue;
    const c = Math.round(binU[j]*FN);
    for (let d=-reach; d<=reach; d++){
      const du = d/FN;
      field[((c+d)%FN+FN)%FN] += a * Math.exp(-du*du*inv);
    }
  }
}
const fieldAtU = u => field[((Math.round(u*FN)%FN)+FN)%FN];

/* Spatial basis tables. Rebuilt only when the point count changes, so the
   per-frame cost is one multiply-add per mode per point. */
let obN = 0, obTab = null, rbN = 0, rbTab = null;
function basisOpen(N){                       // fixed at both ends
  if (obN === N) return obTab;
  obN = N; obTab = new Float32Array(N*MODES);
  for (let i=0;i<N;i++){
    const u = i/(N-1);
    for (let m=0;m<MODES;m++) obTab[i*MODES+m] = Math.sin((m+1)*Math.PI*u);
  }
  return obTab;
}
function basisRing(N){                       // periodic — no seam
  if (rbN === N) return rbTab;
  rbN = N; rbTab = new Float32Array((N+1)*MODES);
  for (let i=0;i<=N;i++){
    const a = (i/N)*Math.PI*2;
    for (let m=0;m<MODES;m++) rbTab[i*MODES+m] = Math.cos((m+1)*a + mPh[m]);
  }
  return rbTab;
}

// per-line temporal coefficients; tOff is the layer's phase offset
const co = new Float32Array(MODES);
function lineCoef(tOff){
  for (let m=0;m<MODES;m++) co[m] = mA[m]*Math.cos(mW[m]*(now+tOff) + mPh[m]);
}
function modeSum(tab, i){
  let v = 0, b = i*MODES;
  for (let m=0;m<MODES;m++) v += tab[b+m]*co[m];
  return v;
}

/* ----------------------------------------------------- in-place noise
   Hash-based value noise keyed on (lane, position, time). Nothing is
   stored and nothing scrolls: ask for position i at time t and you get
   that point's current value. Each line has its own lane, so lines stay
   uncorrelated; each also gets a slowly moving envelope so some stretches
   are agitated while others sit almost flat.                            */
function hash3(a,b,c){
  let h = Math.imul(a,374761393) + Math.imul(b,668265263) + Math.imul(c,1274126177);
  h = Math.imul(h ^ (h>>>13), 1274126177);
  return ((h ^ (h>>>16)) >>> 0) / 2147483648 - 1;      // -1..1
}
function tn(a,b,t,rate){                     // smooth in time, rough in space
  const tt = t*rate, t0 = Math.floor(tt), f = tt-t0, s = f*f*(3-2*f);
  return hash3(a,b,t0)*(1-s) + hash3(a,b,t0+1)*s;
}
function tn2(a,x,t,rate,sc){                 // smooth in both
  const xx = x*sc, x0 = Math.floor(xx), fx = xx-x0, sx = fx*fx*(3-2*fx);
  const tt = t*rate, t0 = Math.floor(tt), ft = tt-t0, st = ft*ft*(3-2*ft);
  const v0 = hash3(a,x0,t0)*(1-sx)   + hash3(a,x0+1,t0)*sx;
  const v1 = hash3(a,x0,t0+1)*(1-sx) + hash3(a,x0+1,t0+1)*sx;
  return v0*(1-st) + v1*st;
}
function nzRaw(k,i){
  const t = now, A = Math.imul(k,1013) + 7;
  const fizz   = tn (A,   i, t, 20);                  // per-point static
  const wander = tn2(A+1, i, t, 2.0,  0.14);          // smooth undulation
  let   env    = 0.5 + 0.5*tn2(A+2, i, t, 0.45, 0.035);
  env *= env;                                         // bias toward quiet
  const laneE  = 0.30 + 0.70*(0.5 + 0.5*tn(A+3, 0, t, 0.30));
  let cr = tn(A+4, i, t, 7);                          // sparse crackle
  cr = Math.abs(cr) > 0.90 ? (cr - Math.sign(cr)*0.90)/0.10 : 0;
  return (fizz*0.90 + wander*0.50) * (0.12 + env*1.8) * laneE
       + cr * 1.1 * (0.35 + S.crackle);
}
// floor ducks under a loud voice rather than switching off
function noiseAmp(){ return S.floor * 0.115 * (1 - 0.55*Math.min(1, Drive.level)); }
function lineNoise(k,i){ return nzRaw(k,i) * noiseAmp(); }
function ringNoise(k,i,N){
  const w = i/N;                                      // crossfade seam shut
  return (nzRaw(k,i)*(1-w) + nzRaw(k,0)*w) * noiseAmp();
}

/* ============================================================== TUMBLE
   Continuous angular velocity on all three axes, re-aimed periodically —
   so it drifts most of the time and visibly reorients now and then. */
/* Axis note: internally Y is the vertical axis, so the "turntable spin"
   is rotation about Y. Controls are labelled by BEHAVIOUR (spin / tilt /
   roll) rather than by letter, because z-up and y-up conventions disagree
   and the letters were causing confusion. */
const ang = {x:0.187, y:0.55, z:0.0};
const vel = {x:0.0004, y:0.0042, z:0.0000};
const aim = {x:0.0004, y:0.0042, z:0.0000};
let tiltAim = 0.187;
let nextReorient = 6;

function reorient(){
  const r = () => (Math.random()-0.5);
  if (S.tmode === 'turntable'){
    // the platter never stops and never flips — only its rate drifts
    aim.y = 0.0014 + Math.random()*0.0020;
    aim.z = r()*0.0007;
    aim.x = 0;
    tiltAim = S.tilt * (0.72 + Math.random()*0.56);
  } else {
    const big = Math.random() < 0.55;
    aim.y = 0.0030 + r()*0.010;
    aim.x = r() * (big ? 0.016 : 0.0035);
    aim.z = r() * (big ? 0.012 : 0.0022);
  }
  nextReorient = now + S.reorient*(0.6 + Math.random()*0.8);
}

function stepTumble(dt){
  if (now > nextReorient) reorient();
  const k = 1 - Math.pow(0.986, dt*60);
  const s = S.tumble * dt * 60;

  vel.x += (aim.x - vel.x)*k;
  vel.y += (aim.y - vel.y)*k;
  vel.z += (aim.z - vel.z)*k;

  if (S.tmode === 'turntable'){
    ang.y += vel.y * s * S.spin;             // the platter
    ang.z += vel.z * s * S.roll;             // slow lean
    // hold a shallow viewing height instead of integrating — this is what
    // keeps it edge-on, a record seen from the side rather than from above
    const want = tiltAim + Math.sin(now*0.19)*0.045*S.wobble
                         + Math.sin(now*0.07+1.3)*0.030*S.wobble;
    ang.x += (want - ang.x) * (1 - Math.pow(0.992, dt*60));
  } else {
    ang.x += vel.x*s; ang.y += vel.y*s; ang.z += vel.z*s;
  }
}

/* ============================================================ GEOMETRY
   Each builder returns an array of polylines; each polyline is a flat
   array [x,y,z, x,y,z, …] in model space. */

/* Layer phase offset, in seconds. Layers vibrate out of sync with each
   other; nothing propagates along the line. */
const phaseOf = k => k * S.lag * 0.012;
/* Spikes stay at the same place in every layer but breathe out of phase
   through the depth, so they read as one ridge running through the fabric
   rather than as unrelated bumps per line. */
const layerGain = k => 0.72 + 0.28*Math.cos(5.5*(now + phaseOf(k)*2.2));

/* RIDGE — a MESH. The density is the figure, not a detail of it.

   This is a landform above its own reflection: the speech rectified so it only
   ever pushes UP from a spine, drawn again inverted below, and repeated through
   depth in rows fine enough that they stop reading as lines and start reading
   as a surface. The moire where near ridgelines cross far ones is the whole
   look — it is what makes a few hundred strokes read as fabric.

   THREE THINGS MAKE IT A SURFACE rather than a heap of curves, and it needs all
   three: the signal is ABSOLUTE, so nothing crosses the spine and the form has
   a closed silhouette; the lower half is an EXACT inversion, so it is one
   object with a symmetry instead of a field of waves; and there are FOUR ROWS
   PER LINE instead of one, so what lands is a skin. Two of the three were
   tried alone and neither was enough.

   FIXED, and the only figure here that is. The tumble is what gives DISC,
   ORB, KNOT and DNA their depth; this one is held dead side-on with a little
   elevation, so the rows recede up the frame and nothing moves but the
   speech. The angle belongs to the mode rather than to a slider, because a
   slider that can return it to dead-on is a slider that collapses every row
   onto the one in front of it — the rotation controls go inert while this is
   selected rather than pretending to act on it. */
/* DEAD SIDE-ON. `y` is zero and is meant to be: any turn about the vertical
   foreshortens the span, and this figure is supposed to run the full width of
   the screen. The depth still reads, because the elevation alone lifts each
   receding row up the frame — which is what looking along a ridge from its
   side actually looks like. Turning it even slightly, which was tried, buys
   nothing the elevation does not already give and costs the width. */
const RIDGE_VIEW = {x: 0.30, y: 0, z: 0};
/* EDGE TO EDGE, and it IGNORES SPREAD to get there — the second control this
   figure does not answer to, for the same kind of reason as the first.

   Every other form takes its width from the Spread slider, which is a width in
   MODEL space; the projection then scales by min(W,H), so on a wide monitor a
   model width that fills a square frame stops well short of the sides, and no
   setting of the slider fixes it for every window. A ribbon that is supposed
   to touch both edges cannot be specified that way. So this one asks the
   CANVAS instead: the projection multiplies by `zoom` at the mid row, so a
   span of W/zoom lands exactly on the two edges whatever the window is doing —
   including while the screensaver has scaled the whole projection down.

   The rows in front of the middle sit at negative z and come out a little
   wider than the frame. That is deliberate and is what edge to edge means: the
   near edge of the ribbon runs off the sides rather than stopping just inside
   them. */
function ridgeSpan(){
  const zoom = Math.min(W,H)/(760*DPR)*DPR*Math.max(0.01, Saver.scale);
  return W / zoom;
}
/* Points across a row, and how many rows one `Lines` buys. The mesh needs
   rows far more than it needs resolution along one: 64 rows of 150 points read
   as a surface where 16 rows of 600 read as sixteen curves. Capped, because
   the cost is rows x 2 x points and the slider goes to forty. */
const RIDGE_N = 150, RIDGE_PER_LINE = 4, RIDGE_ROWS_MAX = 160;

function buildRidge(){
  const N = RIDGE_N;
  const rows = Math.min(RIDGE_ROWS_MAX, Math.max(8, (S.lines|0) * RIDGE_PER_LINE));
  const span = ridgeSpan();
  const tab = basisOpen(N);
  const out = [];
  for (let k=0;k<rows;k++){
    const kt = rows>1 ? k/(rows-1) : 0;
    const z  = (kt-0.5) * S.depth;
    /* Front rows loudest, the far ones sitting down into the haze. With
       nothing rotating this and the perspective divide are the only depth cues
       there are. */
    const fade = 1 - kt*0.42;
    /* A row's own moment, and THE SPREAD IS FIXED rather than per-row. The
       shared `phaseOf` multiplies by the row index, which suits a handful of
       curves and is wrong for a hundred: at four rows to the line it put
       seconds between the front of the mesh and the back, every row disagreed
       with its neighbour, and the result was a tangle instead of a skin. Held
       to a third of a second across the whole depth, consecutive rows very
       nearly agree — which is what a surface is — and the slight disagreement
       is what ridges it. */
    lineCoef(kt * S.lag * 0.085);
    const gain = layerGain(Math.round(kt * 8));
    const up = new Float32Array(N*3), ua = new Float32Array(N);
    const dn = new Float32Array(N*3), da = new Float32Array(N);
    for (let i=0;i<N;i++){
      const it = i/(N-1);
      /* The silhouette. sin pinches both ends; the power sharpens the pinch so
         the taper happens near the tips instead of eating the middle, and the
         constant keeps a thin spine running the whole width so the form comes
         to a line at each end rather than stopping in mid-air. */
      const env = Math.pow(Math.sin(Math.PI*it), 0.9);
      const spindle = env*0.93 + 0.07;
      const body  = modeSum(tab,i)*S.body*fade;
      const live  = fieldAtU(it)*gain;
      const grain = lineNoise(k,i);
      /* ABSOLUTE, and this is what closes the silhouette. A signed value would
         swing through the spine, the two halves would cross, and the whole
         thing would be a wave field again. */
      const h = Math.abs(body + live) * spindle + Math.abs(grain)*env*0.6;
      const x = (it-0.5) * span;
      /* Modest, because this draws BOTH halves: a taller figure at the same
         amp would be a lens standing on its end, and what this wants is a long
         low ribbon. `amp` still scales it — this only sets where the slider's
         middle lands. */
      const y = h * 105 * S.amp;
      up[i*3  ] = x;  up[i*3+1] = -y;  up[i*3+2] = z;  ua[i] = h;
      /* Exact. Shortening the reflection or smoothing it — both were tried —
         reads as one graph with two unequal halves. Mirrored properly it reads
         as a single object sitting on a surface. */
      dn[i*3  ] = x;  dn[i*3+1] =  y;  dn[i*3+2] = z;  da[i] = h;
    }
    out.push({p:up, a:ua});
    out.push({p:dn, a:da});
  }
  return out;
}

function buildOrb(){
  const rings = Math.max(3, S.lines), N = 96, R = S.spread*0.30;
  const tab = basisRing(N);
  const out = [];
  for (let k=0;k<rings;k++){
    const lat = (-0.5 + (k+0.5)/rings) * Math.PI;   // -pi/2 .. pi/2
    const cy  = Math.sin(lat)*R, rr = Math.cos(lat)*R;
    lineCoef(phaseOf(k));
    const gain = layerGain(k);
    const pts = new Float32Array((N+1)*3), amp = new Float32Array(N+1);
    for (let i=0;i<=N;i++){
      const a = (i/N)*Math.PI*2;
      const s = modeSum(tab,i)*S.body + fieldAtU(i/N)*gain;
      const v = s*Math.cos(lat) + ringNoise(k,i,N);
      const r = rr + v * 60 * S.amp;
      pts[i*3  ] = Math.cos(a)*r;
      pts[i*3+1] = cy + s*10*S.amp;
      pts[i*3+2] = Math.sin(a)*r * (S.depth/230);
      amp[i] = v;
    }
    out.push({p:pts, a:amp});
  }
  return out;
}

/* DISC — concentric rings lying flat in the horizontal plane, displaced
   vertically by the signal. Kept a true circle (no depth scaling) so the
   viewing tilt alone flattens it into an ellipse: a record on a turntable,
   seen from the side. */
function buildDisc(){
  const rings = Math.max(2, S.lines), N = 132, R = S.spread*0.44;
  const tab = basisRing(N);
  const out = [];
  for (let k=0;k<rings;k++){
    const rt = (k+1)/rings;
    const rr = R*rt;
    const lift = (rt-0.5) * S.depth * 0.10;        // very shallow cone
    lineCoef(phaseOf(k));
    const gain = layerGain(k);
    const pts = new Float32Array((N+1)*3), amp = new Float32Array(N+1);
    for (let i=0;i<=N;i++){
      const a = (i/N)*Math.PI*2;
      const s = modeSum(tab,i)*S.body + fieldAtU(i/N)*gain;
      const v = s*(0.35 + 0.65*rt) + ringNoise(k,i,N);
      pts[i*3  ] = Math.cos(a)*rr;
      pts[i*3+1] = lift - v * 100 * S.amp;
      pts[i*3+2] = Math.sin(a)*rr;
      amp[i] = v;
    }
    out.push({p:pts, a:amp});
  }
  return out;
}

/* DNA — BALL AND STICK, with the balls actually solid.

   The chain of spheres IS the backbone; none is drawn. Earlier passes drew one
   as a line and then as a two-railed ribbon, and both read as wire in a
   spiral, because a continuous stroke down the strand is the one thing that
   makes this look like a coil rather than a molecule.

   A BALL IS A CAMERA-FACING SPIRAL, and this is the part that stops it looking
   like a schoolbook diagram. Three wireframe rings say "ball" and look like
   wire saying it. A spiral wound from the centre out, at a stroke weight wider
   than the gap between its turns, FILLS — so what lands on the canvas is a
   disc, not an outline. Its amplitude falls from the middle to the rim, and
   since a chunk takes its peak, the inner chunk comes out brightest: a core
   with a falloff, which is the whole of what makes a flat disc read as a
   sphere.

   Square to the viewer, always. A disc drawn in any fixed plane collapses to a
   line when the tumble turns edge-on to it. `dnaFacing` reads back the two
   model-space directions that map to screen right and screen up — the rotation
   is orthonormal, so those are simply two rows of it — and the ball is built
   in that plane. It cannot be seen edge-on because there is no edge to find.

   RODS HAVE WIDTH for the same reason: one stroke is a hairline whatever it is
   joining. Three, offset perpendicular to the rod IN SCREEN SPACE, read as a
   cylinder. Screen space rather than model space matters — offsetting along a
   fixed axis makes the rod thin out and vanish whenever it happens to point
   that way.

   THE GROOVE IS WHAT MAKES IT DNA. Two strands half a turn apart make a
   twisted ladder: symmetric, evenly spaced, a spring. Real B-DNA puts them
   about a third of a turn apart, opening a WIDE gap on one side and a NARROW
   one on the other — the major and minor grooves. That alternation is what the
   eye recognises.

   PITCH BEATS DIAMETER. A helix fatter than the distance it advances per turn
   is a coil spring whatever else is done to it. This advances about one and a
   half diameters per turn, roughly what B-DNA does.

   IT IGNORES DEPTH, deliberately, and it is the only figure that does. Scaling
   z would make the cross-section an ellipse, and a helix with an elliptical
   cross-section is a flattened coil that changes shape as it turns.

   WHAT THE VOICE DOES. The local level swells the radius at that point along
   the axis, so a loud passage fattens the stretch it lands on rather than the
   whole strand — small and clamped, because the twist is what makes this
   legible. It also lights the bases: a base is never dark, but how far up the
   ramp it climbs is the sound.

   THE COLOURS ARE THE BASES. Four, in fixed rotation, each at a different point
   on the palette ramp, and a pair is always COMPLEMENTARY — the sphere at one
   end of a rod is never the same colour as the one at the other. The rods are
   held low on the ramp: dim is what a stick is, and it keeps every bright
   thing on screen a base. */
const DNA_N = 360;              // resolution of the underlying helix path
const DNA_TURNS = 4;            // full twists across the span
const DNA_R = 0.085;            // helix radius as a fraction of the span
/* How far round the second strand sits, in turns. A third, not a half. */
const DNA_GROOVE = 0.36;
/* How far the level may fatten the helix. Small on purpose — see above. */
const DNA_SWELL = 0.38;
const DNA_PAIRS = [0.34, 0.58, 0.8, 1.0];
/* Ball radius as a fraction of the helix radius. Balls that touch their
   neighbours stop being a chain of beads and become one lumpy tube. */
const DNA_BALL = 0.24;
/* Turns in the fill spiral and points along it. The turn count is what decides
   whether it fills: too few and it is a spiral, too many and it is wasted
   strokes on a ball nine pixels across. */
const DNA_BALL_TURNS = 5, DNA_BALL_N = 46;
/* Half the rod's width, as a fraction of the ball radius. */
const DNA_ROD_W = 0.30;
/* Where a rod stops short of the axis, so the two of a pair nearly meet
   instead of crossing through each other. */
const DNA_ROD_END = 0.94;

/* The two model-space directions that come out as screen right and screen up.
   The projection is a product of rotations and therefore orthonormal, so these
   are two of its rows — no inverse to compute. Valid for this frame only:
   setAngles() runs immediately before the builders. */
function dnaFacing(){
  return {ux: cy_*cz_, uy: sx_*sy_*cz_ - cx_*sz_, uz: cx_*sy_*cz_ + sx_*sz_,
          vx: cy_*sz_, vy: sx_*sy_*sz_ + cx_*cz_, vz: cx_*sy_*sz_ - sx_*cz_};
}

/* A filled disc square to the viewer: one polyline, wound out from the middle,
   brightest at the core. */
function dnaBall(out, cx, cy, cz, r, amp, F){
  const n = DNA_BALL_N;
  const pts = new Float32Array(n*3), a = new Float32Array(n);
  for (let i=0;i<n;i++){
    const t  = i/(n-1);
    const th = t*DNA_BALL_TURNS*Math.PI*2, rr = t*r;
    const c  = Math.cos(th)*rr, s = Math.sin(th)*rr;
    pts[i*3  ] = cx + F.ux*c + F.vx*s;
    pts[i*3+1] = cy + F.uy*c + F.vy*s;
    pts[i*3+2] = cz + F.uz*c + F.vz*s;
    a[i] = amp * (1 - 0.45*t);
  }
  out.push({p:pts, a:a});
}

function buildDna(){
  const N = DNA_N;
  const R = S.spread*DNA_R;
  const bases = Math.min(72, Math.max(16, Math.round((S.lines|0) * 1.5)));
  const tab = basisOpen(N);
  const out = [];
  const F = dnaFacing();
  lineCoef(0);
  const gain = layerGain(0);

  const at = (u, half)=>{
    const i = Math.min(N-1, Math.max(0, Math.round(u*(N-1))));
    const s = modeSum(tab,i)*S.body + fieldAtU(u)*gain;
    const v = Math.abs(s + lineNoise(half ? 1 : 0, i)*0.5);
    const ang = (u*DNA_TURNS + (half ? DNA_GROOVE : 0))*Math.PI*2 + now*0.5;
    const rr  = R * (1 + Math.min(1.2, v) * DNA_SWELL * S.amp);
    return {x: (u-0.5)*S.spread, y: Math.cos(ang)*rr, z: Math.sin(ang)*rr, v};
  };

  const br = R*DNA_BALL, w = br*DNA_ROD_W;
  for (let j=0;j<bases;j++){
    const u = (j+0.5)/bases;
    const lit = 0.45 + 0.55*Math.min(1, at(u,0).v * 1.5);
    for (let h=0;h<2;h++){
      const p = at(u, h);
      const ix = p.x, iy = p.y*(1-DNA_ROD_END), iz = p.z*(1-DNA_ROD_END);
      /* Perpendicular to the rod IN SCREEN SPACE, so the width never
         collapses whichever way the rod happens to be pointing. */
      const ex = p.x-ix, ey = p.y-iy, ez = p.z-iz;
      const sx = ex*F.ux + ey*F.uy + ez*F.uz;
      const sy = ex*F.vx + ey*F.vy + ez*F.vz;
      const L  = Math.hypot(sx, sy) || 1;
      const qx = -sy/L, qy = sx/L;
      const ox = F.ux*qx + F.vx*qy, oy = F.uy*qx + F.vy*qy, oz = F.uz*qx + F.vz*qy;
      for (const d of [-w, 0, w]){
        out.push({p: new Float32Array([p.x+ox*d, p.y+oy*d, p.z+oz*d,
                                       ix +ox*d, iy +oy*d, iz +oz*d]),
                  a: new Float32Array([0.15, 0.15])});
      }
      /* Complementary: the two ends of one rod are never the same base. The
         ball last, so it is stroked over the stick it sits on. */
      dnaBall(out, p.x, p.y, p.z, br, DNA_PAIRS[(j & 3) ^ h] * lit, F);
    }
  }
  return out;
}

function buildKnot(){
  const strands = Math.max(1, Math.round(S.lines/3)), N = 340;
  const R = S.spread*0.22, out = [];
  const tab = basisRing(N);
  for (let k=0;k<strands;k++){
    const off = k*0.13;
    lineCoef(phaseOf(k));
    const gain = layerGain(k);
    const pts = new Float32Array(N*3), amp = new Float32Array(N);
    for (let i=0;i<N;i++){
      const t = (i/N)*Math.PI*2;
      const s = modeSum(tab,i)*S.body + fieldAtU(i/N)*gain;
      const v = s + ringNoise(k,i,N);
      const w = 1 + v * 0.55 * S.amp;
      const rr = (2 + Math.cos(3*t + off)) * R * 0.5 * w;
      pts[i*3  ] = Math.cos(2*t + off) * rr;
      pts[i*3+1] = Math.sin(2*t + off) * rr;
      pts[i*3+2] = Math.sin(3*t + off) * R * (S.depth/230) * w;
      amp[i] = v;
    }
    out.push({p:pts, a:amp});
  }
  return out;
}

const BUILDERS = {ridge: buildRidge, disc: buildDisc, orb: buildOrb,
                  knot: buildKnot, dna: buildDna};

/* ========================================================== PROJECTION */
let cx_=1,sx_=0,cy_=1,sy_=0,cz_=1,sz_=0;
function setAngles(){
  /* RIDGE reads its own locked view instead of the tumble. The tumble goes on
     integrating underneath while it is selected, so switching back to a form
     that turns resumes where it was rather than snapping to a cold start. */
  const a = S.mode === 'ridge' ? RIDGE_VIEW : ang;
  cx_=Math.cos(a.x); sx_=Math.sin(a.x);
  cy_=Math.cos(a.y); sy_=Math.sin(a.y);
  cz_=Math.cos(a.z); sz_=Math.sin(a.z);
}
const P = {x:0,y:0,z:0};
function rot(x,y,z){
  const y1 =  y*cx_ - z*sx_,  z1 =  y*sx_ + z*cx_;
  const x2 =  x*cy_ + z1*sy_, z2 = -x*sy_ + z1*cy_;
  P.x = x2*cz_ - y1*sz_;
  P.y = x2*sz_ + y1*cz_;
  P.z = z2;
}

/* ============================================================== RENDER
   Polylines are cut into chunks, each chunk sorted by depth and stroked
   once. ~100–200 strokes/frame instead of thousands of segments, but you
   still get real occlusion cueing where lines cross. */
const CHUNK = 16;
const chunks = [];

function render(){
  setAngles();
  buildField();
  /* Named rather than chained, and RIDGE rather than the last one for
     anything unrecognised: the chain's final `else` silently drew whatever
     happened to sit at the end of it, so a settings file naming a figure that
     had been removed showed a KNOT and looked like a bug in KNOT. */
  const build = BUILDERS[S.mode] || buildRidge;
  const polys = build();

  /* The screensaver moves the whole projection rather than the canvas: the
     figure is built in the same place it always was, and only where it lands
     changes. Doing it with a canvas transform instead would scale the line
     WEIGHTS as well, and a screensaver that also thins the strokes is a
     second appearance setting nobody asked for. */
  const cx = W/2 + Saver.dx*W, cy = H/2 + Saver.dy*H, f = S.persp*DPR;
  const zoom = Math.min(W,H) / (760*DPR) * DPR * Saver.scale;

  chunks.length = 0;
  for (const poly of polys){
    const pts = poly.p, amp = poly.a;
    const n = pts.length/3;
    let seg=null, segZ=0, segA=0, segN=0;
    for (let i=0;i<n;i++){
      rot(pts[i*3], pts[i*3+1], pts[i*3+2]);
      const sc = f/(f + P.z*zoom);
      if (sc <= 0.02) { seg=null; continue; }
      if (!seg){ seg=[]; segZ=0; segA=0; segN=0; chunks.push({p:seg, z:0, a:0}); }
      seg.push(cx + P.x*sc*zoom, cy + P.y*sc*zoom);
      segZ += P.z; segN++;
      // depth averages, but heat takes the chunk's PEAK — averaging would
      // dilute a sharp spike across its whole chunk and wash the colour out
      const av = Math.abs(amp[i]); if (av > segA) segA = av;
      const cur = chunks[chunks.length-1];
      cur.z = segZ/segN; cur.a = segA;
      if (seg.length/2 >= CHUNK && i < n-1){
        const carry = [seg[seg.length-2], seg[seg.length-1]];
        seg = carry.slice(); segZ = P.z; segA = av; segN = 1;
        chunks.push({p:seg, z:P.z, a:segA});
      }
    }
  }
  chunks.sort((a,b)=> b.z - a.z);              // painter: far first

  /* --- geometry buffer --- */
  octx.clearRect(0,0,W,H);
  octx.lineCap='round'; octx.lineJoin='round';
  const pal = PALETTES[S.palette];
  const halfD = Math.max(60, S.depth);
  for (const c of chunks){
    const p = c.p; if (p.length < 4) continue;
    const d = Math.max(-1, Math.min(1, c.z/halfD));      // -1 near .. 1 far
    const a = 0.92 - (d+1)*0.34;                          // near = brighter
    const w = (1.55 - (d+1)*0.42) * S.lw * DPR;
    // crest heat: troughs stay in the base hue, peaks run up toward `hot`
    // and pick up extra alpha and weight so they read as energy, not just
    // a different colour
    let g = c.a / Math.max(0.05, S.hot);
    g = Math.min(1, g); g = g*g*(3-2*g) * S.grad;
    octx.globalAlpha = Math.min(1, Math.max(0.05, a) * (1 + 0.55*g));
    octx.lineWidth   = Math.max(0.35*DPR, w * (1 + 0.5*g));
    octx.strokeStyle = ramp(pal, g);
    octx.beginPath();
    octx.moveTo(p[0],p[1]);
    for (let i=2;i<p.length;i+=2) octx.lineTo(p[i],p[i+1]);
    octx.stroke();
  }
  octx.globalAlpha = 1;

  /* --- composite: bloom, then sharp, then milk --- */
  ctx.globalCompositeOperation='source-over';
  ctx.fillStyle = pal.ink; ctx.fillRect(0,0,W,H);

  if (S.bloom > 0.01 && S.blur > 0){
    ctx.save();
    ctx.filter = 'blur('+(S.blur*DPR)+'px)';
    ctx.globalAlpha = Math.min(1, S.bloom*0.85);
    ctx.globalCompositeOperation = 'lighter';
    ctx.drawImage(off,0,0);
    ctx.restore();
  }
  ctx.globalCompositeOperation='lighter';
  ctx.globalAlpha = 0.92;
  ctx.drawImage(off,0,0);

  /* milk — the opaque-screen wash that sells it as glass, not vector art.
     It travels with the figure, and has to: a lit patch that stayed where it
     was would be the one stationary bright region left on the panel, which is
     the exact thing the drift exists to prevent. */
  if (S.milk > 0.01){
    const mx = W*0.5 + Saver.dx*W, my = H*0.45 + Saver.dy*H;
    const g = ctx.createRadialGradient(mx,my,0, mx,my, Math.max(W,H)*0.62*Saver.scale);
    g.addColorStop(0,   'rgba('+pal.glass+','+(0.052*S.milk)+')');
    g.addColorStop(0.5, 'rgba('+pal.glass+','+(0.020*S.milk)+')');
    g.addColorStop(1,   'rgba('+pal.glass+',0)');
    ctx.globalCompositeOperation='lighter';
    ctx.globalAlpha=1; ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  }

  /* grain */
  if (S.grain > 0.01 && grainPat){
    ctx.globalCompositeOperation='overlay';
    ctx.globalAlpha = 0.10*S.grain;
    ctx.save();
    ctx.translate((Math.random()*256|0)-256, (Math.random()*256|0)-256);
    ctx.fillStyle = grainPat; ctx.fillRect(0,0,W+256,H+256);
    ctx.restore();
  }
  ctx.globalAlpha=1; ctx.globalCompositeOperation='source-over';

  /* --- what to say to it, while it drifts ---
     The DOM copy is hidden for the duration, because a line of text holding
     still on a screen whose whole purpose at that moment is that nothing
     holds still would be the one thing left to burn in. Painted here instead
     it travels with the figure and fades with the ease, and it is drawn
     BEFORE the dim so it darkens with everything else.

     It rides under the figure at a fixed fraction of the frame rather than
     under its measured extent: the geometry breathes with the voice, and a
     line that moved every time somebody spoke in the next room would be
     restless in a way a hallway does not want. */
  if (PROMPT && Saver.amount > 0.01){
    const short = Math.min(W, H);
    ctx.save();
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 0.40 * Saver.amount;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = Math.round(Math.max(12*DPR, short*0.030*Saver.scale)) + 'px '
             + getComputedStyle(document.body).fontFamily;
    ctx.fillStyle = 'rgb(' + pal.glass + ')';
    ctx.fillText(PROMPT, cx, cy + short * 0.19 * Saver.scale);
    ctx.restore();
  }

  /* --- and the lost server, the same way ---
     For the same reason and with more of it: an outage lasts hours, where the
     invitation is only ever up while nobody is talking. A stationary red line
     held for a night on the one screen whose entire purpose at that moment is
     that nothing stays still would burn in exactly the shape of a complaint
     about a router. Above the figure rather than below it, so the two never
     land on each other. */
  if (OFFLINE && Saver.amount > 0.01){
    const short = Math.min(W, H);
    ctx.save();
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 0.45 * Saver.amount;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = Math.round(Math.max(11*DPR, short*0.024*Saver.scale)) + 'px '
             + getComputedStyle(document.body).fontFamily;
    ctx.fillStyle = '#e0716b';
    ctx.fillText(OFFLINE, cx, cy - short * 0.22 * Saver.scale);
    ctx.restore();
  }

  /* …and the dim, last, over everything including the grain. Black rather
     than the palette's own ink: it is the panel's light output that burns and
     that a hallway at two in the morning is too bright with, and blending
     toward a pale ink would raise both. */
  if (Saver.dim > 0.002){
    ctx.globalAlpha = Saver.dim;
    ctx.fillStyle = '#000';
    ctx.fillRect(0,0,W,H);
    ctx.globalAlpha = 1;
  }
}

/* grain tile */
let grainPat = null;
(function makeGrain(){
  const g = document.createElement('canvas'); g.width=g.height=256;
  const c = g.getContext('2d'), d = c.createImageData(256,256);
  for (let i=0;i<d.data.length;i+=4){
    const v = 90 + (Math.random()*76|0);
    d.data[i]=d.data[i+1]=d.data[i+2]=v; d.data[i+3]=255;
  }
  c.putImageData(d,0,0);
  grainPat = ctx.createPattern(g,'repeat');
})();

/* =========================================================== SCREENSAVER
   A tablet showing a mostly-stationary field for years will burn it into the
   panel. The usual answer replaces the screen with something else; this one
   keeps the same face — every appearance setting still applied — and moves
   it. The screensaver is still the product.

   SCALE DOWN, THEN DRIFT, rather than drift alone. Drawn full-bleed there is
   nowhere to go and translating only clips the edges; shrinking first creates
   the margin to move within, and lights fewer pixels while it is at it. The
   travel is exactly the margin the shrink bought, so nothing is ever cut off.

   SLOW CONTINUOUS DRIFT rather than a bouncing path. Two sines at rates that
   do not divide into each other trace a figure that covers more of the panel
   over a night than a rectangle bouncing between four corners, and it is
   calmer to share a room with. The clock behind them never resets, so two
   nights running do not light the same pixels in the same order.

   A DIM LEVEL BESIDE IT, as its own number, because reducing brightness does
   more against burn-in than movement does — and it is independently what a
   hallway screen should do at two in the morning. Painted as black over the
   finished frame rather than by scaling the palette: it is the panel's output
   that burns, so what has to fall is absolute light, on a light palette as
   much as a dark one.

   IT ENDS ON THE WAKE WORD OR ON TOUCH. On a voice-only display touch is the
   only signal that is not speech, so it has to count. The chrome comes back
   at once — somebody just asked for it — and only the geometry eases, back to
   the centre rather than snapping. */
const Saver = {
  /* From the display's row. delay 0 is off, and off is the default. */
  delay: 0, scaleTo: 0.70, dimTo: 0.45,
  /* …and the dark hours, which are a separate thing from the idle dim and
     not a variant of it. Idle asks "has anybody been here recently"; this
     asks "what time is it", and only the second one keeps a hallway dark
     after somebody walks past it at three in the morning. */
  nightFrom: 0, nightTo: 0, nightDimTo: 0, nightAt: 0,
  armed: false,           // may it ever start
  on: false,              // is it drifting now, or easing out of it
  forced: false,          // the panel is demonstrating it
  idle: 0,                // seconds since anybody did anything
  t: 0,                   // drift clock, never reset — see above
  p: 0,                   // raw ease progress 0..1

  /* What render() reads, and the whole of what this object publishes.
     amount 0 is the ordinary page; dx/dy are fractions of the frame. */
  scale: 1, dx: 0, dy: 0, dim: 0, amount: 0,

  /* Seconds to ease in, and to ease back out. Not the same number: arriving
     has to be slow enough that nobody catches it starting, and leaving has to
     be quick enough that somebody who just touched the screen believes it
     answered them. */
  IN: 6, OUT: 0.45,

  configure(s){
    s = s || {};
    this.delay   = Math.max(0, s.delay | 0);
    this.scaleTo = Math.min(0.95, Math.max(0.2, (s.scale | 0) / 100 || 0.70));
    this.dimTo   = Math.min(0.95, Math.max(0, (s.dim | 0) / 100));
    /* The dark hours, and the dim that runs through them. Equal is no window.
       Read off the DEVICE's clock and not the server's, deliberately: this is
       "dark at two in the morning where the screen is", and a building with
       screens in two time zones wants each of them dark at its own two. */
    this.nightFrom = Math.min(23, Math.max(0, s.night_from | 0));
    this.nightTo   = Math.min(23, Math.max(0, s.night_to | 0));
    this.nightDimTo = Math.min(0.95, Math.max(0, (s.night_dim | 0) / 100));
    /* Never in an embed. A surface inside somebody else's product that
       shrank and dimmed itself after three minutes would be a bug in their
       application, and they have their own screensaver. */
    this.armed = !EMBED && this.delay > 0;
    this.idle = 0;
    if (!this.armed) this.on = false;
  },

  /* Somebody is there. Called from the wake word, from the conversation
     continuing, and from any touch, key or pointer. */
  poke(){
    this.idle = 0;
    this.forced = false;
    this.on = false;
  },

  /* The panel, showing an admin what these numbers do without making them
     stand and wait out the idle delay. */
  demo(on){ this.forced = !!on; if (!on) this.poke(); },

  /* Is it dark hours right now, and how dark. Equal endpoints are no window;
     a `from` later than a `to` wraps midnight, which is the ordinary case
     rather than the exception — 22 to 07 is what somebody means, and 07 to 22
     is what they would have to type otherwise. */
  nightNow(){
    if (!this.nightDimTo || this.nightFrom === this.nightTo) return 0;
    const h = new Date().getHours();
    const inside = this.nightFrom < this.nightTo
      ? (h >= this.nightFrom && h < this.nightTo)
      : (h >= this.nightFrom || h < this.nightTo);
    return inside ? this.nightDimTo : 0;
  },

  step(dt){
    this.t += dt;
    if (this.forced) this.on = true;
    else if (!this.armed) this.on = false;
    else if (!this.on){
      /* A CONVERSATION THAT IS HAPPENING, asked of the things that are doing
         it rather than of a flag that says so.

         It read `Drive.phase !== 'idle'`, and that is a DISPLAY flag: it says
         what the figure should be drawing, it is set from six places, and any
         one of them that returns early leaves it set. A screen whose phase was
         left on `speaking` never reached its screensaver again — no
         conversation, nothing on screen to show it, and no way to tell from
         looking. That is the shape of the fault reported on 2026-08-20 with
         the microphone open, and it is why this no longer asks a flag.

         WHAT IT ASKS INSTEAD is the two things that actually speak, and the
         count of questions outstanding. A display with no wake word at all
         still thinks and still speaks, and all three of these are true on that
         path — which is the property the Drive test was chosen for and keeps.

         `Listen.busy` IS DELIBERATELY NOT HERE, and it is the trap this walked
         into once already: a listening screen transcribes every noise in the
         room, so it flickers true all day for utterances nobody addressed to
         anything — and one frame of it resets the whole clock. A microphone
         hearing a room is the definition of the case that must still reach
         the screensaver.

         The wake window is checked as well as the flag, so a screen left
         `awake` by anything that failed to clear it ages out on the window
         instead of holding the saver open for ever — the same failure one
         level up. */
      const talking = (typeof Speech !== 'undefined' && Speech.active)
                   || (typeof Play !== 'undefined' && Play.playing);
      const asked = typeof Wake !== 'undefined' && Wake.pending > 0;
      const engaged = typeof Wake !== 'undefined' && Wake.armed() && Wake.awake
                   && wallNow() < Wake.until;
      /* Between two sentences of a conversation nothing is speaking for a few
         seconds, and a screen somebody is standing in front of talking to must
         not start dimming at them — which is what the wake window is for. */
      const busy = talking || asked || engaged;
      if (!busy) this.idle += dt; else this.idle = 0;
      if (this.idle >= this.delay) this.on = true;
    }
    this.p = Math.min(1, Math.max(0, this.p + dt / (this.on ? this.IN : -this.OUT)));
    // smoothstep, so it leaves and arrives at zero velocity in both
    // directions — an ease that starts abruptly reads as a fault
    this.amount = this.p * this.p * (3 - 2 * this.p);
    this.scale = 1 + (this.scaleTo - 1) * this.amount;
    /* The margin the shrink just bought, each side, as a fraction of the
       frame. It collapses to nothing as the ease runs out, which is what
       carries the figure back to the centre without a second animation. */
    const m = (1 - this.scale) / 2;
    this.dx = Math.sin(this.t * 0.0314) * m;
    this.dy = Math.sin(this.t * 0.0193 + 1.7) * m;
    /* The dark hours, eased over about eight seconds rather than switched.
       It happens once a night with nobody watching, so the ease is not for
       drama — it is so that a screen somebody IS standing in front of at ten
       o'clock does not appear to fault. */
    this.nightAt += (this.nightNow() - this.nightAt)
                    * (1 - Math.pow(0.05, dt / 8));
    /* The greater of the two, never the sum: they are both "how much light
       comes off this panel", and two answers to one question resolve to the
       darker rather than to something past black. */
    this.dim = Math.max(this.dimTo * this.amount, this.nightAt);
    /* Text sliding around a screen is worse than either state on its own, so
       the transcript, the composer and the status line go while it drifts.
       Keyed on `on` rather than on `amount`: chrome asked for should come
       back the instant it is asked for, and only the geometry eases. */
    document.body.toggleAttribute('data-saver', this.on);
  },
};

/* ======================================================= RESTING PROMPT
   A screen on a wall is walked past by people who have never used it. It
   shows a figure, it is silent, and nothing about it says that it listens —
   and on a voice-only display there is no transcript and no composer to
   suggest otherwise. So it says what to say.

   Only on a wall. A browser tab was opened deliberately by somebody who
   already knows what this is, and a permanent instruction in their window
   would be furniture.

   Only while nobody is talking to it. Mid-conversation the transcript, the
   status line and the reply are all saying more than this could, and a prompt
   telling somebody to say a name they have just said is noise.

   It exists in two forms and they are the same sentence: DOM while the screen
   is at rest, and painted onto the canvas while the screensaver drifts, where
   it moves and dims with the figure. Neither is a stationary bright line
   left on a panel for a year. */
const promptEl = $('prompt');
let PROMPT = '';

/* The other line render() draws for itself while the screensaver has the
   screen. Declared beside the invitation because they are the same mechanism
   — a string the canvas reads, with a DOM copy that stands down for the
   duration — and set by the watchdog at the foot of this file. */
let OFFLINE = '';
function paintPrompt(){
  const names = (typeof Routes !== 'undefined' && Routes.spoken) ? Routes.spoken() : '';
  /* Awake means a conversation is happening, and a display with no wake gate
     at all is one where "say the name" would be a lie — anything said to it
     is heard, so there is no name to offer. */
  const gated = typeof Wake !== 'undefined' && Wake.armed && Wake.armed();
  /* The admin's words where there are any, and the automatic line where
     there are none. Empty is not "say nothing": it is "work it out", and the
     browser is the only thing that knows which wake words this screen is
     currently answering to — so a renamed wake word keeps the line true
     without anybody editing a profile.

     A typed line does NOT need a wake word to exist, because it is not making
     a claim about one. The generated one does, and says so by not appearing. */
  const custom = (Kiosk.promptText || '').trim();
  PROMPT = (Kiosk.on && Kiosk.prompt && !(Wake.awake))
    ? (custom || (names && gated ? 'say ' + names : ''))
    : '';
  if (promptEl) promptEl.textContent = PROMPT;
  document.body.toggleAttribute('data-prompt', !!PROMPT);
}

/* ========================================================== FULL SCREEN
   A tablet on a wall showing an address bar, a tab strip and somebody's
   bookmarks is a browser that happens to be running a display. The chrome is
   not ours to remove — no page can take it — but a page CAN ask to be shown
   full screen, and a browser will grant that off a gesture.

   ONLY ON A WALL. A tab somebody opened is theirs, and a page that went full
   screen the moment it was clicked would be a page nobody opens twice. Never
   in an embed either: taking over somebody else's viewport from inside their
   iframe is the single rudest thing a guest can do.

   ON A GESTURE, because there is no other way. Browsers require user
   activation for this and are right to, so it happens on the first touch —
   which on a screen being commissioned is somebody's first touch anyway.

   AND IT DOES NOT FIGHT. Leaving full screen is nearly always the person
