<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Resonance — voice and visual interface</title>
<link rel="icon" type="image/svg+xml" href="icon.svg">
<style>
  :root{
    /* Tell the browser this is a dark document. Without it Firefox draws its
       own furniture — scrollbars above all — in LIGHT colours over a black
       page, which is most of why the bar looked like somebody else's. */
    color-scheme: dark;
    /* palette is swapped at runtime by setPalette() — but ONLY the canvas
       channel. --paper is fixed neutral white and is what all text uses, so
       the transcript stays legible no matter how dark the geometry hue goes
       (the blue was pulled down deliberately to give the peak ramp somewhere
       to travel, which dragged every label down with it). */
    --ink:#05060a;
    --hue:#dfe9f2;
    --hue-dim:#7d93a8;
    --glass:255,255,255;
    --paper:238,244,250;
    --text:#f2f6fa;
    --ui:#c3cedb;
    --ui-bright:#dfe9f2;
    /* the only warm colour in the palette, and it appears in exactly one
       place: the amber the admin panel already uses for "this is not what
       you think it is" */
    --warn:#e8b04a;

    /* ---- typography, set from the shared settings ----
       Three faces and three sizes, and no more. Every one of them is
       already on the machine: a webfont would be the first runtime
       dependency this project has ever taken, and it would be taken for
       something a stack of installed faces does perfectly well.

       The scale is deliberately shallow. This is a dense layout measured in
       pixels, and a size control wide enough to be interesting is a size
       control wide enough to push a label through the side of its button. */
    --fs:1;
    --face-mono: ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --face-sans: ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,
                 "Helvetica Neue",Arial,sans-serif;
    /* Wide, open apertures and a tall x-height — drawn for screens, and the
       easiest of the three to read as light text on a black ground, where a
       tight face fills its own counters in with glare. */
    --face-wide: Verdana,"DejaVu Sans",Tahoma,Geneva,Arial,sans-serif;
    --face: var(--face-mono);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--ink);
    color:var(--ui);
    /* Split out of the `font:` shorthand so the family and the scale can be
       set independently from the shared settings. Every font-size on this
       page is a multiple of --fs, so one number moves all of them together
       and nothing can drift out of proportion with the rest. */
    font-family:var(--face);
    font-size:calc(13px * var(--fs));
    line-height:1.5;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }


  /* ---------- scrollbars ----------
     Part of the furniture rather than the operating system's idea of a
     control: square, hairline-weight, no track, lifting on hover the way the
     buttons do. The inset is a transparent border clipped to the content box,
     which is the only way to get breathing room around a webkit thumb.

     Colours are written out rather than taken from --glass, and that is not
     an oversight: ::-webkit-scrollbar pseudo-elements do not inherit custom
     properties, so a var() here never resolves, the whole declaration is
     dropped as invalid, and the thumb silently falls back to the browser's
     own pale rounded bar. Every other symptom followed from that — the width
     applied, because 9px is a literal, so it measured as styled while looking
     like the default. --glass is 255,255,255 and --hue-dim is #7d93a8; if
     those change, change these too. */
  ::-webkit-scrollbar{width:9px;height:9px;background:transparent}
  ::-webkit-scrollbar-track{background:transparent;border:0}
  /* Weights are the interface's own, not a generic grey: idle matches the
     hairline border (rgba(255,255,255,.22)) so the bar reads as part of the
     frame, then lifts to --ui and --hue on hover and drag the way the
     controls do. A thumb dimmer than the borders around it looks like the
     browser's, however square it is. These are literals because a var() in a
     ::-webkit-scrollbar pseudo-element never resolves — see above — so keep
     them in step with :root by hand. --paper/--ui are fixed even though
     setPalette() swaps the canvas hue, so they are safe to hard-code. */
  ::-webkit-scrollbar-thumb{
    border-radius:0;
    background:rgba(255,255,255,.22);      /* = the hairline border weight */
    border:2px solid transparent;
    background-clip:content-box;
  }
  ::-webkit-scrollbar-thumb:hover{
    border-radius:0;
    background:#c3cedb;                    /* --ui */
    border:2px solid transparent;
    background-clip:content-box;
  }
  ::-webkit-scrollbar-thumb:active{
    border-radius:0;
    background:#dfe9f2;                    /* --hue / --ui-bright */
    border:2px solid transparent;
    background-clip:content-box;
  }
  ::-webkit-scrollbar-button{display:none;width:0;height:0}
  ::-webkit-scrollbar-corner{background:transparent}
  /* Firefox has no working ::-webkit-scrollbar and needs the standard
     properties instead. They cannot be set unconditionally — Chrome supports
     scrollbar-color too, and the moment it sees one it throws away every rule
     above and draws its own overlay bar — so this has to be scoped.

     It is scoped on -moz-appearance, which is true only in Firefox. The
     obvious-looking `@supports not selector(::-webkit-scrollbar)` is WRONG
     and was the regression: Firefox parses that selector for web-compat and
     reports it as supported, so `not` came out false, the block never
     applied, and Firefox fell all the way back to its default bar.

     Firefox draws a rounded thumb and offers no hover state, so it gets one
     solid palette tone rather than the hairline-then-lift the webkit path
     uses. */
  @supports (-moz-appearance: none){
    *{scrollbar-width:thin;scrollbar-color:#7d93a8 transparent}
  }

  /* ---------- shell ---------- */
  #shell{position:fixed;inset:0;display:flex;flex-direction:column}

  /* ---------- the screen ---------- */
  #screen{position:relative;flex:1 1 auto;min-height:0;overflow:hidden;background:var(--ink)}
  #cv{position:absolute;inset:0;width:100%;height:100%;display:block}

  /* glass stack — everything below sits ON TOP of the canvas */
  .ov{position:absolute;inset:0;pointer-events:none}

  /* ---------- what to say to it ----------
     Sized off the SHORTER side of the frame rather than the type scale, so it
     is legible from across a hallway on a portrait screen and on a landscape
     one without either being tuned by hand. Low in the frame, out of the
     figure's way, and dim: it is an invitation, not a headline, and the
     brightest thing on a wall should stay the thing the wall is for.

     Hidden by default and drawn only where it earns its place — see the rules
     at the end of this sheet. */
  #prompt{
    display:none;align-items:flex-end;justify-content:center;
    padding:0 6% 7%;z-index:5;
    font-size:clamp(13px, 3.1vmin, 30px);letter-spacing:.16em;
    text-align:center;line-height:1.5;
    color:rgba(var(--paper),.42);
    text-shadow:0 0 18px rgba(0,0,0,.75);
  }
  /* ---------- the screen has lost the server ----------
     Sized off the shorter side like the prompt, for the same reason: it is
     read from across a hallway or not at all. High in the frame rather than
     low, so it never lands on top of the invitation — and dimmer than a
     warning would be on a workstation, because this hangs on a wall in a
     house and the failure it reports is usually a router. */
  /* Sized off the shorter side like everything else in this frame, so it is
     legible across a hallway on a portrait screen and on a landscape one
     without either being tuned by hand. The time is the half anybody actually
     reads at a distance, so it carries the size and the date sits under the
     same rule one step down. */
  #clockline{
    display:none;align-items:flex-start;justify-content:space-between;
    padding:3.2% 6% 0;z-index:5;
    font-size:clamp(11px, 2.2vmin, 22px);letter-spacing:.18em;
    color:rgba(var(--paper),.42);
    text-shadow:0 0 18px rgba(0,0,0,.7);
    font-variant-numeric:tabular-nums;
  }
  #cktime{font-size:1.35em;letter-spacing:.14em;color:rgba(var(--paper),.62)}
  #ckdate{padding-top:.45em}
  #offline{
    display:none;align-items:flex-start;justify-content:center;
    padding:6% 6% 0;z-index:6;
    font-size:clamp(12px, 2.4vmin, 24px);letter-spacing:.16em;
    text-align:center;line-height:1.5;
    color:rgba(224,113,107,.72);
    text-shadow:0 0 18px rgba(0,0,0,.75);
  }
  #milk{background:radial-gradient(ellipse at 50% 45%,
          rgba(var(--glass),.055) 0%,
          rgba(var(--glass),.022) 42%,
          rgba(var(--glass),0) 72%);}
  #scan{background:repeating-linear-gradient(to bottom,
          rgba(0,0,0,.30) 0px, rgba(0,0,0,.30) 1px,
          rgba(0,0,0,0) 1px, rgba(0,0,0,0) 3px);
        opacity:.35;mix-blend-mode:multiply}
  #vign{background:radial-gradient(ellipse at 50% 50%,
          rgba(0,0,0,0) 40%, rgba(0,0,0,.55) 78%, rgba(0,0,0,.88) 100%);}
  #edge{box-shadow:inset 0 0 120px 30px rgba(0,0,0,.75);}

  /* ---------- transcript ---------- */
  #log{
    position:relative;z-index:3;overflow-y:auto;padding:22px 26px 8px;
    display:flex;flex-direction:column;gap:14px;
  }
  .msg{max-width:76ch;white-space:pre-wrap;word-break:break-word}
  .msg .who{
    display:block;font-size:calc(9.5px * var(--fs));letter-spacing:.22em;text-transform:uppercase;
    color:rgba(var(--paper),.8);margin-bottom:5px;
  }
  .msg.you .body{color:rgba(var(--paper),.82)}
  .msg.ai  .body{color:var(--text)}
  .caret{display:inline-block;width:7px;height:13px;background:var(--text);
         vertical-align:-2px;margin-left:2px;animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}

  /* layout: hero = viz on top, transcript below.  bleed = transcript over viz. */
  body[data-layout="hero"]  #screen{flex:0 0 52%}
  body[data-layout="hero"]  #log{flex:1 1 auto;border-top:1px solid rgba(var(--glass),.10)}
  body[data-layout="bleed"] #screen{flex:1 1 auto}
  /* The transcript overlays the field, so it is taken out of flow — which
     also takes it out of the composer's way, and its bottom edge lands on the
     viewport's rather than on the composer's top. The composer paints above
     it, so the last line does not push the bar down, it disappears behind it.

     --barh is the composer's measured height, watched rather than assumed: it
     moves with the type scale, and goes to zero when the composer is hidden
     (transcript off, an embed without the input part, no chrome at all), at
     which point the transcript should have that space back. */
  body[data-layout="bleed"] #log{
    position:absolute;inset:auto 0 var(--barh,0px) 0;max-height:62%;z-index:3;
    padding:40px 26px 14px;
    -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 60px);
            mask-image:linear-gradient(to bottom,transparent 0,#000 60px);
  }
  body[data-layout="bleed"] .msg.ai .body{text-shadow:0 0 16px rgba(0,0,0,.9)}

  /* A viewer can switch the transcript off and give the whole frame to the
     field. Must come after the layout rules: same specificity, so source
     order is what lets it override the hero split. */
  body[data-text="off"] #log{display:none}
  body[data-text="off"] #bar .pr,
  body[data-text="off"] #q{display:none}
  body[data-text="off"] #screen{flex:1 1 auto}
  body[data-text="off"] #bar{justify-content:flex-end}

  /* ---------- what a wall display looks like ----------
     VOICE ONLY has no rules of its own, deliberately. It is the rule above
     made into a policy for a place: the display page sets data-text="off" and
     will not let it back on, and the TEXT button is removed from the document
     rather than hidden — a control that is present and ignores you is worse
     than one that was never offered, and a rule that merely hid it would
     leave the button one line of CSS away from working again.

     What it does NOT take away is the rest of the bar. TALK is how a
     microphone gets started at all: a browser will not open one without
     somebody asking it to, so a display with no TALK button is a display that
     can never hear its own wake word. Voice only means no text, not no
     controls.

     THE SCREENSAVER takes the whole lot away, for a different reason and only
     while it drifts. Its rules are NOT here — they are at the end of this
     sheet, below the request overlay and the verdict, because they have to
     beat both and they carry the same specificity as the rules that show
     them. Placed here, `body[data-request] #request` won on source order and
     an unanswered request stayed on screen through the whole drift, which is
     the one stationary bright rectangle worth moving. */

  /* ---------- the embed's chrome ----------
     An embedded copy draws only the parts its token grants. data-noparts
     lists what is ABSENT rather than what is present, so an ordinary display
     — which has no such attribute — is untouched by every rule here and none
     of this can affect the page anybody opens directly.

     Hiding is the whole of the chrome axis and none of the capability axis:
     a part hidden here has had its CONTROL removed, not its permission. What
     the token is allowed to do is enforced on the server. */
  body[data-noparts~="visual"]     #screen{display:none}
  body[data-noparts~="transcript"] #log{display:none}
  body[data-noparts~="input"]      #bar .pr,
  body[data-noparts~="input"]      #q{display:none}
  body[data-noparts~="mode"]       #pttbtn{display:none}
  body[data-noparts~="talk"]       #talkbtn{display:none}
  body[data-noparts~="audio"]      #mute{display:none}
  body[data-noparts~="text"]       #textbtn{display:none}
  /* whatever is left takes the space the missing part was holding */
  body[data-noparts~="transcript"] #screen{flex:1 1 auto}
  body[data-noparts~="visual"]     #log{flex:1 1 auto}
  body[data-noparts~="input"]      #bar{justify-content:flex-end}
  /* a composer with nothing in it is a strip of furniture, not a control */
  body[data-nobar] #bar{display:none}
  /* the frame rate counter is a rig instrument; it has no business in
     somebody else's product — and a tablet bolted to somebody's hallway wall
     is as much somebody else's product as an embed is. It was worse than
     untidy there: fixed at the top left, never moving, small and bright, it
     was the one thing on a wall screen that a screensaver drifting the whole
     figure away could not save. The reasoning was already written here; it
     had only ever been applied to the embed. */
  body[data-embed] #fps,
  body[data-kiosk]  #fps{display:none}

  /* ---------- composer ---------- */
  #bar{
    position:relative;z-index:4;flex:0 0 auto;display:flex;align-items:center;gap:12px;
    padding:12px 26px;border-top:1px solid rgba(var(--glass),.12);
    background:linear-gradient(to top,rgba(0,0,0,.6),rgba(0,0,0,.15));
  }
  /* Above the composer, below the transcript, and quiet enough to ignore
     until you need it. One line each, clipped rather than wrapped: this must
     never grow tall enough to push the conversation about. Empty spans
     collapse, so a display with nothing to report shows nothing at all. */
  /* The status line. Bigger than it was: it is the answer to "why did nothing
     happen?", read from across a room on a screen with no other text on it,
     and 9px set it below everything it was competing with. */
  #status{
    position:relative;z-index:4;flex:0 0 auto;display:flex;gap:18px;
    padding:2px 26px;font-size:calc(11px * var(--fs));letter-spacing:.05em;
    line-height:1.5;color:rgba(var(--paper),.55);
  }
  /* A refusal, in red, so "here is what happened" and "here is why nothing
     happened" are tellable apart without reading the words. */
  #status .bad{color:#e0716b}

  /* ---- the request page ----
     Where the transcript and the composer would be. The figure above it is
     untouched: a device waiting on a decision should look like the product it
     is about to become, not like an error page with a logo. */
  #request{display:none}
  body[data-request] #log,
  body[data-request] #bar{display:none}
  /* Centred, because it is the whole of the page for as long as it is shown.
     The transcript it replaces is a column of arriving text and belongs
     against the edge; a form is one object and sitting it hard left with the
     rest of the width empty reads as something that failed to load. */
  body[data-request] #request{
    position:relative;z-index:3;flex:1 1 auto;overflow-y:auto;
    display:flex;flex-direction:column;justify-content:center;gap:12px;
    padding:22px 26px 18px;
    width:100%;max-width:560px;margin-inline:auto;
  }
  /* ---- the code box ----
     Set apart from the request beneath it by a rule, because they are two
     different conversations: one is finishing a setup somebody already
     decided on, the other is asking to be let in. The code is typed at the
     size of the thing it is — six characters read off another screen — rather
     than at form-field size. */
  #enrol{display:none;flex-direction:column;gap:8px;
         padding-bottom:14px;border-bottom:1px solid rgba(var(--glass),.18)}
  body[data-enrol] #enrol{display:flex}
  /* ---- the gate ----
     The first thing anybody who is not already a screen on this wall sees.
     Signing in is the default because it is what most people arriving here
     are doing; the other two ways past — a code, or asking — are a line of
     links under it rather than two more boxes stacked on the same page. Three
     forms at once was the old shape, and it asked somebody to work out which
     of them was theirs before they could do anything. */
  #gate{display:none;flex-direction:column;gap:10px;
        padding-bottom:14px;border-bottom:1px solid rgba(var(--glass),.18)}
  body[data-gate] #gate{display:flex}
  /* The mark, and the only place on this page it appears at rest. A login box
     with nothing above it could belong to anything.

     LARGE, and centred over the fields. It was small and hard left, which read
     as a watermark on a form; at this size it is the thing you see first and
     the form is what sits under it — which is the right order for a page whose
     whole job, before anybody types anything, is to say what this is. */
  #gatemark{width:320px;max-width:82%;height:auto;opacity:.95;
            align-self:center;margin:4px auto 18px}
  #gatehead{font-size:calc(12px * var(--fs));line-height:1.6;
            color:rgba(var(--paper),.88)}
  #gatefields{display:flex;flex-direction:column;gap:8px}
  #gatefields input{
    font:inherit;font-size:calc(13px * var(--fs));
    padding:9px 11px;color:rgba(var(--paper),.95);
    background:rgba(var(--glass),.07);
    border:1px solid rgba(var(--glass),.28);border-radius:0;
  }
  #gatefields input:focus{border-color:rgba(var(--glass),.62);outline:none}
  #gatefields input::placeholder{color:rgba(var(--paper),.3)}
  /* The links, in one row, in the order somebody needs them: the way most
     people get past this, then the two exceptions. */
  #gatelinks{display:flex;gap:16px;flex-wrap:wrap;margin-top:2px}
  .gatelink{
    font:inherit;font-size:calc(10px * var(--fs));letter-spacing:.08em;
    background:none;border:0;padding:0;cursor:pointer;
    color:rgba(var(--paper),.62);
    border-bottom:1px solid rgba(var(--glass),.28);
  }
  .gatelink:hover{color:rgba(var(--paper),.9);
                  border-bottom-color:rgba(var(--glass),.6)}
  #gatenote{font-size:calc(10px * var(--fs));line-height:1.6;
            color:rgba(var(--paper),.62)}
  #gatenote.bad{color:#ff8a8a}
  /* One per line, name over address: the two are read at different moments —
     the name is what somebody was told to use, the address is what they type
     on a machine that did not follow this link. */
  #gateplaces{display:flex;flex-direction:column;gap:8px}
  #gateplaces a{
    display:flex;flex-direction:column;gap:2px;text-decoration:none;
    padding:9px 11px;border:1px solid rgba(var(--glass),.30);
    border-radius:3px;color:rgba(var(--paper),.62);
    font-size:calc(10px * var(--fs));line-height:1.5;word-break:break-all;
  }
  #gateplaces a b{
    font-size:calc(11px * var(--fs));letter-spacing:.10em;
    text-transform:uppercase;color:rgba(var(--paper),.92);word-break:normal;
  }
  #gateplaces a:hover{border-color:rgba(var(--glass),.65);
                      color:rgba(var(--paper),.85)}

  /* ---------- the enrolment listener ----------
     A door and nothing else. Every one of these is a control wired to a route
     that does not answer on this port — the composer would post to an
     assistant that is not here, the status line would report a microphone
     nothing listens to, and the transcript would never have a line in it.
     The figure stays: it is the product's face, and this is still the product.
     Same shape as the screensaver's rules below, and for a similar reason —
     what is left is what belongs on screen. */
  /* THE DIAGNOSTIC STRIP, off unless somebody asked for it. It is what the
     microphone and the voice are doing, and on a screen nobody is debugging it
     is a line that twitches at conversations in the room and says nothing
     anybody wanted. Off is the default on both the device and the person, so
     the ordinary state of every screen is silent — see status_for. */
  body:not([data-status]) #status{display:none}
  body[data-enrolonly] #log,
  body[data-enrolonly] #bar,
  body[data-enrolonly] #status,
  body[data-enrolonly] #enrol,
  body[data-enrolonly] #reqhead,
  body[data-enrolonly] #reqform,
  /* REQUEST ACCESS and its row. The button is a direct child of #request
     rather than of the form, so hiding the form left it behind — and asking
     to be let in is a thing you do at an assistant, which this port has none
     of. The wrapper goes with it, or the page keeps its gap. */
  body[data-enrolonly] #request > .seg,
  body[data-enrolonly] #fps{display:none}
  body[data-enrolonly] #screen{flex:1 1 auto}
  #gatego_row{display:flex;gap:8px;flex-wrap:wrap}
  #enrolhead{
    font-size:calc(12px * var(--fs));line-height:1.6;color:rgba(var(--paper),.88);
  }
  #enrolrow{display:flex;gap:8px;flex-wrap:wrap}
  #enrolcode{
    flex:1 1 180px;min-width:0;font:inherit;
    font-size:calc(17px * var(--fs));letter-spacing:.28em;text-transform:uppercase;
    padding:8px 10px;background:rgba(0,0,0,.45);color:var(--text);
    border:1px solid rgba(var(--glass),.3);outline:0;border-radius:0;
  }
  #enrolcode:focus{border-color:rgba(var(--glass),.62)}
  #enrolcode::placeholder{color:rgba(var(--paper),.28);letter-spacing:.28em}
  #gatego,
  #enrolgo{
    font:inherit;font-size:calc(10px * var(--fs));letter-spacing:.18em;
    padding:8px 14px;cursor:pointer;
    background:none;color:rgba(var(--paper),.9);
    border:1px solid rgba(var(--glass),.4);
  }
  #gatego:hover,
  #enrolgo:hover{border-color:rgba(var(--glass),.75)}
  #enrolgo[disabled]{opacity:.5;cursor:default}
  #enrolnote{
    font-size:calc(9.5px * var(--fs));line-height:1.6;
    color:rgba(var(--paper),.55);
  }
  #enrolnote.bad{color:#e0716b}
  #reqhead{
    font-size:calc(12px * var(--fs));line-height:1.6;
    color:rgba(var(--paper),.88);
  }
  #reqhead b{font-weight:400;color:var(--text)}
  #reqform{display:flex;flex-direction:column;gap:10px}
  #reqform label{
    display:flex;flex-direction:column;gap:4px;
    font-size:calc(9px * var(--fs));letter-spacing:.14em;
    text-transform:uppercase;color:rgba(var(--paper),.55);
  }
  #reqform input,#reqform textarea{
    font:inherit;font-size:calc(12px * var(--fs));padding:7px 9px;
    background:rgba(0,0,0,.45);color:var(--text);
    border:1px solid rgba(var(--glass),.18);outline:0;border-radius:0;
  }
  #reqform input:focus,#reqform textarea:focus{border-color:rgba(var(--glass),.5)}
  #reqform textarea{resize:vertical;min-height:74px;line-height:1.5}
  #reqform .req{color:rgba(var(--paper),.4)}
  #request .seg,#verdictbox .seg{display:flex;gap:6px}
  #request button,#verdictbox button{
    font:inherit;font-size:calc(10px * var(--fs));letter-spacing:.16em;
    padding:8px 14px;cursor:pointer;background:none;
    color:rgba(var(--paper),.9);border:1px solid rgba(var(--glass),.35);
  }
  #request button:hover:not(:disabled),
  #verdictbox button:hover{border-color:var(--text);color:var(--text)}
  #request button:disabled{opacity:.45;cursor:default}
  #reqnote{
    font-size:calc(10px * var(--fs));line-height:1.6;
    color:rgba(var(--paper),.6);
  }
  #reqnote.bad{color:#e8a0a0}

  /* The answer, whichever way it went. A modal rather than a status line: the
     person asked a question and walked away, and this is the reply — it should
     interrupt, once, and then get out of the way. */
  #verdict{
    display:none;position:fixed;inset:0;z-index:40;
    align-items:center;justify-content:center;padding:24px;
    background:rgba(0,0,0,.72);
  }
  #verdict.on{display:flex}
  #verdictbox{
    max-width:440px;width:100%;padding:22px 24px;
    background:#0b0e12;border:1px solid rgba(var(--glass),.4);
    display:flex;flex-direction:column;gap:12px;
  }
  #verdicttitle{
    font-size:calc(13px * var(--fs));letter-spacing:.1em;color:var(--text);
  }
  #verdictbody{
    font-size:calc(11px * var(--fs));line-height:1.65;
    color:rgba(var(--paper),.82);white-space:pre-wrap;
  }
  #status span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #micnote{flex:1 1 60%}
  #ttsnote{flex:1 1 40%;text-align:right}
  #status:empty{display:none}
  body[data-noparts~="transcript"] #status{display:none}
  #bar .pr{color:rgba(var(--paper),.78);letter-spacing:.2em;font-size:calc(10px * var(--fs))}
  #q{
    flex:1;background:none;border:0;outline:0;color:var(--text);
    font:inherit;font-size:calc(13px * var(--fs));caret-color:var(--text);
  }
  #q::placeholder{color:rgba(var(--paper),.5)}
  .src{display:flex;gap:6px}
  .src button{
    font:inherit;font-weight:400;font-size:calc(9px * var(--fs));letter-spacing:.18em;padding:3px 8px;
    background:none;border:1px solid rgba(var(--glass),.16);
    color:rgba(var(--paper),.85);cursor:pointer;
  }
  .src button .ico{margin-right:.5em}
  .src button.on{border-color:var(--hue-dim);color:var(--hue)}
  /* same hover feedback the admin page gives, for the three controls a
     viewer actually has */
  .src button:hover:not([disabled]){border-color:var(--hue);color:var(--hue)}
  .src button.rec{border-color:#ff5a5a;color:#ff8a8a}
  /* after .on deliberately: asleep is a sub-state of live and must win */
  .src button.asleep{border-color:rgba(var(--glass),.16);color:rgba(var(--paper),.42)}
  .src button[disabled]{opacity:.35;cursor:not-allowed}

  /* ---------- narrow: the word goes, the button stays ----------
     Measured on the shipped layout: the four labelled buttons, the prompt and
     the flex gaps come to 366px of fixed furniture before the field gets a
     pixel. At 375px the field cannot shrink below its intrinsic width, so it
     held its ground and pushed TEXT clean off the right edge — a control that
     is not merely cramped but unreachable.

     Dropping to icons is the usual answer and it fits, but shrinking is the
     wrong instinct: a 28px target is below every touch guideline going, so
     they grow to 44px square here rather than getting smaller.

     Inside an iframe this keys off the FRAME's width, not the device, so one
     breakpoint covers a phone and a narrow embed in a desktop page. */
  /* ---------- fingers ----------
     A touch target is about what is touching it, not about how wide the
     window is. These sizes lived under `max-width: 560px`, which is right for
     a phone and wrong for every tablet: a wall screen in portrait at 800
     points, or a 10-inch one in landscape, never reaches that breakpoint and
     was handing a finger a 22-pixel-high button. On a voice-only display that
     is not cosmetic — TALK is the only thing that can open a microphone, so
     the one control that has to be hittable was the smallest thing on screen.

     `pointer: coarse` asks the question that was actually meant. Width still
     decides whether the WORDS fit; it no longer decides how big the button
     is. */
  @media (pointer: coarse){
    #bar{padding-top:9px;padding-bottom:9px}
    .src button{min-height:44px;min-width:44px;padding:0 11px}
    #q{min-height:44px}
  }

  @media (max-width: 560px){
    #bar{padding:10px 14px;gap:10px;flex-wrap:wrap}
    /* an input will not go below its intrinsic width without this, which is
       what pushed the buttons out rather than yielding to them */
    #q{min-width:0}
    .src{gap:8px}
    .src button{
      min-width:44px;min-height:44px;padding:0;
      display:inline-flex;align-items:center;justify-content:center;
      font-size:calc(15px * var(--fs));letter-spacing:0;
    }
    .src button .ico{margin-right:0}
    .src button .lbl{
      /* removed from view, kept for anyone reading the page aloud — the
         aria-label set alongside it carries the same word */
      position:absolute;width:1px;height:1px;overflow:hidden;
      clip-path:inset(50%);white-space:nowrap;
    }
    #log{padding:16px 14px 8px}
    body[data-layout="bleed"] #log{padding:40px 14px 14px}
  }

  #fps{position:fixed;left:12px;top:10px;z-index:20;font-size:calc(9px * var(--fs));letter-spacing:.14em;
       color:rgba(var(--paper),.76)}
    /* ---------- the screensaver, last on purpose ----------
     While it drifts there is nothing on the screen but the figure. The
     transcript and the composer go because text sliding around a panel is
     worse than either state on its own; the status line, an unanswered
     request and an undismissed verdict go because a small bright rectangle
     that never moves is the exact thing being drifted away from.

     LAST IN THE SHEET, and that is the whole reason these three lines are
     down here rather than up with the rest of the wall rules. Every rule that
     puts one of these on screen carries the same specificity as the rule that
     takes it away, so source order is the only thing deciding — and higher up,
     `body[data-request] #request` won.

     None of it is a decision the viewer has to undo: everything here comes
     back the instant the screen is touched, before the geometry has finished
     easing home. */
  body[data-saver] #log,
  body[data-saver] #bar,
  body[data-saver] #status,
  body[data-saver] #fps,
  body[data-saver] #request,
  body[data-saver] #verdict{display:none}
  body[data-saver] #screen{flex:1 1 auto}

  /* ---------- the resting prompt ----------
     Only on a wall, only when there is a name to say, and only while nobody
     is talking to it — `data-prompt` carries all three, decided in one place
     rather than by four rules that can disagree.

     NOT while it drifts, and that is not the same as being hidden: the
     screensaver DRAWS it on the canvas instead, moving with the figure and
     dimming with it. Left here it would be the one stationary bright line on
     a screen whose whole purpose at that moment is that nothing stays still —
     and taking it away entirely would lose it for exactly the person it is
     for, who walks up to a screen that has been idle for hours. */
  body[data-prompt]:not([data-saver]) #prompt{display:flex}
  /* …and the same arrangement for the lost server, which a drifting screen
     needs MORE than the invitation rather than less: still moving, still
     looking perfect, reaching nothing. It stands down here and is painted
     into the canvas for the duration, because an outage lasts hours and a
     stationary line held that long on a screen whose whole purpose at that
     moment is that nothing stays still is the one thing left to burn in. */
  /* NOT WHILE IT DRIFTS. A line that never moves is the exact thing the
     screensaver exists to drift away from, so the clock goes with the rest of
     the overlays rather than being the one that burns in. Same rule, same
     shape, as the lost-server line below it. */
  body[data-clock]:not([data-saver]) #clockline{display:flex}
  body[data-offline]:not([data-saver]) #offline{display:flex}
</style>
</head>
<body data-layout="hero">

<div id="fps"></div>

<div id="shell">
  <div id="screen">
    <canvas id="cv"></canvas>
    <!-- What to say to it. A screen on a wall is walked past by people who
         have never used it and have no way of knowing it listens — and on a
         voice-only display there is no transcript, no composer and no hint of
         any kind. Only ever drawn on a wall: a browser tab was opened
         deliberately by somebody who already knows what it is. -->
    <!-- THE TIME, on the screens whose layout asks for one. Across the top and
         at the two ends, out of the figure's way and out of the invitation's:
         the frame is read from the middle outwards, so the corners are where
         something you glance at rather than look at belongs. Dim, for the same
         reason the invitation is — the brightest thing on a wall should stay
         the thing the wall is for. -->
    <div class="ov" id="clockline">
      <span id="ckdate"></span>
      <span id="cktime"></span>
    </div>
    <div class="ov" id="prompt"></div>
    <!-- The screen has lost the server and has said so once. High in the
         frame, where the invitation is low, so the two never argue over the
         same line — and it CLEARS ITSELF when the server comes back rather
         than waiting to be dismissed. Nobody is standing in front of a
         hallway screen to press anything, and an alert that needs a press is
         an alert that stays up for a month.

         Hidden while the screensaver drifts, and painted into the canvas
         instead — the same as the invitation, for the same burn-in reason.
         See render(). -->
    <div class="ov" id="offline"></div>
    <div class="ov" id="milk"></div>
    <div class="ov" id="scan"></div>
    <div class="ov" id="vign"></div>
    <div class="ov" id="edge"></div>
  </div>

  <div id="log"></div>

  <!-- What a device that may not use anything gets instead of a transcript and
       a composer: the figure above, unchanged, and a form. There is nothing to
       transcribe and nowhere to send what you type, so drawing either would be
       two controls wired to a refusal. Built from the fields an admin defined —
       this server has no opinion about what a request should ask. -->
  <div id="request">
    <!-- Somebody commissioning this screen, holding six characters an admin
         read out. FIRST, above the request form, because a person with a code
         has already been decided about — they are finishing a setup, not
         asking to be let in — and because the form was the only thing on this
         page, so a code had nowhere to go and no sign that it was wanted.

         Its own path to the end: the URL form, /e/CODE, is a fine thing to
         type into a television with a remote and a poor thing to ask for from
         somebody already looking at this screen. -->
    <!-- A PERSON, signing in. An email address and a password, which is the
         one credential here that reaches somebody on a machine that has never
         heard of them — a minted URL in a cookie could only ever be the
         browser it was opened in. The server refuses it outright over a plain
         connection.

         FIRST, and the default state of this page, with the other two ways
         past it as links underneath. All three used to be stacked and visible
         at once, which asked whoever was standing here to work out which of
         three forms was theirs before they could do anything. -->
    <div id="gate">
      <img id="gatemark" src="lockup.svg" alt="Resonance">
      <div id="gatehead"></div>
      <div id="gatefields">
        <input id="gateuser" type="email" autocomplete="username"
               spellcheck="false" autocapitalize="none" maxlength="160"
               placeholder="you@example.com" aria-label="your email address">
        <input id="gatepass" type="password" autocomplete="current-password"
               maxlength="512" placeholder="password" aria-label="your password">
        <!-- Setup only. Choosing a password you cannot reproduce, on the one
             page that will not let you back in to try again, is the failure
             this second field exists to catch. -->
        <input id="gatepass2" type="password" autocomplete="new-password"
               maxlength="512" placeholder="password again"
               aria-label="the same password again" style="display:none">
        <div id="gatego_row">
          <button id="gatego" type="button">SIGN IN</button>
        </div>
      </div>
      <div id="gatenote"></div>
      <!-- WHERE THIS ACCOUNT CAN BE USED, once it has a password. Only ever
           drawn on the enrolment listener, which is the one place somebody
           finishes setting up and is then standing somewhere that will never
           answer them. Each line is a door the server has already tested. -->
      <div id="gateplaces" style="display:none"></div>
      <!-- The two exceptions, as links. Each one swaps the box above for the
           thing it names and offers the way back; a person only ever sees the
           routes they are NOT currently on. -->
      <div id="gatelinks">
        <button id="gatecode" class="gatelink" type="button">Use Code Instead</button>
        <button id="gatereq" class="gatelink" type="button">Request Access</button>
      </div>
    </div>
    <!-- Hidden until USE CODE INSTEAD asks for it. Inline rather than left to
         `body[data-enrol] #enrol{display:flex}`, which turns on for any screen
         that is not approved — that rule predates the gate, when the code box
         was one of three things stacked on this page at once. -->
    <div id="enrol" style="display:none">
      <div id="enrolhead">Setting this screen up?</div>
      <div id="enrolrow">
        <input id="enrolcode" type="text" spellcheck="false" autocomplete="off"
               autocapitalize="characters" maxlength="7" placeholder="K7Q-P4M"
               aria-label="setup code">
        <button id="enrolgo" type="button">USE CODE</button>
      </div>
      <div id="enrolnote">Type the six-character code from the admin panel.
Case and dashes do not matter.</div>
    </div>
    <div id="reqhead"></div>
    <form id="reqform" autocomplete="off"></form>
    <div class="seg"><button id="reqsend" type="button">REQUEST ACCESS</button></div>
    <div id="reqnote"></div>
  </div>

  <div id="verdict">
    <div id="verdictbox">
      <div id="verdicttitle"></div>
      <div id="verdictbody"></div>
      <div class="seg"><button id="verdictok" type="button">OK</button></div>
    </div>
  </div>

  <!-- What just happened, for the person standing in front of it. Every one of
       these messages already existed and was written to elements that were not
       on this page: micNote() and note() resolved to null here, and only ever
       appeared inside the admin panel's preview, which relays them. So a
       display that heard nothing, mis-heard you, could not reach its endpoint,
       or had gone to sleep looked identical — silent — and the explanation was
       thrown away at the one place it was needed. Dim and one line: it is a
       status line, not a second transcript. -->
  <div id="status">
    <span id="micnote"></span>
    <span id="ttsnote"></span>
  </div>

  <div id="bar">
    <span class="pr">&gt;</span>
    <input id="q" autocomplete="off" spellcheck="false" placeholder="ask Resonance…">
    <!-- user-facing control. The TOKEN/TTS source switch is a rig/admin
         thing and lives in the panel; this is the one users get. -->
    <!-- icon and word are separate elements so a narrow viewport can drop the
         word and keep the button. They were one string, which meant the label
         could only be shortened in JS — and JS deciding layout from a width is
         the wrong place for it. -->
    <span class="src">
      <button id="pttbtn" title="how Resonance decides when you have finished speaking"><span class="ico">⌨</span><span class="lbl">SPACE</span></button>
      <button id="talkbtn" title="speak to Resonance — mic drives the geometry and your words are transcribed"><span class="ico">🎤</span><span class="lbl">TALK</span></button>
      <button id="mute" class="on" title="mute its voice"><span class="ico">🔊</span><span class="lbl">AUDIO</span></button>
      <button id="textbtn" class="on" title="hide the transcript and give the space to the field"><span class="ico">▤</span><span class="lbl">TEXT</span></button>
    </span>
  </div>
</div>

<script>
"use strict";
/* =====================================================================
   RESONANCE — chat surface
   Phase 1 of 3.  The geometry is driven by a SIMULATED TOKEN STREAM.
   Phases 2 (TTS) and 3 (mic) plug into the same place: they only need to
   push a 0..1 number into Drive.level each frame.  Nothing else changes.
   ===================================================================== */

/* Every control that used to live in this page now lives in admin.html,
   so these lookups must tolerate an absent element rather than throw. */
const $ = (id)=> document.getElementById(id);
const on = (id, ev, fn)=>{ const e = $(id); if (e) e.addEventListener(ev, fn); };

/* PREVIEW: this page inside the admin page's iframe. Same page, same code —
   the preview is the real thing rather than a second implementation that can
   drift from it. */
const PREVIEW = new URLSearchParams(location.search).has('preview');
function relay(slot, text, live){
  if (PREVIEW && window.parent !== window)
    window.parent.postMessage({rsn:1, kind:'status', slot, text, live:!!live}, '*');
}

/* EMBED: this same page, served at /embed to another application's browser,
   carrying a short-lived session token its SERVER was given in exchange for a
   key. Same page again rather than a cut-down copy, for the reason the
   preview is: a second implementation is a second thing to keep correct.

   The token rides in the URL and goes back out as a bearer header. Not a
   cookie — a cookie set by an iframe is a third-party cookie, and browsers
   block or partition those, so an embed authenticated that way works in one
   browser and silently fails in the next. Nothing ambient also means nothing
   to forge. */
const EMBED = (()=>{
  const t = new URLSearchParams(location.search).get('t');
  return (t && /\/embed\/?$/.test(location.pathname)) ? t : null;
})();

if (EMBED){
  document.body.dataset.embed = '1';
  /* Draw nothing until the grant arrives. A frame that shows the full
     interface for a moment and then takes six parts away is worse than one
     that arrives already correct — and on a token that draws the figure
     alone, that flash is the whole of somebody else's product. */
  document.body.dataset.noparts = 'visual transcript input mode talk audio text';
  document.body.dataset.nobar = '1';
  /* Every call this page makes is same-origin and relative, so wrapping
     fetch once cannot send the token anywhere but back here. The
     alternative — threading a header through eight call sites — is eight
     places for the next one to be forgotten. */
  const rawFetch = window.fetch.bind(window);
  window.fetch = (input, init)=>{
    const url = new URL(typeof input === 'string' ? input : input.url,
                        location.href);
    if (url.origin !== location.origin) return rawFetch(input, init);
    const opts = Object.assign({}, init);
    const h = new Headers((init && init.headers) ||
                          (typeof input === 'object' && input.headers) || {});
    h.set('Authorization', 'Bearer ' + EMBED);
    opts.headers = h;
    return rawFetch(input, opts);
  };
}

/* What this embed was granted, and what the host has narrowed it to. Two
   objects on purpose: `grant` is the ceiling the admin set when the key was
   created and never moves, `live` is what is in force now. A host may lower
   `live` on either axis at runtime and can never raise it — the refusal is
   code that ships from here, because the host page is untrusted by
   definition and a rule they promise to keep is not a control. */
const Embed = {
  grant: null,
  /* Closed until the grant arrives, and only under EMBED — a page nobody
     framed has no grant to wait for and must not be gated by one. The wake
     word can reach the microphone before a fetch resolves, so the gap
     between the frame loading and the server answering has to deny rather
     than default to the ordinary display's permissions. */
  live:  EMBED ? {parts: [], cap: {ask:false, mic:false, speak:false}}
               : {parts: null, cap: null},
  has(part){ return !this.live.parts || this.live.parts.indexOf(part) >= 0; },
  can(what){ return !this.live.cap || !!this.live.cap[what]; },
};

/* -------------------------------------------------- the display's name
   `?display=workshop` is the declared name: a name survives a browser wipe
   where a token does not, and it is what the admin's list calls this device
   until somebody renames it.

   It is a NAME AND NOT A KEY. Anything can type it, so nothing is granted on
   the strength of it — see Display below, which is where the token that says
   this really is that place comes from.

   Capped and stripped of markup characters: it is somebody else's string
   arriving from a URL, and it ends up rendered as a name. */
const DISPLAY_NAME = (new URLSearchParams(location.search).get('display') || '')
  .replace(/[<>{}]/g, '').trim().slice(0, 40);

/* How an enrolment went. Somebody typed /e/K7QP4M into this screen with a
   remote; the server spent the code, set the cookie and sent them back here
   with one word about it. Read once and taken straight out of the address bar
   — a wall screen's URL should be the URL it was given, and the outcome of a
   thing that happened once has no business surviving a reload. */
const ENROL = (new URLSearchParams(location.search).get('enrol') || '')
  .replace(/[^a-z]/g, '').slice(0, 12);
if (ENROL && window.history && history.replaceState)
  history.replaceState(null, '', location.pathname);

/* ================================================================== PERSON
   Who is at this browser, as against WHERE it is. A display is one machine in
   one room; a person signs in on whatever they are sitting at.

   TWO STATES, where there were three. There used to be `none`, `locked` and
   `open`, because a PIN was optional — somebody could be here without one and
   keep their preferences in this browser. A password is not optional: the
   setup link exists to collect one, and nothing reaches an account without it.
   So a person is signed in or they are not, and signed in is the only state
   whose settings come from the server rather than from localStorage.

   `?person=` is the one word the server sends back after somebody opens a
   minted link, read once and taken straight out of the address bar — the
   outcome of a thing that happened once has no business surviving a reload.
   Three answers now: `setup` for an account with no password yet, `ready` for
   a link that has already been spent, `bad` for one that means nothing. */
/* THE ENROLMENT LISTENER, or not. A door and nothing else: no assistant, no
   microphone, no device token to be issued. Everything this page normally does
   on load answers 404 there, so it does none of it — see enrolOnly. */
let ENROL_ONLY = false;
/* Where this account can actually be used, handed over by /user/setup once a
   password exists. This listener is not one of them and never will be. */
let PLACES = [];

const PERSON_ARRIVED = (new URLSearchParams(location.search).get('person') || '')
  .replace(/[^a-z]/g, '').slice(0, 12);
if (PERSON_ARRIVED && window.history && history.replaceState)
  history.replaceState(null, '', location.pathname);

const Person = {
  id: '', name: '', email: '', status: false,
  is(){ return !!this.id; },
  take(p){
    this.id = p.id || '';
    this.name = p.name || '';
    this.email = p.email || '';
    /* Theirs, and it travels: signing in at a screen somebody has never used
       brings their own answer with them. */
    this.status = !!p.status;
    /* Their own settings win over whatever this browser had. That is the
       whole point of an account: the machine's copy is a local habit, theirs
       is the thing that follows them. */
    if (p.settings) Prefs.adopt(p.settings);
    /* Signing in can turn it on, and signing out has to be able to turn it
       off again — so this runs on every take rather than only where it is
       true. */
    if (typeof syncStatusLine === 'function') syncStatusLine();
    paintGate();
    /* THE TRANSCRIPT, RELABELLED. Signing in is the one moment the answer to
       "who is speaking" changes without a setting being touched, and the
       lines already on screen were attributed to whatever this browser was
       before — on a page that does not reload, that label would sit there
       for the rest of the session. Guarded because this object is taken at
       load, before the transcript exists. */
    if (typeof repaintNames === 'function') repaintNames();
  },
};

/* WHICH OF THE FOUR THINGS THIS PAGE IS ASKING FOR. One at a time, because
   they are four different conversations and only one of them is ever yours:

     login    an email and a password. The default, and where most people are.
     setup    the link has been opened and there is no password yet. Forced —
              there is no link out of this state, because an account without a
              password is one nobody can ever sign in to.
     code     six characters an admin read out, for a screen being hung.
     request  the form, for somebody asking to be let in.

   A link swaps between them; nothing here reloads. */
let GATE = 'login';

function paintGate(){
  const box = $('gate');
  if (!box) return;
  const setup = GATE === 'setup';
  const done = GATE === 'done';
  /* THE THREE STATES THE ENROLMENT LISTENER HAS. It is one door: an
     invitation is accepted here and nothing else is, so there is no sign-in
     to offer, no code to type and nobody to ask for access — every one of
     those posts to a route that does not exist on this port. Saying so is the
     alternative to a form that fails for a reason nobody can see. */
  const invite = GATE === 'invite';
  const spent = GATE === 'spent';
  const signing = (GATE === 'login' || setup) && !invite && !spent;
  /* The one failure a link can have. Said here rather than nowhere: the
     server answers a redirect with one word, and somebody who followed a link
     that did not work should be told, not left looking at a page behaving as
     though they never clicked it. */
  const failed = PERSON_ARRIVED === 'bad';
  const head = $('gatehead'), note = $('gatenote');
  const fields = $('gatefields'), links = $('gatelinks');
  const user = $('gateuser'), pass = $('gatepass'), pass2 = $('gatepass2');
  const go = $('gatego');

  if (fields) fields.style.display = signing ? '' : 'none';
  /* The email is not asked for at setup: the link already said who this is,
     and a box somebody could type a different address into would look like a
     choice that is not being offered. */
  if (user) user.style.display = setup ? 'none' : '';
  if (pass2) pass2.style.display = setup ? '' : 'none';
  if (go) go.textContent = setup ? 'SET PASSWORD' : 'SIGN IN';
  if (pass) pass.setAttribute('autocomplete',
                              setup ? 'new-password' : 'current-password');
  if (pass) pass.placeholder = setup ? 'choose a password' : 'password';

  if (head){
    /* A REFUSED LINK IS ASKED ABOUT FIRST. It used to be asked about last,
       and `invite` is set for everything that is not a spent link — so a
       refusal painted "open the link you were sent" at somebody who had just
       opened the link they were sent, and the two messages written for the
       two failures could never appear. */
    head.textContent =
        done    ? 'You are set up'
      : failed             ? 'That link did not work'
      : invite  ? 'Invitations are accepted here'
      : spent   ? 'That link has been used'
      : setup   ? 'Choose a password'
      : GATE === 'code'    ? 'Setting this screen up?'
      : GATE === 'request' ? 'Ask to be let in'
      : 'Sign in';
  }
  /* Only where nothing else has written a reason into it. A failed sign-in
     leaves its own message here and repainting the mode must not wipe it. */
  if (note && !note.classList.contains('bad')){
    note.textContent =
        done    ? (PLACES.length
                    ? 'Sign in with your email address and the password you '
                      + 'just chose, at whichever of these you want:'
                    : 'Nothing has been granted to this account yet — an '
                      + 'administrator has to say which assistant you may use.')
      : failed             ? 'It may have been replaced since it was sent to '
                             + 'you. Ask an administrator for a new one.'
      : invite  ? 'Open the link you were sent. It is the only way in from '
                  + 'this address, and it works nowhere else.'
      : spent   ? 'A password was already chosen with it. Sign in where your '
                  + 'assistant is, or ask an administrator for a new link.'
      : setup   ? 'It is how you sign in from now on, and this link only '
                  + 'works once. Choose something long.'
      : GATE === 'code'    ? ''
      : GATE === 'request' ? ''
      : '';
  }

  /* The links name where you are NOT. Nothing to press that lands you where
     you already are, and no way out of setup at all. */
  if (links){
    /* Neither of those routes answers on the enrolment listener, so offering
       them would be two buttons that 404. */
    links.style.display = (setup || ENROL_ONLY) ? 'none' : '';
    const code = $('gatecode'), req = $('gatereq');
    if (code) code.textContent = GATE === 'code' ? 'Sign In Instead'
                                                 : 'Use Code Instead';
    if (req) req.textContent = GATE === 'request' ? 'Sign In Instead'
                                                  : 'Request Access';
  }
  paintPlaces(done);
  paintGateAreas();
}

/* WHERE TO GO NOW, once there is a password. The server works this out with
   the same test that will be applied when they arrive, so every line here is
   a door that opens — and this listener is deliberately not one of them, so
   without this somebody finishes enrolling and is left standing on a port
   that will never answer them. */
function paintPlaces(show){
  const box = $('gateplaces');
  if (!box) return;
  box.innerHTML = '';
  box.style.display = (show && PLACES.length) ? '' : 'none';
  if (!show) return;
  PLACES.forEach(p=>{
    const a = document.createElement('a');
    a.href = p.url;
    /* A NAME AND ITS ADDRESS, both. The name is what an admin called it and
       what somebody will be told to use; the address is what they have to
       type on a machine that did not follow this link. */
    const n = document.createElement('b');
    n.textContent = p.name;
    a.appendChild(n);
    a.appendChild(document.createTextNode(p.url));
    box.appendChild(a);
  });
}

/* The code box and the request form. They live outside #gate because they
   were here first and the server fills the second one — the mode decides
   which, if either, is on screen.

   The request half is handed to paintRequest, which is the one that knows
   whether this deployment takes requests at all. Two functions writing the
   same display property would be a race decided by call order. */
/* THE CODE BOX, AND ONLY THAT. The request half belongs to paintRequest,
   which is the one that knows whether this deployment takes requests at all —
   and which now calls paintGate. If this called it back the two would loop. */
function paintGateAreas(){
  const enrol = $('enrol');
  if (enrol) enrol.style.display = GATE === 'code' ? 'flex' : 'none';
}

function gateMode(m){
  GATE = m;
  const note = $('gatenote');
  if (note){ note.className = ''; note.textContent = ''; }
  paintGate();
  /* The request half, which paintGate no longer reaches. Called after it so
     the form is drawn against the mode that was just set. */
  paintRequest();
  const first = $(m === 'code' ? 'enrolcode'
                 : m === 'setup' ? 'gatepass' : 'gateuser');
  if (first && first.offsetParent !== null) first.focus();
}

/* SIGNING IN. The one credential that does not need this browser to have been
   anywhere before. */
async function doLogin(){
  const note = $('gatenote');
  const email = ($('gateuser').value || '').trim();
  const password = $('gatepass').value || '';
  if (!email || !password) return;
  note.className = '';
  note.textContent = 'checking…';
  try{
    const r = await fetch('user/login', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({email, password}),
    });
    const j = await r.json().catch(()=>({}));
    if (!r.ok){
      $('gatepass').value = '';
      note.className = 'bad';
      note.textContent = j.error || 'that did not work';
      announce(S.loginbad);
      return;
    }
    announce(S.loginok);
    await gateArrived(j);
  }catch(e){
    note.className = 'bad';
    note.textContent = 'could not reach the server';
  }
}

/* SPENDING THE LINK. The password is chosen here and nowhere else — an admin
   who set it would know it. */
async function doSetup(){
  const note = $('gatenote');
  const password = $('gatepass').value || '';
  const again = $('gatepass2').value || '';
  if (!password) return;
  if (password !== again){
    note.className = 'bad';
    note.textContent = 'those two do not match';
    return;
  }
  note.className = '';
  note.textContent = 'saving…';
  try{
    const r = await fetch('user/setup', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({password}),
    });
    const j = await r.json().catch(()=>({}));
    if (!r.ok){
      note.className = 'bad';
      note.textContent = j.error || 'that did not work';
      return;
    }
    await gateArrived(j);
  }catch(e){
    note.className = 'bad';
    note.textContent = 'could not reach the server';
  }
}

/* WHAT BOTH DOORS OPEN ONTO. The session exists now, so the server answers
   `hello` with a person where a moment ago it answered with an unapproved
   display — which is what takes this page off the gate and onto the product.
   Asking it again rather than assuming: the answer decides what this browser
   IS, and guessing it here would be a second opinion about that. */
async function gateArrived(j){
  const note = $('gatenote');
  $('gatepass').value = '';
  if ($('gatepass2')) $('gatepass2').value = '';
  if (j && j.settings) Prefs.adopt(j.settings);
  if (note){ note.className = ''; note.textContent = ''; }
  /* ON THE ENROLMENT LISTENER THIS IS THE END OF IT. There is nothing here to
     become — asking `hello` again would 404, and the product this account now
     opens is on other ports. So the page says which, and stops. */
  if (ENROL_ONLY){
    PLACES = (j && j.places) || [];
    GATE = 'done';
    paintGate();
    return;
  }
  await Display.hello();
  /* AND THE ROUTES AGAIN. `allowed` is this caller's answer, computed when the
     list was fetched — and the caller has just changed from nobody to a
     signed-in person. Without this the page would re-paint against the
     anonymous answer and keep showing the gate it just let somebody through. */
  await Routes.load();
  syncWake();
  paintRequest();
  applyPrefs();
}

/* Said even where hello never reports a person, which is what a failure is:
   a link that means nothing leaves no cookie to report. */
if (PERSON_ARRIVED === 'bad')
  window.addEventListener('DOMContentLoaded', paintGate);
/* The forced state. Nothing else can be done on this page until there is a
   password, so it is set before anything paints rather than switched to. */
if (PERSON_ARRIVED === 'setup') GATE = 'setup';

/* ================================================================= DISPLAY
   Which physical thing this page is running on, as far as the server is
   concerned — the tablet in the kitchen rather than a browser tab.

   The server issues an unguessable token on the first visit and holds it in
   an HttpOnly cookie, so nothing here can read it, spend it anywhere else, or
   hand it to a page that asks. This object holds only what came BACK: an id
   to show somebody who is approving it, the name it is listed under, and
   whether that has happened.

   Unapproved is a working state, not an error. The appearance settings are
   public, so a new tablet shows the geometry correctly the moment it is hung;
   it holds no approved token, so no restricted endpoint will answer it. Hang
   it, see it appear in the admin list, approve it, and it starts working —
   which is a better first five minutes than a screen that looks broken. */
const Display = {
  id: '', name: DISPLAY_NAME, named: DISPLAY_NAME, approved: false, known: false,
  /* This SCREEN's half of the diagnostic strip. The person signed in at it
     carries the other half, and either is enough — see syncStatusLine. */
  status: false,
  /* What the server last said about this device. `state` is one of none,
     requested, approved, expired, denied — and the page is built from it
     rather than from three booleans that can disagree with each other. */
  state: 'none', canRequest: false, form: [], answered: false,
  reason: '', mayAskAgain: true, renewals: 0,

  /* A coarse description of the device, and it is a HINT FOR THE PERSON
     APPROVING — "this matches your approved kitchen display" — for the one
     case a token cannot survive, which is a browser wiping its data. It must
     never become the credential, and nothing on the server reads it as one:
     every field here is forgeable from the console in one line. */
  hint(){
    let zone = '';
    try{ zone = Intl.DateTimeFormat().resolvedOptions().timeZone || ''; }catch(e){}
    return [(screen.width|0) + '×' + (screen.height|0),
            (navigator.platform || ''), (navigator.language || ''), zone]
           .filter(Boolean).join(' · ').slice(0, 120);
  },

  /* Said once, on load, before the endpoints are asked for — the answer
     decides which of them come back with a word attached. An embed says
     nothing: it is not a display, its rights came from its key, and letting
     one enrol would put a row in somebody's approval queue every time a host
     page loaded. */
  async hello(){
    if (EMBED) return false;
    try{
      const r = await fetch('display/hello', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({name: DISPLAY_NAME, hint: this.hint()})
      });
      const j = await r.json().catch(()=>({}));
      /* A PERSON, not a place. The server answers one or the other and never
         both — an approved display is a device whatever else is in the cookie
         jar, and below that line a person's cookie wins. There is no display
         state to take: this browser is not a screen anybody hung, and which
         endpoints it may reach comes back on /routes the same as ever. */
      if (r.ok && j.person){
        Person.take(j.person);
        return true;
      }
      if (!r.ok || !j.display) return false;
      this.take(j.display);
      return true;
    }catch(e){ return false; }
  },

  /* One place where the server's answer becomes this object, because every
     path that touches a display — hello, the request, the poll — returns the
     same shape and none of them should be assembling it differently. */
  take(d){
    this.id = d.id || '';
    this.status = !!d.status;
    this.name = d.name || DISPLAY_NAME;
    /* A NAME OR NOTHING — see display_named. `name` above carries the list's
       placeholder for a row nobody has named, which is right in a note about
       this screen and wrong as the speaker of a line of transcript. */
    this.named = d.named || DISPLAY_NAME;
    this.approved = !!d.approved;
    this.state = d.state || 'none';
    /* Where this browser goes to choose a password, on a request that was
       approved into an account. Empty on every other row. */
    this.setupUrl = d.setup_url || '';
    this.canRequest = !!d.can_request;
    this.form = d.form || [];
    this.answered = !!d.answered;
    this.reason = d.reason || '';
    this.mayAskAgain = d.may_ask_again !== false;
    this.renewals = d.renewals || 0;
    /* Seconds, from the server, so a device with a wrong clock cannot talk
       itself into more access than it was given. Zero means it never runs
       out, which is every display an admin issued a code for. */
    this.expiresIn = d.expires_in || 0;
    if (typeof syncStatusLine === 'function') syncStatusLine();
    /* What this place looks like, as opposed to what it may do. It arrives on
       the same answer because it belongs to the same row, and it is applied
       whatever the state is: a tablet waiting to be approved is already on a
       wall, and the panel nobody has opened yet is exactly the case where a
       screen sits burning an image into itself. */
    Kiosk.take(d.kiosk);
    this.known = true;
  },

  /* An admin approves it over in the panel, and nothing about that reaches
     this page on its own — so while it is waiting, it asks again. "Hang it,
     see it appear in the list, approve it, and it starts working" has to mean
     without somebody walking back to the tablet to reload it.

     Only while waiting. Once approved there is nothing left to poll for, and
     approval taken away is caught at the server, which refuses the request
     whatever this page believes. */
  _t: 0,
  watch(){
    if (EMBED || PREVIEW || !this.known) return;
    clearInterval(this._t);
    /* Approved and never expiring is the one state with nothing left to find
       out. Everything else is waiting on somebody: a decision, a refusal being
       lifted, or a grant running out. */
    if (this.state === 'approved' && !this.expiresIn) return;
    this._t = setInterval(async ()=>{
      const was = this.state;
      await this.hello();
      if (this.state === was) return;
      await Routes.load();
      syncWake();
      paintRequest();
      /* APPROVED INTO AN ACCOUNT. They are standing here waiting on a
         decision and the decision was yes, so this takes them to the box that
         chooses their password rather than telling them to go and find a link
         somebody has to send. Spending the link sets the cookie and comes back
         with ?person=setup, which is the forced state on the gate. */
      if (this.state === 'setup' && this.setupUrl){
        clearInterval(this._t);
        location.href = this.setupUrl;
        return;
      }
      if (this.state === 'approved'){
        clearInterval(this._t);
        verdict('Approved', 'This device may now use '
          + (Routes.spoken() ? 'the assistants it was granted. Say '
                               + Routes.spoken() + ' to start.'
                             : 'what it was granted.'));
        micNote('approved as ' + this.name
                + (Routes.spoken() ? ' — say ' + Routes.spoken() : ''));
      }else if (this.state === 'denied'){
        clearInterval(this._t);
        verdict('Not approved', this.reason
          || 'This device was not given access, and no reason was given.');
      }else if (this.state === 'expired'){
        clearInterval(this._t);
        verdict('Access expired', 'This device’s access has run out. Ask '
          + 'again and somebody will decide — you will not have to fill in '
          + 'the form a second time.');
      }
    }, 20000);
  },
};

/* ================================================================== WALL
   What makes a tablet bolted to a wall a different object from a browser
   tab. Two settings, both hanging off the display record above, and neither
   of them touching what this server will answer — this is entirely canvas
   and presentation.

   VOICE ONLY is the geometry alone: no transcript, no composer. A hallway is
   not a workstation, and a screen of scrolling text in one is neither useful
   nor discreet.

   It OUTRANKS the viewer's own control, which is a reversal worth stating.
   The three controls in the bar were built to beat the shared settings
   deliberately, because a person in front of a screen knows better than a
   document does. This is the exception: it is a policy for a PLACE rather
   than the preference of a passer-by. And where it applies the TEXT button is
   REMOVED, not disabled — a control that is present and ignores you is worse
   than one that was never offered.

   What it does not do is overwrite what the viewer chose. The preference
   stays in localStorage untouched, so a display taken off the wall and turned
   back into an ordinary tab gets that person's own choice back rather than
   the policy's. */
/* THE WALL CLOCK. Whether it appears is the layout's (`clock`); what it says
   is the deployment's, under SETTINGS ▸ ADMIN ▸ Time format, and arrives in
   the shared settings as `clock_time` and `clock_date`.

   THE DEVICE'S OWN CLOCK, deliberately. The server's time is what a screen is
   told for anything it has to agree with the server about — a token's life, a
   check-in window — and this is the opposite: it is the time in the room, read
   by somebody standing in it, and a tablet whose clock is wrong is a tablet
   whose owner wants to know. */
const Clock = {
  timer: 0,
  start(){ this.paint(); this.arm(); },
  stop(){ clearTimeout(this.timer); this.timer = 0; },
  /* ON THE MINUTE, not every sixty seconds from whenever this happened to
     start: a clock that turns over at seventeen seconds past is one people
     notice, and two screens in a corridor disagreeing by half a minute is
     worse than either being a second late. */
  arm(){
    clearTimeout(this.timer);
    const now = new Date();
    const ms = (60 - now.getSeconds()) * 1000 - now.getMilliseconds();
    this.timer = setTimeout(()=>{ this.paint(); this.arm(); },
                            Math.max(1000, ms));
  },
  two(n){ return String(n).padStart(2, '0'); },
  time(d){
    const f = S.clock_time || 'locale';
    if (f === '24')
      return d.toLocaleTimeString([], {hour: '2-digit', minute: '2-digit',
                                       hour12: false});
    if (f === '12')
      return d.toLocaleTimeString([], {hour: 'numeric', minute: '2-digit',
                                       hour12: true});
    /* The device's own, and the two-digit hour is not forced: a region that
       writes 9:05 should write 9:05 here too. */
    return d.toLocaleTimeString([], {hour: 'numeric', minute: '2-digit'});
  },
  date(d){
    const f = S.clock_date || 'locale';
    if (f === 'none')    return '';
    if (f === 'weekday')
      return d.toLocaleDateString([], {weekday: 'long', day: 'numeric',
                                       month: 'long'});
    if (f === 'dmy') return this.two(d.getDate()) + '/'
                          + this.two(d.getMonth() + 1) + '/' + d.getFullYear();
    if (f === 'mdy') return this.two(d.getMonth() + 1) + '/'
                          + this.two(d.getDate()) + '/' + d.getFullYear();
    if (f === 'iso') return d.getFullYear() + '-' + this.two(d.getMonth() + 1)
                          + '-' + this.two(d.getDate());
    return d.toLocaleDateString();
  },
  paint(){
    const t = $('cktime'), dl = $('ckdate');
    if (!t || !dl) return;
    const now = new Date();
    t.textContent = this.time(now);
    dl.textContent = this.date(now);
  },
};

const Kiosk = {
  on: false,
  voiceOnly: false,
  fullscreen: true,
  keepAwake: true,
  prompt: true,
  promptText: '',
  /* The buttons a wall takes away, and where each came from, so removing them
     is REVERSIBLE. Turning the policy off has to give the control back
     without somebody walking to the tablet and reloading it — and the panel's
     preview turns it on and off while an admin makes their mind up. */
  _kept: {},
  _pull(id, gone){
    let k = this._kept[id];
    if (!k){
      const el = $(id);
      if (!el) return;
      k = this._kept[id] = {el: el, slot: el.parentNode};
    }
    if (gone) k.el.remove();
    else if (!k.el.parentNode && k.slot) k.slot.appendChild(k.el);
  },

  /* The four appearance values this place overrides, or null for "whatever
     everybody gets". Held rather than written straight into S, because the
     shared settings arrive on their own schedule and loading them overwrites
     S wholesale — so this has to be re-applied after, not merely once. */
  look: null,

  take(w){
    w = w || {};
    this.on = !!w.kiosk;
    this.voiceOnly = !!w.voice_only;
    this.look = w.look || null;
    /* Both default ON where the server said nothing, so the panel's preview —
       which sends an appearance or a screensaver and nothing else — does not
       read as a kiosk that has had its full screen and its prompt switched
       off. */
    this.fullscreen = w.fullscreen !== false;
    this.keepAwake = w.keep_awake !== false;
    /* Unlike the two above it this defaults OFF where the server said
       nothing: those are conveniences a preview should show, and this one
       opens a microphone. */
    this.listen = !!w.listen;
    this.prompt = w.prompt !== false;
    this.promptText = w.prompt_text || '';
    /* OFF where the server said nothing, like `listen` and unlike the two
       above it: those are conveniences a preview should show anyway, and a
       clock is a decision about a place. */
    this.clock = !!w.clock;
    Saver.configure(w.saver);
    this.apply();
  },

  /* A hallway read at three metres and a laptop at fifty centimetres cannot
     both be right in one document, which is the whole reason this exists. Only
     the four a PLACE changes: everything else stays shared, so tuning the
     bloom once still reaches every screen in the building.

     Nothing to undo when it is null. The shared document is already in S, and
     a screen with no profile is a screen that never had one. */
  applyLook(){
    if (!this.look) return false;
    let n = 0;
    Object.keys(this.look).forEach(k=>{
      if (k in S && S[k] !== this.look[k]){ S[k] = this.look[k]; n++; }
    });
    if (n) repaintAll();
    return n > 0;
  },

  apply(){
    document.body.toggleAttribute('data-kiosk', this.on);
    document.body.toggleAttribute('data-voiceonly', this.voiceOnly);
    /* NOT IN AN EMBED. A host page composes what it wants from the parts it
       was granted, and a clock arriving because the endpoint's layout happens
       to have one ticked is this product decorating somebody else's page. */
    document.body.toggleAttribute('data-clock', this.clock && !EMBED);
    if (this.clock && !EMBED) Clock.start(); else Clock.stop();
    this.applyLook();

    /* SPEAK ONLY, and it follows from being on a wall rather than being a
       fourth thing to tick. Push-to-talk holds the SPACE bar, and a tablet
       bolted to a wall has no space bar — a screen whose interaction model
       needs a keyboard nobody standing in front of it has is not a wall
       display, it is a workstation somebody screwed to a wall.

       It is also what makes the resting prompt true. The wake gate is
       inactive in push-to-talk, so "say the name" would be an instruction
       that does nothing; in AUTO the name is exactly how you reach it. */
    this._pull('pttbtn', this.on);
    if (this.on) setPtt(false);
    else if (!PREVIEW && Prefs.has('ptt')) setPtt(Prefs.get('ptt'));

    this._pull('textbtn', this.voiceOnly);
    if (this.voiceOnly){
      setTextVisible(false);            // no `remember` — see above
    }else{
      /* Back to the viewer's own choice, which was never overwritten. A
         preview takes the fresh-viewer default instead: the admin is looking
         at what somebody else gets, not at their own habits. */
      setTextVisible(PREVIEW ? true : Prefs.get('text', true));
    }
    if (typeof paintPrompt === 'function') paintPrompt();
    if (this.listen) this.startListening();
  },

  /* WHY THIS EXISTS. A wall screen has nobody standing at it, and TALK is a
     button. Every reload — a settings change the panel published, a network
     blip, the browser restarting overnight — otherwise left the hallway deaf
     until somebody walked up and touched it, which is exactly the person the
     screen was supposed to save the walk.

     WHAT IT CANNOT PROMISE. The browser decides whether a page may open a
     microphone without a gesture, and the answer is no until the permission
     has been granted persistently for this origin. So this is a REQUEST: it
     tries, and when it is refused it says so on the status line and arms the
     first touch to try again — which is the same single touch that asks for
     the full screen and ends the screensaver. A screen hung for the first
     time still needs one visit; after that it comes back by itself.

     `_tried` rather than a retry loop: a display refused permission is
     refused for a reason, and asking again sixty times a second is how a
     page gets its microphone permission revoked for good. */
  _tried: false,
  async startListening(){
    if (this._tried || PREVIEW || EMBED) return;
    if (Mic.active || Listen.on) return;
    if (!Mic.ok || !window.isSecureContext) return;   // already said on the line
    this._tried = true;
    try {
      await Mic.start();
    } catch(e){ /* Mic.start reports on the status line itself */ }
    if (Mic.active){ Listen.start(Mic.stream); return; }
    /* Refused, or not granted yet. Hand it to the first touch. */
    this._pending = true;
    micNote('waiting for permission — touch the screen once to start listening');
  },

  /* Called from the one first-touch handler. A gesture is the thing that was
     missing, so this is the moment it can work. */
  touched(){
    if (!this._pending) return;
    this._pending = false;
    this._tried = false;
    this.startListening();
  },
};

/* ------------------------------------------------- asking for access
   A device that may not use anything gets the figure and a form where the
   transcript and the composer would be. Both of those are wired to endpoints
   this device cannot reach, so drawing them would be two controls that only
   ever refuse.

   The form is the admin's, field for field. This server has no opinion about
   what a request should ask for — somebody running a campus wants a name and a
   department, somebody running a house wants nothing at all. */
function paintRequest(){
  const box = $('request');
  if (!box || EMBED || PREVIEW) return;
  const D = Display;
  /* A code works whatever this device's state is and whether or not anybody
     may ask for access — so the panel appears for ANY screen that is not
     approved, where it used to appear only for one that could request.
     With guest requests switched off, an unapproved screen showed nothing at
     all: no form, because none was allowed, and no way to use a code, because
     there had never been one. A device an admin had just made a code for had
